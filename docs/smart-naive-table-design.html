/* ============================================================
   纵向虚拟滚动 —— 表格主体 / 窄档卡片列表:DOM 里只有「可见行 + 上下各 VS_BUF 行缓冲」,其余用上下两个 spacer 撑出总高度。

   官方依据(naive-ui 2.45.3,D:\Andy\smart-naive-table\node_modules\naive-ui\es\data-table\src):
   - 虚拟滚动**要求**有受限的高度:官方 VirtualList 容器样式是 height:100%; overflow:auto(vueuc virtual-list/src/VirtualList.js:12-15),
     所以外层必须给 max-height 或 flex-height。证据:MainTable.mjs:90 只有 maxHeight / flexHeight 二选一开启时表头才拆出来固定;
     Body.mjs:436 滚动条 scrollable = explicitlyScrollable(use-scroll.mjs:14 = scrollX || maxHeight || flexHeight)|| xScrollable。
     只开 virtual-scroll、不给高度,就没有任何滚动容器 —— 原型对应的是 flex-height(卡片撑满父容器,表格主体 flex:1)。
   - 虚拟滚动 / flex-height / max-height 任一开启都强制 table-layout: fixed(DataTable.mjs:139-141)→ 这里也是 fixed + <colgroup>。
   - 行高:VirtualList 的 itemSize = minRowHeight,默认 28(interface.mjs:67-70;Body.mjs:789),行可变高(itemResizable = !virtualScrollX,Body.mjs:801)。
     原型的行高由密度决定并在 CSS 里固定(--vs-row-h),再渲染后量一次实际间距校正,保证 spacer 与真实行高一致。
   - 官方窗口只多渲染约 1 行缓冲(vueuc VirtualList.js:157-166:startIndex = 起点 - 1、endIndex = start + ceil(视口高 / itemSize + 1));
     原型取上下各 6 行:滚轮快速滚动时一帧内不露白(rAF 合并重绘)。
   - 翻页回到顶部:use-scroll.mjs:207-209 watch(mergedCurrentPage) → scrollMainTableBodyToTop。原型:翻页 / 改页大小 / 筛选条件变化 → scrollTop 归 0。
   ============================================================ */
const VS_BUF = 6;                                   // 窗口上下缓冲行数
const VS_ROW = { normal: 45, compact: 37 };         // 行高(px)= td 上下内边距 11+11 / 7+7 + 行高 22 + 下边框 1;与 fill.css 的 --vs-row-h 一致,渲染后会实测校正
const VS_VIEW_FALLBACK = 600;                       // 拿不到容器高度时(未布局 / 隐藏)按此估算窗口
const vt = {
  sc: null, list: null, kind: '', n: 0, a: -1, b: -1, pitch: 0, head: 0,   // 滚动容器 / 行容器 / 表格|卡片 / 行数 / 当前窗口 [a,b) / 行间距 / 表头高
  rows: [], cols: [], ck: new Set(), sig: '', density: 'normal',
  raf: 0, ro: null, pending: null, kept: null, cache: {},                  // rAF 句柄 / ResizeObserver / tableEHtml 交给 vsMount 的数据 / 上次的滚动位置 / 实测间距缓存
};

/* 卡片间距的首次估算(实测后覆盖):内边距 12 ×2 + 标题 25.6 + 字段网格 + 操作行 57(8 + 4 + 44 + 1)+ 卡片间距 8。卡片固定舒适间距,不分密度 */
function vsCardEst(nCols) {
  const fields = Math.max(0, nCols - 1), rows = Math.ceil(fields / 2);
  return 24 + 25.6 + (rows ? 8 + rows * 20.8 + (rows - 1) * 8 : 0) + 57 + 8;
}

function rowHtml(r, cols, on, i) {
  return `<tr${on ? ' class="hit"' : ''} data-i="${i}" aria-rowindex="${i + 2}"><td class="ck">${checkHtml(on, false, 'toggleRow', r.no)}</td>${
    cols.map(c => `<td${c.num ? ' class="num"' : ''}>${cellHtml(c, r)}</td>`).join('')
  }<td class="acts">
          <button class="n-btn text" data-act="edit" data-v="${esc(r.no)}">编辑</button>
          <button class="n-btn text danger" data-act="del" data-v="${esc(r.no)}">删除</button></td></tr>`;
}
const padRowHtml = (n) => `<tr class="vs-pad" aria-hidden="true" style="height:0px"><td colspan="${n}"></td></tr>`;

/* 表头单元格。模块 3 / 4:标题 + 排序箭头(th 整体可点排序)+ 右缘漏斗热区(独立点击目标);其余模块只有标题 */
function thHtml(c, i = 0) {
  const rz = `<span class="th-resize" data-act="noop" data-rz="${c.key}" title="拖动调整列宽"></span>`;   // 宿主开启 resizable;data-act=noop 让点把手既不触发排序也不收浮层
  const z = `z-index:${20 + visibleCols().length - i}`;   // 靠前的列 z-index 更高:把手骑在列界上、伸进下一列的那一半才不会被下一列盖住
  if (!hdrMod()) return `<th data-ck="${c.key}" style="${z}"><span class="th-txt">${c.label}</span>${rz}</th>`;
  const s = sortable(c.key), order = sortOrderOf(c.key), n = hfCount(c.key);
  const open = !!state.hp && state.hp.key === c.key && state.tier !== 'narrow';
  const cls = ['h-th', s && 'sortable', order && 'sorting', open && 'f-open'].filter(Boolean).join(' ');
  return `<th class="${cls}" data-ck="${c.key}" style="${z}"${s ?` data-act="sortClick" data-v="${c.key}" aria-sort="${order === 'ascend' ? 'ascending' : order === 'descend' ? 'descending' : 'none'}"` : ''}>
    <div class="th-wrap"><span class="th-title">${c.label}</span><button class="th-filter${n ? ' on' : ''}${open ? ' show' : ''}" data-act="hfOpen" data-v="${c.key}" data-fk="${c.key}" aria-label="筛选 ${c.label}${n ? `(已筛选 ${n} 条)` : ''}" aria-haspopup="dialog" aria-expanded="${open}">${I_FUNNEL}${n > 1 ? `<i class="hf-n">${n}</i>` : ''}</button>${s
      ? `<span class="th-sorter${order ? ` on ${order === 'ascend' ? 'asc' : 'desc'}` : ''}">${I_ARROW}</span>` : ''}</div>${rz}</th>`;
}

/* 表格 + 卡片:只输出当前档位要显示的那一份(窄档 = 卡片列表,其余 = 表格),行由 vsMount 按窗口填进去;
   表头复选框的全选 / 半选按当前页全部行判断(NDataTable use-check.mjs:33-63),不是按可见行;勾选本身跨页保留 */
function tableEHtml() {
  const pi = pageInfo();
  const rows = pi.slice;
  const cols = visibleCols();
  const ck = new Set(state.checked);
  const sel = rows.filter(r => ck.has(r.no)).length;
  const all = rows.length > 0 && sel === rows.length;
  const half = sel > 0 && !all;
  const emptyTxt = '没有符合条件的数据';
  const narrow = state.tier === 'narrow';
  /* 「页」的签名:页 / 页大小 / 生效条件任一变了,滚动位置回到顶部;其余重绘(勾选、删除、新增、列设置、密度……)保持位置 */
  const sig = [state.mod, pi.page, pi.size, JSON.stringify(currentConds().filter(isActive)), JSON.stringify(activeSorts())].join('|');
  const frozen = isFrozen();   // 拖过列宽:所有列冻结成固定宽度;最后一个数据列不钉宽,吸收剩余宽度(右侧不留白、也没有多出来的空列)
  vt.pending = { kind: narrow ? 'cards' : 'table', rows, cols, ck, sig, density: state.compact ? 'compact' : 'normal' };

  let main;
  if (narrow) {
    main = `<div class="tbl-cards" data-vs="cards">${rows.length
      ? '<div class="vs-pad" aria-hidden="true"></div><div class="vs-pad" aria-hidden="true"></div>'
      : `<p style="margin:0;padding:34px 12px;text-align:center;color:var(--n-text-3)">${emptyTxt}</p>`}</div>`;
  } else {
    const flexKey = frozen ? fillColKey(cols) : (cols.find(c => c.flex) ?? cols[0]).key;   // 没拖过:弹性列 = 名称(被隐藏时退到第一个可见列);拖过:弹性列 = 最后一个数据列
    const minW = tableMinW(cols);
    const nCol = cols.length + 2;
    const colgroup = `<colgroup><col style="width:${CK_W}px">${
      cols.map(c => c.key === flexKey ? '<col>' : `<col style="width:${cw(c)}px">`).join('')}<col style="width:${ACTS_W}px"></colgroup>`;
    const body = rows.length ? padRowHtml(nCol) + padRowHtml(nCol)
      : `<tr class="empty-row"><td colspan="${nCol}">${emptyTxt}</td></tr>`;
    main = `<div class="tbl-table"><div class="tbl-scroll" data-vs="table"><table class="n-table" style="min-width:${minW}px" aria-rowcount="${rows.length + 1}">${colgroup}
      <thead><tr aria-rowindex="1"><th class="ck">${checkHtml(all, half, 'toggleAll')}</th>${
        cols.map(thHtml).join('')}<th class="acts">操作</th></tr></thead>
      <tbody>${body}</tbody>
    </table></div></div>`;
  }
  return `${main}
    ${paginationHtml(pi)}`;
}

/* ---- 窗口计算与绘制 ---- */
/* 给定 scrollTop,算可见行 [first, last](含部分可见)与窗口 [a, b)。
   表格:表头 sticky 占住上方 head 高度,行 i 在内容坐标里的顶边 = head + i*pitch,所以 first = floor(scrollTop / pitch)(表头把 scrollTop 那一段盖住了) */
function vsRange(top) {
  const view = vt.sc.clientHeight || VS_VIEW_FALLBACK, n = vt.n, pitch = vt.pitch;
  const first = Math.max(0, Math.min(Math.floor(top / pitch), n - 1));
  const last = Math.max(first, Math.min(Math.ceil((top + view - vt.head) / pitch) - 1, n - 1));
  return { first, last, a: Math.max(0, first - VS_BUF), b: Math.min(n, last + 1 + VS_BUF) };
}

function vsItemsHtml(i0, i1) {
  let h = '';
  for (let i = i0; i < i1; i++) {
    const r = vt.rows[i], on = vt.ck.has(r.no);
    h += vt.kind === 'table' ? rowHtml(r, vt.cols, on, i) : cardHtml(r, vt.cols, vt.ck, i);
  }
  return h;
}

/* 只动窗口边缘的行:滚出窗口的删掉,新进窗口的插进去,中间的行原样保留(不丢 hover / 焦点);两个 spacer 高度随窗口更新 */
function vsPaint(a, b, force) {
  const list = vt.list, top = list.firstElementChild, bot = list.lastElementChild;
  const oa = vt.a, ob = vt.b;
  if (force || oa < 0 || b <= oa || a >= ob) {
    while (top.nextElementSibling !== bot) top.nextElementSibling.remove();
    bot.insertAdjacentHTML('beforebegin', vsItemsHtml(a, b));
  } else {
    for (let i = oa; i < Math.min(a, ob); i++) top.nextElementSibling.remove();
    for (let i = Math.max(b, oa); i < ob; i++) bot.previousElementSibling.remove();
    if (a < oa) top.insertAdjacentHTML('afterend', vsItemsHtml(a, oa));
    if (b > ob) bot.insertAdjacentHTML('beforebegin', vsItemsHtml(ob, b));
  }
  top.style.height = a * vt.pitch + 'px';
  bot.style.height = (vt.n - b) * vt.pitch + 'px';
  vt.a = a; vt.b = b;
}

function vsSync(force, topOverride) {
  if (!vt.sc || !vt.n) return;
  const { a, b } = vsRange(Math.max(0, topOverride ?? vt.sc.scrollTop));
  if (!force && a === vt.a && b === vt.b) return;
  vsPaint(a, b, force);
}

/* 量真实的行间距 / 表头高;与当前值差 > 0.05px 就采纳并写缓存(缩放 / 字体差异会让整数假设失真)。返回是否变了 */
function vsMeasure() {
  const items = [...vt.list.children].filter(x => !x.classList.contains('vs-pad'));
  if (!items.length) return false;
  const r0 = items[0].getBoundingClientRect();
  let pitch;
  if (items.length > 1) pitch = (items[items.length - 1].getBoundingClientRect().top - r0.top) / (items.length - 1);
  else pitch = r0.height + (vt.kind === 'cards' ? (parseFloat(getComputedStyle(items[0]).marginBottom) || 0) : 0);
  let changed = false;
  if (pitch > 4 && Math.abs(pitch - vt.pitch) > 0.05) { vt.pitch = pitch; changed = true; }
  if (vt.kind === 'table') {
    const h = vt.sc.querySelector('thead')?.getBoundingClientRect().height ?? 0;
    if (h > 4 && Math.abs(h - vt.head) > 0.05) { vt.head = h; changed = true; }
  }
  vt.cache[`${vt.kind}|${vt.kind === 'cards' ? '-' : vt.density}|${vt.cols.length}`] = { pitch: vt.pitch, head: vt.head };
  return changed;
}

function vsSchedule() {
  if (vt.raf) return;
  vt.raf = requestAnimationFrame(() => { vt.raf = 0; vsSync(false); });
}

function vsOnScroll() {
  const sc = vt.sc;
  if (!sc) return;
  vt.kept = { top: sc.scrollTop, kind: vt.kind, sig: vt.sig, pitch: vt.pitch };
  if (state.hp) placeHpop();   // 列头过滤气泡跟着漏斗走(横向滚动时漏斗移动,滚出可视区就藏起来)
  if (vt.n) {
    const r = vsRange(sc.scrollTop);
    if (r.first < vt.a || r.last >= vt.b) { vsSync(false); return; }   // 拖滚动条跳出了缓冲区:立刻补,不等下一帧
  }
  vsSchedule();
}

function vsUnmount() {
  if (vt.raf) { cancelAnimationFrame(vt.raf); vt.raf = 0; }
  if (vt.ro) { vt.ro.disconnect(); vt.ro = null; }
  vt.sc = null; vt.list = null;
}

/* renderPreview 换完 DOM 后调用:接管新的滚动容器,画出第一屏窗口,恢复 / 归零滚动位置,挂 scroll 与尺寸监听 */
function vsMount(root) {
  vsUnmount();
  const p = vt.pending;
  vt.pending = null;
  const sc = root.querySelector('[data-vs]');
  if (!p || !sc) return;
  Object.assign(vt, { sc, kind: p.kind, rows: p.rows, cols: p.cols, ck: p.ck, n: p.rows.length, sig: p.sig, density: p.density, a: -1, b: -1 });
  vt.list = p.kind === 'table' ? sc.querySelector('tbody') : sc;
  const keep = vt.kept && vt.kept.sig === p.sig && vt.kept.kind === p.kind ? vt.kept : null;   // 页 / 页大小 / 条件 / 档位变了 -> 不沿用,回顶部
  let top = keep ? keep.top : 0;

  if (vt.n) {
    const cached = vt.cache[`${p.kind}|${p.kind === 'cards' ? '-' : p.density}|${p.cols.length}`];
    vt.pitch = cached?.pitch ?? (p.kind === 'table' ? VS_ROW[p.density] : vsCardEst(p.cols.length));
    vt.head = p.kind === 'table' ? (cached?.head ?? VS_ROW[p.density]) : 0;
    vsSync(true, top);
    const oldPitch = keep?.pitch;
    if (vsMeasure() || (oldPitch && Math.abs(oldPitch - vt.pitch) > 0.05)) {
      /* 行高变了(密度切换 / 首次实测):以「顶部那一行」为锚,滚动位置按新行高换算,窗口重画 */
      if (oldPitch && Math.abs(oldPitch - vt.pitch) > 0.05) top = Math.floor(top / oldPitch) * vt.pitch;
      vsSync(true, top);
    }
    sc.scrollTop = top;                                   // 先有 spacer 撑出总高度,再写 scrollTop
    vsSync(false);                                        // 浏览器可能夹了 scrollTop(例如删除后内容变短),按真实值再对一次窗口
  }
  vt.kept = { top: sc.scrollTop, kind: p.kind, sig: p.sig, pitch: vt.pitch };
  sc.addEventListener('scroll', vsOnScroll, { passive: true });
  if (typeof ResizeObserver === 'function') { vt.ro = new ResizeObserver(vsSchedule); vt.ro.observe(sc); }   // 窗口 / 卡片高度变了,可见行数跟着变
}

/* 列设置气泡:每列一个复选项,勾掉的列在表格和卡片里同步隐藏 */
function colsPanelHtml() {
  return `<div class="col-pop" data-stop>${COLS.map(c => {
    const on = !state.hidden.includes(c.key);
    return `<div class="it" data-act="colToggle" data-v="${c.key}">${checkHtml(on, false)}<span>${c.label}</span></div>`;
  }).join('')}</div>`;
}

/* 「更多」:业务按钮组末尾的一个菜单按钮(设计文档 7.3)。导出 / 导入 / 下载导入模板是宿主给的菜单项,库只出菜单外壳;
   文字按钮 + 下箭头(不用「…」:模块 2 的条件行已有一个「»」图标叫「更多条件」,图标不重名)。
   菜单项与分隔线对应官方 NDropdown 的 options(含 { type: 'divider' }) */
const MORE_ITEMS = [
  { act: 'export', label: '导出' },
  { act: 'import', label: '导入' },
  { sep: true },
  { act: 'tpl', label: '下载导入模板' },
];
function moreHtml() {
  return `<span class="pop-wrap"><button class="n-btn${state.moreOpen ? ' on' : ''}" data-act="more" aria-haspopup="menu" aria-expanded="${state.moreOpen}">更多<span class="chev">${I_CHEV}</span></button>${
    state.moreOpen ? `<div class="col-pop more-pop" role="menu" data-stop>${MORE_ITEMS.map(it => it.sep
      ? '<div class="sep" role="separator"></div>'
      : `<div class="it" role="menuitem" tabindex="-1" data-act="${it.act}">${it.label}</div>`).join('')}</div>` : ''}</span>`;
}

/* 右侧内置图标:刷新 / 列设置。没有密度按钮:密度是个人偏好,由宿主的个人设置经 defaultDensity 决定(设计文档 5.2),原型宿主默认 compact */
function iconsHtml() {
  return `<div class="tb-icons">
    <button class="n-btn icon${state.max ? ' on' : ''}" data-act="max" title="${state.max ? '还原' : '放大'}" aria-label="${state.max ? '还原' : '放大'}" aria-pressed="${state.max}">${state.max ? I_COMPRESS : I_EXPAND}</button>
    <button class="n-btn icon" data-act="refresh" title="刷新">${I_REFRESH}</button>
    <span class="pop-wrap"><button class="n-btn icon ${state.colsOpen ? 'on' : ''}" data-act="cols" title="列设置">${I_SETTING}</button>${
      state.colsOpen ? colsPanelHtml() : ''}</span>
  </div>`;
}

/* 普通工具栏:三档排布全由 CSS 决定,窄档才显示的与宽/中档才显示的元素都在 DOM 里。
   模式 1(模块 1)的搜索在上方独立卡片里,这里没有条件构造器 / 窄档搜索框:.tb.no-cond = 标题 + 业务按钮 + 内置图标;
   模式 1 一屏的主色实心按钮是搜索卡片里的「搜索」,所以这里的「新增」是默认描边 */
function normalBarHtml() {
  if (!isM2()) {
    return `<div class="tb no-cond${state.opsOpen ? ' ops-open' : ''}">
    <div class="tb-left"><h3 class="st-title tb-title">物料单据</h3></div>
    <button class="n-btn quiet ops-toggle" data-act="toggleOps" aria-expanded="${state.opsOpen}">操作 <span class="caret">${state.opsOpen ? '▴' : '▾'}</span></button>
    <div class="tb-right">
      <div class="tb-actions">
        <button class="n-btn" data-act="add">${I_PLUS} 新增</button>
        ${moreHtml()}
      </div>
      ${iconsHtml()}
    </div>
  </div>`;
  }
  const n = activeConds().length;
  const label = fieldOf(state.main.field)?.label ?? '';
  return `<div class="tb${state.opsOpen ? ' ops-open' : ''}" id="searchZone">
    <div class="tb-left">
    <h3 class="st-title tb-title">物料单据</h3>
    <div class="tb-cond">
      <div class="cond">
        ${condRowHtml(state.main, 'main')}
        <span class="pop-wrap"><button class="n-btn icon ${state.panelOpen ? 'on' : ''}" data-act="togglePanel" title="更多条件">${I_MORE}${
          n > 1 ? badgeHtml(n) : ''}</button></span>
        <button class="n-btn" data-act="search">搜索</button>
        <button class="n-btn quiet" data-act="reset">重置</button>
      </div>
      ${state.panelOpen && state.tier !== 'narrow' ? condPanelHtml() : ''}
    </div>
    </div>
    <div class="tb-search">
      ${fValHtml(state.main, 'main', false, `搜索 ${label}`)}
      <span class="pop-wrap"><button class="n-btn" data-act="togglePanel">筛选</button>${n > 0 ? badgeHtml(n) : ''}</span>
    </div>
    <button class="n-btn quiet ops-toggle" data-act="toggleOps" aria-expanded="${state.opsOpen}">操作 <span class="caret">${state.opsOpen ? '▴' : '▾'}</span></button>
    <div class="tb-right">
      <div class="tb-actions">
        <button class="n-btn primary" data-act="add">${I_PLUS} 新增</button>
        ${moreHtml()}
      </div>
      ${iconsHtml()}
    </div>
  </div>`;
}

/* 批量栏:原地替换工具栏那一行,高度不小于勾选前的工具栏 */
function batchBarHtml() {
  const ck = new Set(state.checked), rows = pageInfo().slice;   // 复选框状态与表头一致(当前页);「已选 N 项」是跨页总数
  const all = rows.length > 0 && rows.every(r => ck.has(r.no));
  return `<div class="tb-batch"${state.tbH ? ` style="min-height:${state.tbH}px"` : ''}>
    <span class="bt-info">${checkHtml(all, !all, 'toggleAll')}已选 ${state.checked.length} 项</span>
    <div class="bt-acts">
      <button class="n-btn" data-act="batchApprove">批量审核</button>
      <button class="n-btn danger" data-act="batchDel">批量删除</button>
    </div>
    <button class="n-btn quiet bt-clear" data-act="clearSel">取消选择</button>
    ${iconsHtml()}
  </div>`;
}

/* 已应用条件的 chips —— 收起面板后仍看得见筛了什么。
   ≥1 条就输出并带 data-n,宽/中档只在 ≥2 条时显示、窄档 ≥1 条显示,由 CSS 按 data-n 决定 */
function chipsHtml() {
  const conds = activeConds();
  if (!conds.length) return '';
  return `<div class="chips" data-n="${conds.length}">
    ${conds.map((c, i) => `<span class="chip">${i > 0 && c.logic === 'or' && conds.slice(0, i).some(x => x.field === c.field) ? '或 ' : ''}${esc(fieldOf(c.field)?.label)} ${esc(OP[c.op].zh)}${
      VALUELESS.has(c.op) ? '' : ' ' + esc(c.value)
    }<button data-act="dropChip" data-v="${i}" title="移除">${I_X}</button></span>`).join('')}
    ${conds.length > 1 ? '<button class="clear" data-act="reset">全部清除</button>' : ''}
  </div>`;
}

/* 模块 3 / 4 的工具栏:标题 + 业务按钮 + 内置图标(没有条件构造器,筛选在列头)。
   宿主的主操作「新增」是本屏唯一主色按钮。窄档没有表头(卡片列表),筛选 / 排序的入口是第 2 行的两个文字按钮(与模块 2 窄档的「输入框 + 筛选」同一行位,行数不变) */
function hdrBarHtml() {
  const nf = hfColsActive(), ns = HS().sorts.length;
  return `<div class="tb no-cond hdr-tb${state.opsOpen ? ' ops-open' : ''}">
    <div class="tb-left"><h3 class="st-title tb-title">物料单据</h3></div>
    <button class="n-btn quiet ops-toggle" data-act="toggleOps" aria-expanded="${state.opsOpen}">操作 <span class="caret">${state.opsOpen ? '▴' : '▾'}</span></button>
    <div class="tb-right">
      <div class="tb-actions">
        <button class="n-btn primary" data-act="add">${I_PLUS} 新增</button>
        ${moreHtml()}
      </div>
      ${iconsHtml()}
    </div>
    <div class="tb-search">
      <span class="pop-wrap"><button class="n-btn" data-act="openFilter">筛选</button>${nf ? badgeHtml(nf) : ''}</span>
      <span class="pop-wrap"><button class="n-btn" data-act="openSort">排序</button>${ns ? badgeHtml(ns) : ''}</span>
    </div>
  </div>`;
}

/* 模块 3 / 4 的已生效条件 chips(设计文档 3.2):每条条件一个 NTag,点击重开该列面板,× 删这一条;行末「清除全部」。
   同列第 2 条起若该列是「或」前缀「或 」(与 2.9 一致) */
function hdrChipsHtml() {
  const items = [];
  for (const [key, fv] of Object.entries(HS().fv)) {
    fv.conditions.forEach((c, i) => items.push({ key, i, c, or: i > 0 && fv.logic === 'or' }));
  }
  if (!items.length) return '';
  return `<div class="chips">
    ${items.map(({ key, i, c, or }) => `<span class="chip click" data-act="chipOpen" data-v="${key}">${or ? '或 ' : ''}${esc(fieldOf(key).label)} ${esc(OP[c.op].zh)}${
      VALUELESS.has(c.op) ? '' : ' ' + esc(c.value)
    }<button data-act="hfDrop" data-v="${key}:${i}" title="移除" aria-label="移除这条条件">${I_X}</button></span>`).join('')}
    ${items.length > 1 ? '<button class="clear" data-act="hfClear">清除全部</button>' : ''}
  </div>`;
}

/* ---- 列头过滤面板:气泡与抽屉共用同一份内容,只换容器(设计文档 3.1 / 3.6 / 3.7)---- */
const FILTERABLE = COLS.map(c => c.key);
const szCls = () => (state.tier === 'narrow' ? '' : ' sm');

function hpValHtml(c, i, f) {
  const sm = szCls();
  if (VALUELESS.has(c.op)) return `<div class="f-val novalue"><div class="n-input${sm}" style="pointer-events:none"><span style="color:var(--n-text-3)">不需要填值</span></div></div>`;
  if (f.type === 'select' && !['in', 'notIn'].includes(c.op)) {
    const id = `hp:val:${i}`, open = state.open === id;
    return `<div class="f-val"><div class="n-select${sm}${open ? ' open' : ''}" data-open="${id}"><span class="val${c.value ? '' : ' ph'}">${esc(c.value || '请选择')}</span><span class="caret">▾</span></div>${
      open ? `<div class="dd">${f.options.map(o => `<div class="it${o === c.value ? ' on' : ''}" data-pick="hp:val:${i}:${esc(o)}">${esc(o)}</div>`).join('')}</div>` : ''}</div>`;
  }
  const ph = f.type === 'date' ? 'yyyy-MM-dd' : f.type === 'number' ? '请输入数字' : ['in', 'notIn'].includes(c.op) ? '多个值用逗号隔开' : '请输入';
  return `<div class="f-val"><div class="n-input${sm}"><input type="text" value="${esc(c.value ?? '')}" placeholder="${ph}" enterkeyhint="done" data-hpi="${i}" /></div></div>`;
}

function hpRowHtml(c, i, f) {
  const d = state.hp.d, sm = szCls(), ops = OPS_BY_TYPE[f.type];
  const lid = `hp:logic:${i}`, lopen = state.open === lid;
  const lead = i === 0 ? '<span class="hp-lead">条件</span>'
    : `<div class="logic hp-lead"><div class="n-select${sm}${lopen ? ' open' : ''}" data-open="${lid}"><span class="val">${d.logic === 'or' ? '或' : '且'}</span><span class="caret">▾</span></div>${
      lopen ? `<div class="dd"><div class="it${d.logic === 'and' ? ' on' : ''}" data-pick="hp:logic:${i}:and">且</div><div class="it${d.logic === 'or' ? ' on' : ''}" data-pick="hp:logic:${i}:or">或</div></div>` : ''}</div>`;
  const oid = `hp:op:${i}`, oopen = state.open === oid;
  const op = `<div class="f-op"><div class="n-select${sm}${oopen ? ' open' : ''}" data-open="${oid}"><span class="val">${esc(OP[c.op].zh)}</span><span class="caret">▾</span></div>${
    oopen ? `<div class="dd">${ops.map(o => `<div class="it${o === c.op ? ' on' : ''}" data-pick="hp:op:${i}:${o}">${OP[o].zh}</div>`).join('')}</div>` : ''}</div>`;
  const del = d.conds.length > 1
    ? `<button class="n-btn icon" data-act="hpDel" data-v="${i}" title="删除这条" aria-label="删除这条条件">${I_X}</button>` : '<span class="hp-del-ph"></span>';
  return `<div class="hp-row">${lead}${op}${hpValHtml(c, i, f)}${del}</div>`;
}

function hpBodyHtml() {
  const { key, d } = state.hp, f = fieldOf(key), options = fieldMode(key) === 'options';
  if (options && !d.adv) {
    return `<div class="hp-group">${f.options.map(o => `<div class="hp-opt" data-act="hpCheck" data-v="${esc(o)}">${checkHtml(d.checked.includes(o))}<span>${esc(o)}</span></div>`).join('')}</div>
      <div class="hp-tools"><button class="n-btn text" data-act="hpAdv">高级条件 ▾</button></div>`;
  }
  const add = d.conds.length < MAX_CONDS ? `<button class="n-btn text" data-act="hpAdd">${I_PLUS} 添加条件</button>` : '';
  let tools = `<div class="hp-tools">${add}</div>`;
  if (options) {
    const ok = canCollapse();
    tools = `<div class="hp-tools">${add}<span style="margin-left:auto"></span><button class="n-btn text" data-act="hpAdv"${ok ? '' : ' disabled'}>收起高级条件 ▴</button></div>${
      ok ? '' : '<div class="hp-hint" style="margin:-4px 0 8px">含勾选无法表达的条件</div>'}`;
  }
  return d.conds.map((c, i) => hpRowHtml(c, i, f)).join('') + tools;
}

function hpopHtml() {
  const { key, d } = state.hp, opt = fieldMode(key) === 'options' && !d.adv;
  return `<div class="hpop${opt ? ' opt' : ''}" data-stop role="dialog" aria-label="筛选 ${esc(fieldOf(key).label)}">
    <div class="hp-body">${hpBodyHtml()}</div>
    <div class="hp-foot"><button class="n-btn tiny" data-act="hpReset">重置</button><button class="n-btn tiny primary" data-act="hpOk">确认</button></div>
  </div>`;
}

/* 气泡定位:官方 placement="bottom"(以漏斗为中心、在其下方),夹进视口;下方放不下且上方放得下时翻到上方(follower 的 flip 等价);
   漏斗随表格横向滚出可视区时整块藏起来。scroll / resize / 每次重绘后都重算 */
function placeHpop() {
  const pop = document.querySelector('#overlay .hpop');
  if (!pop || !state.hp) return;
  const btn = document.querySelector(`#preview [data-fk="${state.hp.key}"]`);
  const sc = document.querySelector('#preview .tbl-scroll');
  if (!btn || !sc) { pop.style.visibility = 'hidden'; return; }
  const r = btn.getBoundingClientRect(), s = sc.getBoundingClientRect();
  if (r.right < s.left + 1 || r.left > s.right - 1) { pop.style.visibility = 'hidden'; return; }
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = r.left + r.width / 2 - w / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
  let top = r.bottom + 6;
  if (top + h > window.innerHeight - 8 && r.top - h - 6 > 8) top = r.top - h - 6;
  pop.style.left = left + 'px'; pop.style.top = top + 'px'; pop.style.visibility = 'visible';
}

/* 窄档抽屉:列头过滤(字段选择 + 同一份面板内容)/ 排序(可排序列各一行,无 / 升序 / 降序) */
function hdrSheetHtml(enter) {
  if (state.sd) return sdSheetHtml(enter);
  const { key } = state.hp, pid = 'hp:field', open = state.open === pid;
  const pick = `<div class="hp-head-pick"><div class="f-field"><div class="n-select${open ? ' open' : ''}" data-open="${pid}"><span class="val">${esc(fieldOf(key).label)}</span><span class="caret">▾</span></div>${
    open ? `<div class="dd">${FILTERABLE.map(k => `<div class="it${k === key ? ' on' : ''}" data-pick="hp:field:${k}">${esc(fieldOf(k).label)}${hfCount(k) ? ` · ${hfCount(k)}` : ''}</div>`).join('')}</div>` : ''}</div></div>`;
  return `<div class="sheet${enter ? ' enter' : ''}" data-stop>
    <div class="sheet-head"><b>筛选</b><button class="n-btn icon" data-act="closePanel" title="关闭">${I_X}</button></div>
    <div class="sheet-body">${pick}<div class="hp-body">${hpBodyHtml()}</div></div>
    <div class="sheet-foot"><button class="n-btn quiet" data-act="hpReset">重置</button><div><button class="n-btn primary" data-act="hpOk">确认</button></div></div>
  </div>`;
}
function sdSheetHtml(enter) {
  const sorters = H_CFG[state.mod].sorters;
  const keys = Object.keys(sorters).sort((a, b) => (sorters[b].multiple ?? 0) - (sorters[a].multiple ?? 0));   // 行序 = 优先级(声明的 multiple 大者在前),手机上只能启停各列
  const cur = (k) => state.sd.sorts.find(s => s.key === k)?.order || 'none';
  const seg = (k) => [['none', '无'], ['ascend', '升序'], ['descend', '降序']].map(([o, l]) =>
    `<button class="${cur(k) === o ? 'on' : ''}" data-act="sdSet" data-v="${k}:${o}" aria-pressed="${cur(k) === o}">${l}</button>`).join('');
  return `<div class="sheet${enter ? ' enter' : ''}" data-stop>
    <div class="sheet-head"><b>排序</b><button class="n-btn icon" data-act="closePanel" title="关闭">${I_X}</button></div>
    <div class="sheet-body">${keys.map(k => `<div class="sd-row"><span class="lab">${esc(fieldOf(k).label)}</span><div class="seg" role="group" aria-label="${esc(fieldOf(k).label)}排序">${seg(k)}</div></div>`).join('')}</div>
    <div class="sheet-foot"><button class="n-btn quiet" data-act="sdReset">重置</button><div><button class="n-btn primary" data-act="sdOk">确认</button></div></div>
  </div>`;
}

/* 模式 1:搜索独立卡片 —— 与 src/SearchForm.vue 的 grid 布局一致:
   n-card > n-form(label 在左)> n-grid(cols '1 s:2 m:3 l:4' 按视口、x-gap 16 / y-gap 12、collapsed + collapsedRows 1)
   字段格 n-form-item-gi × N + 最后一格 suffix(搜索 / 重置 / 展开·收起 三个按钮);折叠时超出首行的字段整格隐藏,suffix 恒占最后一格 */
function sfPh(f) {
  return f.type === 'date' ? 'yyyy-MM-dd' : f.type === 'number' ? '请输入数字' : '请输入';
}
function sfCtlHtml(f) {
  const v = state.sf[f.key] ?? '';
  if (f.type === 'select') {
    const id = `sf:${f.key}`, open = state.open === id;
    return `<div class="n-select${open ? ' open' : ''}" data-open="${id}" role="combobox" aria-expanded="${open}">
        <span class="val${v ? '' : ' ph'}">${esc(v || '请选择')}</span>${
          v ? `<span class="clr" data-clear="${f.key}" title="清除">${I_X}</span>` : ''}<span class="caret">▾</span></div>${
      open ? `<div class="dd">${f.options.map(o =>
        `<div class="it${o === v ? ' on' : ''}" data-pick="sf:${f.key}:${esc(o)}">${esc(o)}</div>`).join('')}</div>` : ''}`;
  }
  return `<div class="n-input"><input type="text" value="${esc(v)}" placeholder="${sfPh(f)}" enterkeyhint="search" data-input="sf:${f.key}" /></div>`;
}
function searchCardHtml() {
  const cols = sfColsNow();
  state.sfCols = cols;
  const shown = state.sfCollapsed ? sfVisibleCount(cols) : FIELD_DEFS.length;
  return `<div class="n-card search-card">
    <div class="search-grid" data-cols="${cols}">
      ${FIELD_DEFS.map((f, i) => `<div class="n-form-item" data-f="${f.key}"${i < shown ? '' : ' hidden'}>
        <label>${f.label}</label><div class="sf-ctl">${sfCtlHtml(f)}</div></div>`).join('')}
      <div class="n-form-item search-actions">
        <button class="n-btn primary" data-act="sfSearch">搜索</button>
        <button class="n-btn" data-act="sfReset">重置</button>
        <button class="n-btn text link" data-act="sfToggle" aria-expanded="${!state.sfCollapsed}">${state.sfCollapsed ? '展开' : '收起'}</button>
      </div>
    </div>
  </div>`;
}

/* 表格卡片:工具栏(有勾选则批量栏)+ 表格件。模块 1 无条件构造器、无 chips(搜索框里本来就看得见值);
   o.table 仅供测工具栏高度时换成空串 */
function tbCardHtml(o = {}) {
  return `<div class="n-card">
      ${state.checked.length ? batchBarHtml() : hdrMod() ? hdrBarHtml() : normalBarHtml()}
      ${isM2() ? chipsHtml() : hdrMod() ? hdrChipsHtml() : ''}
      ${o.table ?? tableEHtml()}
    </div>`;
}

/* 模式 1 页面 = 搜索卡片 + 表格卡片(两卡片间距 = .smart-table 的 gap 16px) */
function schemeAHtml() {
  return `<div class="smart-table" data-density="${state.compact ? 'compact' : 'normal'}"${state.max ? ' data-max' : ''}>
    ${searchCardHtml()}
    ${tbCardHtml()}
  </div>`;
}

/* 模式 2 页面 = 一张卡片:工具栏(含条件构造器)+ chips + 表格件 */
function schemeEHtml(o = {}) {
  return `<div class="smart-table" data-density="${state.compact ? 'compact' : 'normal'}"${state.max ? ' data-max' : ''}>
    ${tbCardHtml(o)}
  </div>`;
}



/* ============================================================
   工具栏高度测量:批量栏出现后 DOM 里已没有 .tb,要占位就得在离屏容器里按当前宽度量一次
   ============================================================ */
const probe = document.createElement('div');
probe.style.cssText = 'position:absolute;left:-99999px;top:0;visibility:hidden';
document.body.appendChild(probe);

/* 在「收起、无勾选」的中性状态下执行 fn(测量用),结束后还原 */
function neutral(fn) {
  const bak = { open: state.open, panelOpen: state.panelOpen, checked: state.checked, colsOpen: state.colsOpen, moreOpen: state.moreOpen, opsOpen: state.opsOpen, max: state.max };
  Object.assign(state, { open: null, panelOpen: false, checked: [], colsOpen: false, moreOpen: false, opsOpen: false, max: false });
  try { return fn(); } finally { Object.assign(state, bak); }
}

function measureTb(w) {
  return neutral(() => {
    probe.style.width = w + 'px';
    probe.innerHTML = schemeEHtml({ table: '' });
    const tb = probe.querySelector('.tb');
    const h = tb ? Math.round(tb.getBoundingClientRect().height) : 0;
    probe.innerHTML = '';
    return h;
  });
}

/* ============================================================
   渲染
   ============================================================ */
function renderMods() {
  $('modList').innerHTML = Object.entries(MODULES).map(([k, m]) => `
    <button class="mod ${state.mod === k ? 'on' : ''}" data-act="mod" data-v="${k}">
      <span class="no">${m.no}</span><span class="nm">${m.name}</span>
      <span class="st ${m.status}">${m.statusTxt}</span>
    </button>`).join('');
}

/* 侧栏下半:只有主题切换(外壳自身的控件) */
function renderSidePanel() {
  $('modPanel').innerHTML = `<div class="group-title">主题</div>
    <div class="mini">
      <button data-act="theme" data-v="light" class="${state.theme === 'light' ? 'on' : ''}">浅色</button>
      <button data-act="theme" data-v="dark" class="${state.theme === 'dark' ? 'on' : ''}">深色</button>
    </div>`;
}

function renderStage() {
  const mod = MODULES[state.mod];
  $('crumb').textContent = `SmartTable 设计方案 / ${mod.no}. ${mod.name}`;
  $('stageName').textContent = mod.name;

  /* 四个模块的舞台都只有一个真实的宿主页面区域,没有任何说明 */
  $('stageDesc').textContent = '';
  $('stage').innerHTML = `<div class="viewport"><div id="preview"></div></div>`;
  renderPreview();
}

/* 只重绘预览区 —— 下拉开合、改条件都走这里,不动外层说明 */
/* 且/或是按字段一个值(FilterValue.logic):字段下只剩一条时没有「或」可言,归位为「且」,免得删条件/换字段后残留 */
function normalizeLogic() {
  const all = [state.main, ...state.more];
  all.forEach(c => { if (all.filter(x => x.field === c.field).length < 2) c.logic = 'and'; });
}

/* 分页里的弹出菜单(size picker 下拉)下方放不下、上方放得下时改向上展开 —— 与官方 follower 的自动翻转等价 */
function flipPagerMenus(root) {
  root.querySelectorAll('.n-pagination .dd').forEach((dd) => {
    const r = dd.getBoundingClientRect(), host = dd.parentElement.getBoundingClientRect();
    if (r.bottom > window.innerHeight && host.top > r.height + 8) dd.classList.add('up');
  });
}

/* 组件的实际宽度:放大时是 position:fixed 铺满视口(左右内边距各 16),不再是 #preview 的宽度;档位(气泡 / 抽屉、布局三档)按它算 */
const previewW = (el) => (state.max ? window.innerWidth - 32 : el.clientWidth);

function renderPreview() {
  normalizeLogic();
  const el = $('preview');
  if (!el) { renderOverlay(); return; }

  /* 1. 渲染前先量:容器宽度定档位;换 DOM 之前记下工具栏高度给批量栏占位 */
  const w = previewW(el);
  if (w > 0) state.tier = tierOf(w);
  if (state.tier !== 'narrow') state.sd = null;   // 排序抽屉只属于窄档
  const tb = el.querySelector('.tb');
  if (tb) { state.tbH = Math.round(tb.getBoundingClientRect().height); state.tbW = w; }
  else if (state.checked.length && w > 0 && state.tbW !== w) { state.tbH = measureTb(w); state.tbW = w; }
  const sc = el.querySelector('.tbl-scroll');
  const left = sc ? sc.scrollLeft : 0;

  /* 2. 重绘 */
  frMemo = computeRows();   // 本次绘制内复用同一份「筛选 + 排序」结果,绘制完立即失效
  try { el.innerHTML = state.mod === 'search' ? schemeAHtml() : schemeEHtml(); } finally { frMemo = null; }
  flipPagerMenus(el);
  vsMount(el);
  if (left) { const n = el.querySelector('.tbl-scroll'); if (n) n.scrollLeft = left; }

  renderOverlay();
}

/* ============================================================
   覆盖层:底部抽屉(窄档筛选)+ toast。都 teleport 到 body,不放进 .smart-table。
   逐个节点增量更新,避免每次重绘都重播遮罩淡入 / 抽屉滑入动画。
   ============================================================ */
const OV_ORDER = ['mask', 'sheet', 'hpop', 'toast'];
function ovChild(ov, cls) { return Array.from(ov.children).find(c => c.classList.contains(cls)); }
function ovSync(ov, cls, html, keep) {
  const cur = ovChild(ov, cls);
  if (!html) { if (cur) cur.remove(); return; }
  if (cur && keep && keep(cur)) return;
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  const el = t.content.firstElementChild;
  if (cur) {
    const top = cur.querySelector('.sheet-body')?.scrollTop ?? 0;   // 抽屉整体被换掉,内部滚动位置要带过去
    cur.replaceWith(el);
    const body = el.querySelector('.sheet-body');
    if (body && top) body.scrollTop = top;
    return;
  }
  const idx = OV_ORDER.indexOf(cls);
  const next = Array.from(ov.children).find(c => OV_ORDER.findIndex(k => c.classList.contains(k)) > idx);
  ov.insertBefore(el, next || null);
}

function renderOverlay() {
  const ov = $('overlay');
  if (!ov) return;
  const live = !!$('preview'), narrow = state.tier === 'narrow';
  const hdrSheet = hdrMod() && narrow && live && !!(state.hp || state.sd);   // 模块 3 / 4:窄档的列头过滤 / 排序抽屉
  const showSheet = (isM2() && narrow && state.panelOpen && live) || hdrSheet;
  const showPop = hdrMod() && !narrow && live && !!state.hp;               // 宽 / 中档:列头过滤气泡(官方 NPopover 的等价物)
  const had = !!ovChild(ov, 'sheet');
  ovSync(ov, 'mask', showSheet ? '<div class="mask" data-act="closePanel"></div>' : '', () => true);
  ovSync(ov, 'sheet', showSheet ? (hdrSheet ? hdrSheetHtml(!had) : sheetHtml(!had)) : '');
  ovSync(ov, 'hpop', showPop ? hpopHtml() : '');
  if (showPop) {
    placeHpop();
    if (state.hpFocus) { state.hpFocus = false; ov.querySelector('[data-hpi]')?.focus(); }   // 打开时聚焦第一个可编辑的值控件(窄档抽屉不聚焦,免得直接弹键盘)
  }
  ovSync(ov, 'toast', state.toast ? `<div class="toast" data-id="${state.toast.id}">${esc(state.toast.msg)}</div>` : '',
    (cur) => !!state.toast && cur.dataset.id === String(state.toast.id));
  document.body.style.overflow = showSheet ? 'hidden' : '';
}

let toastSeq = 0, toastTimer = 0;
function toast(msg) {
  state.toast = { id: ++toastSeq, msg };
  renderOverlay();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { state.toast = null; renderOverlay(); }, 1800);
}

/* ============================================================
   交互
   ============================================================ */
function condById(id) {
  if (id === 'main' || id === 'pmain') return state.main;   // pmain = 气泡/抽屉里的那份主条(与顶栏主条分开 key,否则两处下拉会一起弹)
  const i = Number(id.slice(1));
  return state.more[i];
}

/* 数据变了:重绘预览 */
const redraw = () => renderPreview();

const closeFloats = () => { state.open = null; state.panelOpen = false; state.colsOpen = false; state.moreOpen = false; state.hp = null; state.sd = null; };

function runAct(act, v) {
  switch (act) {
    case 'mod':
      state.mod = v; closeFloats();
      state.tbW = 0;                                   // 两个模块的工具栏高度不同,占位高度要重新量
      pruneChecked(true);   // 四个模块各有自己的筛选状态,勾选只留在新模块结果里的行
      render(); return;
    case 'theme':  state.theme = v; document.documentElement.dataset.theme = v; render(); return;

    /* 筛选 */
    case 'togglePanel': state.panelOpen = !state.panelOpen; state.open = null; renderPreview(); return;
    case 'closePanel':  state.panelOpen = false; state.open = null; state.hp = null; state.sd = null; renderPreview(); return;

    case 'max':
      state.max = !state.max; closeFloats(); renderPreview();
      if (kbdModality) document.querySelector('#preview [data-act="max"]')?.focus();   // 重绘会换掉按钮节点:键盘用户把焦点还给它(连续回车可反复切换);鼠标用户不还,否则会冒出焦点环
      return;
    case 'noop': return;   // 列宽把手:点一下什么都不做(也不冒泡成排序)

    /* 模块 3 / 4:表头排序 */
    case 'sortClick': {   // 官方循环 升序 → 降序 → 取消;多列模式保留其它列,单列模式互斥
      HS().sorts = applySort(HS().sorts, v, nextOrder(sortOrderOf(v)), H_CFG[state.mod].multiple);
      firstPage(state.mod); redraw(); return;
    }
    /* 模块 3 / 4:列头过滤面板 */
    case 'hfOpen': {      // 点漏斗:开 / 关该列面板(同列再点 = 关)
      if (state.hp?.key === v) hpClose(); else { state.hp = { key: v, d: hpDraft(v) }; state.hpFocus = true; }
      state.open = null; renderPreview(); return;
    }
    case 'chipOpen':      // 点 chip:打开该列面板(窄档是抽屉)
      state.hp = { key: v, d: hpDraft(v) }; state.hpFocus = true; state.open = null; renderPreview(); return;
    case 'hpCheck': {
      const c = state.hp.d.checked, i = c.indexOf(v);
      if (i >= 0) c.splice(i, 1); else c.push(v);
      renderPreview(); return;
    }
    case 'hpAdv': {       // options 列:勾选 ↔ 高级条件。展开时把勾选转写成条件,收起仅当条件能被勾选表达
      const { key, d } = state.hp;
      if (!d.adv) { d.conds = checkedToConds(key, d.checked); d.logic = 'and'; d.adv = true; }
      else if (canCollapse()) { d.checked = optionsRepr({ logic: d.logic, conditions: draftActive(key, d.conds) }) ?? []; d.adv = false; }
      state.open = null; renderPreview(); return;
    }
    case 'hpAdd': {
      const { key, d } = state.hp;
      if (d.conds.length < MAX_CONDS) d.conds.push(blankCond(key));
      state.open = null; renderPreview(); return;
    }
    case 'hpDel': state.hp.d.conds.splice(Number(v), 1); state.open = null; renderPreview(); return;
    case 'hpOk':    hpCommit(); redraw(); return;
    case 'hpReset': delete HS().fv[state.hp.key]; hpClose(); firstPage(state.mod); pruneChecked(true); redraw(); return;   // 官方「重置」立即生效并关闭;本例无 defaultValue,即清除
    case 'hfDrop': { const [k, i] = v.split(':'); dropHfCond(k, Number(i)); redraw(); return; }
    case 'hfClear': HS().fv = {}; hpClose(); firstPage(state.mod); pruneChecked(true); redraw(); return;
    /* 窄档入口 */
    case 'openFilter': {
      const k = Object.keys(HS().fv)[0] ?? FILTERABLE[0];
      state.hp = { key: k, d: hpDraft(k) }; state.open = null; renderPreview(); return;
    }
    case 'openSort': state.sd = { sorts: HS().sorts.map(s => ({ ...s })) }; state.open = null; renderPreview(); return;
    case 'sdSet': {
      const [k, o] = v.split(':');
      state.sd.sorts = applySort(state.sd.sorts, k, o === 'none' ? false : o, H_CFG[state.mod].multiple);
      renderPreview(); return;
    }
    case 'sdOk':    HS().sorts = state.sd.sorts; state.sd = null; firstPage(state.mod); redraw(); return;
    case 'sdReset': HS().sorts = defaultSorts(state.mod); state.sd = null; firstPage(state.mod); redraw(); return;
    case 'addCond':
      const grp = [state.main, ...state.more].filter(x => x.field === 'name');
      state.more.push({ field: 'name', op: 'contains', value: '', logic: grp.some(x => x.logic === 'or') ? 'or' : 'and' });
      state.open = null; renderPreview(); return;
    case 'delCond':
      state.more.splice(Number(v), 1); state.open = null; renderPreview(); return;
    case 'search': doSearch(); redraw(); return;
    case 'reset':  doReset(); redraw(); return;
    case 'dropChip': dropChip(Number(v)); redraw(); return;

    /* 模式 1 搜索卡片 */
    case 'sfSearch': doSfSearch(); redraw(); return;
    case 'sfReset':  doSfReset(); redraw(); return;
    case 'sfToggle': state.sfCollapsed = !state.sfCollapsed; state.open = null; redraw(); return;

    /* 工具栏 */
    case 'toggleOps': state.opsOpen = !state.opsOpen; renderPreview(); return;
    case 'cols':      state.colsOpen = !state.colsOpen; renderPreview(); return;
    case 'colToggle': {
      const i = state.hidden.indexOf(v);
      if (i >= 0) state.hidden.splice(i, 1);
      else if (state.hidden.length >= COLS.length - 1) { toast('至少保留一列'); return; }
      else state.hidden.push(v);
      redraw(); return;
    }
    case 'refresh': redraw(); toast('已刷新'); return;
    case 'more':    state.moreOpen = !state.moreOpen; renderPreview(); return;
    case 'export':  state.moreOpen = false; renderPreview(); toast(`已导出 ${filteredRows().length} 条`); return;   // 选中菜单项后收起(NDropdown 同)
    case 'import':  state.moreOpen = false; renderPreview(); toast('请选择要导入的文件'); return;
    case 'tpl':     state.moreOpen = false; renderPreview(); toast('已下载导入模板'); return;
    case 'add': {
      const no = addRow();
      redraw(); toast(`已新增 ${no}`); return;
    }

    /* 分页 */
    case 'pgPrev': if (goPage(pageInfo().page - 1)) redraw(); return;
    case 'pgNext': if (goPage(pageInfo().page + 1)) redraw(); return;

    /* 行与批量 */
    case 'toggleRow': toggleRow(v); redraw(); return;
    case 'toggleAll': toggleAll(); redraw(); return;
    case 'clearSel':  clearSel(); redraw(); return;
    case 'edit': toast(`正在编辑 ${v}`); return;
    case 'del':
      if (delRow(v)) { redraw(); toast(`已删除 ${v}`); }
      return;
    case 'batchApprove': {
      const total = state.checked.length;
      const n = batchApprove();
      redraw(); toast(n ? `已审核 ${n} 项` : `所选 ${total} 项无需审核`); return;
    }
    case 'batchDel': {
      const n = batchDel();
      redraw(); toast(`已删除 ${n} 项`); return;
    }
  }
}

/* ---- 列宽拖拽 ----
   第一次按下把手:把所有可见列冻结成「当前渲染宽度」(库的 freezeWidths),最后一个数据列的 col 不写宽度、吸收剩余宽度,重绘一次后列宽视觉不变;
   之后只直接改 <col> 宽度与表格 min-width(不重绘,拖动不掉帧)。用 document 级 pointer 事件,所以中途重绘换掉把手节点也不影响手势。
   下限 colMin;拖动时收起过滤气泡(气泡锚在漏斗上,列宽一变就对不上);刚拖完的一小段时间内吞掉 click,免得松手落在表头上连带触发排序。 */
/* 最近一次输入方式:键盘 / 指针。只有键盘操作时,重绘后才需要主动把焦点还给按钮 */
let kbdModality = false;
document.addEventListener('keydown', () => { kbdModality = true; }, true);
document.addEventListener('pointerdown', () => { kbdModality = false; }, true);

let rz = null, rzBlockUntil = 0;
function rzStart(e, key) {
  const cols = visibleCols();
  if (!isFrozen()) {
    cols.forEach(c => {
      const th = document.querySelector(`#preview thead th[data-ck="${c.key}"]`);
      if (th) state.colW[c.key] = Math.round(th.getBoundingClientRect().width);
    });
  }
  const col = cols.find(c => c.key === key);
  if (!col || state.colW[key] == null) return;
  state.hp = null; state.open = null;
  /* 起点取「此刻实际渲染宽度」而不是钉住的宽度:吸收余量的最后一列实际宽度可能比它钉住的宽度大,
     用钉住的宽度当起点,向右拖半天也超不过它当前宽度,看起来像拖不动 */
  const th0 = document.querySelector(`#preview thead th[data-ck="${key}"]`);
  const w0 = th0 ? Math.round(th0.getBoundingClientRect().width) : state.colW[key];
  state.colW[key] = w0;
  rz = { key, x0: e.clientX, w0, min: colMin(col), moved: false };
  renderPreview();
  document.querySelector(`#preview .th-resize[data-rz="${key}"]`)?.classList.add('active');
  document.body.classList.add('rz-ing');
  const sc = document.querySelector('#preview .tbl-scroll');
  if (sc) { rz.sc = sc; rz.guide = document.createElement('div'); rz.guide.className = 'rz-guide'; sc.appendChild(rz.guide); rzGuide(); }
  document.addEventListener('pointermove', rzMove);
  document.addEventListener('pointerup', rzEnd);
  document.addEventListener('pointercancel', rzEnd);
  window.addEventListener('blur', rzEnd);
}
function rzMove(e) {
  if (!rz) return;
  const w = Math.max(rz.min, Math.round(rz.w0 + e.clientX - rz.x0));
  if (w === state.colW[rz.key]) return;
  rz.moved = true; state.colW[rz.key] = w;
  const cols = visibleCols(), tbl = document.querySelector('#preview table.n-table');
  if (!tbl) return;
  if (rz.key !== fillColKey(cols)) tbl.querySelectorAll('colgroup col')[cols.findIndex(c => c.key === rz.key) + 1].style.width = w + 'px';   // 填充列的 col 不写宽度,它的「钉住宽度」只作为最小宽度进 min-width(拖宽超出容器才有效,拖窄不低于填满容器)
  tbl.style.minWidth = tableMinW(cols) + 'px';
  rzGuide();
}
/* 引导线:贯穿整张表(滚动内容坐标),落在被拖列的右边线上;高度取滚动内容总高,虚拟滚动的 spacer 已撑出整页高度 */
function rzGuide() {
  const th = document.querySelector(`#preview th[data-ck="${rz.key}"]`);
  if (!rz.guide || !th) return;
  const r = th.getBoundingClientRect(), s = rz.sc.getBoundingClientRect();
  rz.guide.style.left = Math.round(r.right - s.left + rz.sc.scrollLeft - 1) + 'px';
  rz.guide.style.height = rz.sc.scrollHeight + 'px';
}
function rzEnd() {
  if (!rz) return;
  rz.guide?.remove();
  if (rz.moved) rzBlockUntil = performance.now() + 150;
  rz = null;
  document.body.classList.remove('rz-ing');
  document.querySelectorAll('.th-resize.active').forEach(x => x.classList.remove('active'));
  document.removeEventListener('pointermove', rzMove);
  document.removeEventListener('pointerup', rzEnd);
  document.removeEventListener('pointercancel', rzEnd);
  window.removeEventListener('blur', rzEnd);
}
document.addEventListener('pointerdown', (e) => {
  const h = e.target.closest?.('.th-resize');
  if (!h || e.button) return;
  e.preventDefault();
  rzStart(e, h.dataset.rz);
});

/* 重绘会销毁旧节点;把焦点还给用户刚点的输入框(同一条件可能有多份输入框,取可见的那份) */
function repaint(target) {
  const id = target?.closest?.('[data-input]')?.dataset.input;
  renderPreview();
  if (!id) return;   // 列头过滤面板里的输入框(data-hpi)只在 input 事件里改草稿、不走这里的重绘
  const el = [...document.querySelectorAll(`[data-input="${id}"]`)].find(x => x.offsetParent !== null);
  if (el) { el.focus(); const n = el.value.length; el.setSelectionRange(n, n); }
}

document.addEventListener('click', (e) => {
  if (performance.now() < rzBlockUntil) return;   // 列宽拖拽刚结束:松手产生的 click 不算点击
  const t = e.target;
  const inStop = !!t.closest('[data-stop]');
  const actEl = t.closest('[data-act]');
  const act = actEl?.dataset.act;
  let dirty = false;

  /* 列设置气泡:点它自己和它的按钮之外一律收起(任何 act 执行前都先收) */
  if (state.colsOpen && !t.closest('.col-pop') && act !== 'cols') { state.colsOpen = false; dirty = true; }
  if (state.moreOpen && !t.closest('.more-pop') && act !== 'more') { state.moreOpen = false; dirty = true; }

  /* 列头过滤气泡 / 窄档抽屉:点它们之外一律收起(漏斗、chip、窄档入口自己处理开关;气泡与抽屉都带 data-stop,里面的点击不算「之外」) */
  if ((state.hp || state.sd) && !inStop && !['hfOpen', 'chipOpen', 'openFilter', 'openSort'].includes(act)) {
    state.hp = null; state.sd = null; state.open = null; dirty = true;
  }

  /* 0. 模式 1 下拉框里的清除 ×(在触发器之内,须先于 1 处理) */
  const clr = t.closest('[data-clear]');
  if (clr) { state.sf[clr.dataset.clear] = ''; state.open = null; renderPreview(); return; }

  /* 1. 下拉触发器 */
  const opener = t.closest('[data-open]');
  if (opener) {
    const id = opener.dataset.open;
    state.open = state.open === id ? null : id;
    renderPreview();
    return;
  }

  /* 2. 下拉选项 */
  const pick = t.closest('[data-pick]');
  if (pick) {
    const [kind, id, ...rest] = pick.dataset.pick.split(':');
    const val = rest.join(':');
    if (kind === 'sf') { state.sf[id] = val; state.open = null; renderPreview(); return; }   // 模式 1 的下拉:只改草稿
    if (kind === 'pgsize') { setPageSize(Number(id)); state.open = null; renderPreview(); return; }   // 分页的每页条数
    if (kind === 'hp') {   // 列头过滤面板 / 抽屉里的下拉:只改草稿,点「确认」才提交
      const d = state.hp?.d;
      if (id === 'field') state.hp = { key: rest[0], d: hpDraft(rest[0]) };   // 窄档抽屉换字段:草稿重取该列已提交的值
      else if (d) {
        const i = Number(rest[0]), v2 = rest.slice(1).join(':'), c = d.conds[i];
        if (id === 'op' && c) {
          const multi = (o) => ['in', 'notIn'].includes(o);
          if (VALUELESS.has(v2) || (fieldOf(state.hp.key).type === 'select' && multi(v2) !== multi(c.op))) c.value = '';   // 换比较符后值的形态不再适用就清空,不猜测转换
          c.op = v2;
        } else if (id === 'logic') d.logic = v2;   // 且 / 或是按列一个值(FilterValue.logic)
        else if (id === 'val' && c) c.value = v2;
      }
      state.open = null; renderPreview(); return;
    }
    const c = condById(id);
    if (kind === 'field') {
      c.field = val;
      const allowed = OPS_BY_TYPE[fieldOf(val).type];
      if (!allowed.includes(c.op)) c.op = allowed[0];   // 换字段后比较符要仍然讲得通
      c.value = '';
      // 换字段后加入别的字段组:且/或跟着那一组走(FilterValue.logic 是按字段一个值)
      const grp = [state.main, ...state.more].filter(x => x !== c && x.field === val);
      c.logic = grp.some(x => x.logic === 'or') ? 'or' : 'and';
    } else if (kind === 'op') {
      const multi = (o) => ['in', 'notIn'].includes(o);
      if (VALUELESS.has(val) || (fieldOf(c.field)?.type === 'select' && multi(val) !== multi(c.op))) c.value = '';
      c.op = val;
    } else if (kind === 'val') {
      c.value = val;
      // 窄档没有搜索按钮:顶栏那个枚举下拉选完即生效;抽屉里是批量编辑多个条件,仍要点「确认」
      if (id === 'main' && pick.closest('.tb-search')) { doSearch(); state.open = null; redraw(); return; }
    } else if (kind === 'logic') {
      // 库的数据模型里「且/或」是按字段一个值(FilterValue.logic),所以同字段联动,不允许一条 且 一条 或
      [state.main, ...state.more].filter(x => x.field === c.field).forEach(x => { x.logic = val; });
    }
    state.open = null;
    renderPreview();
    return;
  }

  /* 3. 动作按钮:气泡之外的动作(含遮罩)等于「点了别处」,先收起下拉与气泡 */
  if (actEl) {
    // 导出/编辑这类只弹 toast 的动作自己不重绘,但这里已收起了浮层,要补一次重绘,免得界面与 state 失步
    const stale = dirty || (!inStop && act !== 'togglePanel' && (state.open !== null || state.panelOpen));
    if (!inStop && act !== 'togglePanel') { state.open = null; state.panelOpen = false; }
    runAct(act, actEl.dataset.v);
    if (stale) repaint(t);
    return;
  }

  /* 4. 点空白处收起弹层;data-stop 区域(气泡 / 抽屉 / 列设置)里点空白只收下拉 */
  if (!t.closest('.dd')) {
    if (!inStop && (state.open !== null || state.panelOpen)) { state.open = null; state.panelOpen = false; dirty = true; }
    else if (inStop && state.open !== null) { state.open = null; dirty = true; }
  }
  if (dirty) repaint(t);
});

/* 输入:只改 state,不重绘,免得输入框失焦;同一条件在别处(窄档输入框 / 抽屉 / 宽档)的输入框同步值 */
document.addEventListener('input', (e) => {
  const pj = e.target.closest?.('[data-pgjump]');
  if (pj) { pj.value = pj.value.replace(/\D+/g, ''); return; }   // quick jumper 只收数字(Pagination.mjs handleJumperInput)
  const hpi = e.target.closest?.('[data-hpi]');
  if (hpi) { if (state.hp) state.hp.d.conds[Number(hpi.dataset.hpi)].value = hpi.value; return; }   // 列头过滤面板:只改草稿
  const inp = e.target.closest('[data-input]');
  if (!inp) return;
  if (inp.dataset.input.startsWith('sf:')) { state.sf[inp.dataset.input.slice(3)] = inp.value; return; }   // 模式 1:输入即改草稿,不重绘
  const cond = condById(inp.dataset.input);
  cond.value = inp.value;
  document.querySelectorAll('[data-input]').forEach(x => { if (x !== inp && condById(x.dataset.input) === cond) x.value = inp.value; });
});

/* 回车即搜索(同时收起气泡 / 抽屉);输入法组词中的回车不算 */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.open !== null || state.panelOpen || state.colsOpen || state.moreOpen || state.hp || state.sd) { closeFloats(); renderPreview(); }   // Esc:先收起浮层并丢弃草稿
    else if (state.max) { state.max = false; renderPreview(); }                                                                 // 没有浮层了再 Esc:还原
    return;
  }
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;   // 229:Safari 输入法确认那一下 isComposing 已是 false
  const pj = e.target.closest?.('[data-pgjump]');
  if (pj) { pgJump(pj); return; }
  if (e.target.closest?.('[data-hpi]') && state.hp) { hpCommit(); redraw(); return; }   // 列头过滤面板值输入框里回车 = 确认
  const inp = e.target.closest('[data-input]');
  if (!inp) return;
  if (inp.dataset.input.startsWith('sf:')) doSfSearch(); else doSearch();   // 模式 1 字段里回车 = 点搜索
  redraw();
});

/* quick jumper:输入页码回车 / 失焦跳转,超范围夹进 [1, 总页数],跳完清空输入框(Pagination.mjs doQuickJump);非数字不动 */
function pgJump(inp) {
  const simple = inp.hasAttribute('data-simple'), cur = state.pager[pagerKey()].page;   // simple:输入框显示的就是当前页,非法 / 同页要还原成当前页(官方 simple 的 jumperValue 始终 = 当前页)
  const n = Number.parseInt(inp.value, 10);
  if (Number.isNaN(n)) { if (simple) inp.value = cur; return; }
  if (goPage(n)) redraw(); else inp.value = simple ? cur : '';
}
document.addEventListener('change', (e) => {
  const pj = e.target.closest?.('[data-pgjump]');
  if (pj) pgJump(pj);
});

function render() {
  renderMods();
  renderSidePanel();
  renderStage();
  renderOverlay();
}

state.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';   // 跟随系统,和真实应用一致
document.documentElement.dataset.theme = state.theme;
render();
/* 容器档位变了才重绘(气泡 ↔ 抽屉切换);宽度只在档内变化时全靠 CSS 容器查询 */
window.addEventListener('resize', () => {
  const pv = $('preview');
  if (!pv) return;
  if ((previewW(pv) > 0 && tierOf(previewW(pv)) !== state.tier)
    || (state.mod === 'search' && sfColsNow() !== state.sfCols)) renderPreview();   // 模式 1:视口跨过 s/m/l 断点,列数与折叠可见数都要重算
  else if (state.hp) placeHpop();
});
</script>
</body>
</html>
