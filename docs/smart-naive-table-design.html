<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SmartTable 设计方案</title>
<style>
/* ============================================================
   SmartTable 整体设计方案 —— 可交互原型
   静态复刻 naive-ui 默认主题,仅用于定方案,不代表实现代码。
   本文件是**视觉规格,不随包发布**:截图基线见 docs/baseline/,真实 naive-ui 上的验证见 docs/spike/ 与设计文档第 9 节。
   官方引用(文件:行号)以 `node_modules/naive-ui/es/*.mjs`(2.45.3)的行号为准。
   控件是真的:下拉能点开、值能输入、搜索真的按条件筛数据。
   数据是「远程」的:页面里没有本地静态数据,搜索 / 过滤 / 排序 / 分页都发给 apiRun(带 420ms 延迟的 mock 后端,同一份确定性 2000 行),
   表格 loading、搜索按钮转圈、刷新 = 重新请求,与库的远程模式(fetcher)一致。

   按官方源码校准(tusen-ai/naive-ui main):
   - NCard padding:官方 medium = 19px 24px 20px、small = 12px 16px 12px(src/card/styles/_common.ts);本稿按设计文档 5.4 取四边相等的 16px(官方 small 的左右值,上下也取 16)
   - NCard borderRadius = 3px,borderColor = dividerColor
   视觉取向:macOS 简洁 —— 克制留白、轻分隔、次级操作降级、一屏一个主色按钮。
   ============================================================ */
/* ------------------------------------------------------------
   设计 token —— 对齐 naive-ui 2.45.3 官方主题(D:\Andy\smart-naive-table\node_modules\naive-ui\es)
   记号:CL = _styles/common/light.mjs,CD = _styles/common/dark.mjs;(实算)= 官方 composite/scaleColor 表达式,
   用 import 官方 .mjs 并调用 self(commonVars) 得到,不是手算。
   命名沿用既有变量名(JS 里有 var(--n-text-3) 内联引用,不能改名),语义如下:
     --n-text   = textColor2(正文)     --n-text-1 = textColor1(标题/表头)
     --n-text-2 = textColor3(次要文字) --n-text-3 = placeholder / disabled / icon 色(官方最浅一档)
   自有(官方无对应)的变量逐个标了「自有」。
   ------------------------------------------------------------ */
:root {
  /* —— 主色 —— */
  --n-primary: #18a058;                  /* CL:71 primaryColor(base.primaryDefault CL:36) */
  --n-primary-hover: #36ad6a;            /* CL:72 primaryColorHover(CL:35) */
  --n-primary-pressed: #0c7a43;          /* CL:73 primaryColorPressed(base.primaryActive CL:37):淡色按钮 / 文字按钮的字色(设计 2.15 E1:字对淡底 2.83 -> 4.32) */
  --n-on-primary: #ffffff;               /* button/styles/light.mjs:100 textColorPrimary = baseColor(CL:70 "#FFF") */
  /* —— 面 —— */
  --n-body-bg: rgb(250, 250, 252);      /* 宿主页面底 = NLayout embedded 的 colorEmbedded = actionColor(layout/styles/light.mjs:22;_styles/common/light.mjs:143)。灰底衬白卡:官方 embedded 模式,也是 macOS 分组列表的结构;纯白 bodyColor #fff 是官方默认,但页面与卡片同白只剩 1px 边框(1.15:1)区分 */
  --n-card-bg: #ffffff;                  /* CL:134 cardColor(CL:9) */
  --n-modal-bg: #ffffff;                 /* CL:135 modalColor(NDrawer/NModal 底色) */
  --n-popover-bg: #ffffff;               /* CL:132 popoverColor(NPopover/NDropdown/NSelect 菜单/NMessage 底色) */
  --n-fill: rgb(250, 250, 252);          /* 自有取值:CL:143 actionColor(=card/styles/light.mjs:32 colorEmbedded);窄档卡片列表底 */
  --n-th-bg: rgb(250, 250, 252);         /* data-table/styles/light.mjs:49 thColor = composite(cardColor, tableHeaderColor(CL:144))(实算) */
  --n-row-hover: rgb(247, 247, 250);     /* data-table/styles/light.mjs:46 tdColorHover = composite(cardColor, tableColorHover(CL:146 rgba(0,0,100,.03)))(实算) */
  --n-th-hover: rgb(243, 243, 247);      /* data-table/styles/light.mjs:50 thColorHover = composite(thColor, tableColorHover rgba(0,0,100,.03))(实算);可排序表头悬停 / 排序中 / 漏斗面板打开(thColorSorting 同值,:51) */
  --n-th-btn-hover: rgba(0, 0, 100, 0.03); /* data-table/styles/light.mjs:56 thButtonColorHover = tableColorHover(CL:146) */
  --n-code-bg: rgb(244, 244, 248);       /* CL:141 codeColor(仅外壳里的行内 code) */
  --n-tag-plain: #eee;                   /* CL:137 tagColor(NTag 默认、非 bordered 底;仅外壳里的序号/状态徽标) */
  /* —— 线 —— */
  --n-border: rgb(239, 239, 245);        /* CL:111 dividerColor(卡片边框 card/styles/light.mjs:37、表格线、抽屉分隔线) */
  --n-border-strong: rgb(224, 224, 230); /* CL:112 borderColor(Button light.mjs:89 / Tag light.mjs:61 / Checkbox light.mjs:39 / Pagination 按钮 light.mjs:30) */
  --n-input-border: rgb(224, 224, 230);  /* input/styles/light.mjs:73、_internal/selection/styles/light.mjs:57 = borderColor */
  /* —— 文字 —— */
  --n-text-1: rgb(31, 34, 37);           /* CL:92 textColor1(表头 data-table thTextColor、卡片/抽屉标题) */
  --n-text: rgb(51, 54, 57);             /* CL:93 textColor2(正文、按钮、输入框文字) */
  --n-text-2: rgb(118, 124, 130);        /* CL:94 textColor3(次要文字) */
  --n-text-3: rgb(194, 194, 194);        /* CL:95-98 placeholder/textColorDisabled/iconColor = neutral(alpha4 .24)(实算 rgba(194,194,194,1));empty/styles/light.mjs:22 空态文字也是它 */
  /* —— 输入框 / 下拉触发器 —— */
  --n-input-bg: #ffffff;                 /* CL:140 inputColor = neutral(alphaInput 0)(实算 白);input light.mjs:68 */
  --n-input-bg-focus: #ffffff;           /* input light.mjs:71 colorFocus = inputColor */
  --n-select-bg-active: #ffffff;         /* selection light.mjs:56 colorActive = inputColor */
  --n-input-bg-disabled: rgb(250, 250, 252); /* CL:150 inputColorDisabled(用于「不需要填值」的无值态) */
  --n-ring-input: 0 0 0 2px color-mix(in srgb, var(--n-primary) 20%, transparent);   /* input light.mjs:77-79 boxShadowFocus = primary alpha .2 */
  --n-ring-select: 0 0 0 2px color-mix(in srgb, var(--n-primary) 20%, transparent);  /* selection light.mjs:62-67 boxShadowActive/Focus = primary alpha .2 */
  /* —— 悬停 / 按下 —— */
  --n-item-hover: rgb(243, 243, 245);    /* CL:145 hoverColor(NSelect/NDropdown 选项 hover:select-menu light.mjs:52、dropdown light.mjs:46) */
  --n-btn-hover: rgba(46, 51, 56, .09);  /* CL:152 buttonColor2Hover(Button quaternary hover:button/styles/light.mjs:66) */
  --n-btn-bg: rgba(46, 51, 56, .05);     /* CL:151 buttonColor2(Button secondary 默认型的底:button/styles/light.mjs:59、Button.mjs:250-257) */
  --n-tint: color-mix(in srgb, var(--n-primary-pressed) 16%, transparent);          /* Button secondary + type=primary 的底 = primaryColor α colorOpacitySecondary 0.16(button/styles/light.mjs:56、Button.mjs:250-265),字 = primaryColor */
  --n-tint-hover: color-mix(in srgb, var(--n-primary-pressed) 22%, transparent);    /* colorOpacitySecondaryHover 0.22(light.mjs:57) */
  /* —— 语义色 —— */
  --n-error: #d03050;                    /* CL:87 errorColor(base.errorDefault CL:44) */
  --n-error-hover: #de576d;              /* CL:88 errorColorHover(CL:43) */
  --n-error-pressed: #ab1f3f;            /* CL:89 errorColorPressed(base.errorActive CL:45):淡红按钮 / 红字按钮的字色(3.91 -> 5.33) */
  --n-success: #18a058;                  /* CL:79 successColor(base.successDefault) */
  --n-warning: #f0a020;                  /* CL:83 warningColor(base.warningDefault) */
  --n-info: #2080f0;                     /* CL:75 infoColor(base.infoDefault,_styles/common/light.mjs:40) */
  /* —— 阴影 —— */
  --n-shadow-pop: 0 3px 6px -4px rgba(0,0,0,.12), 0 6px 16px 0 rgba(0,0,0,.08), 0 9px 28px 8px rgba(0,0,0,.05); /* CL:155 boxShadow2(Popover/Dropdown/Select 菜单/Message) */
  --sheet-shadow: 0 6px 16px -9px rgba(0,0,0,.08), 0 9px 28px 0 rgba(0,0,0,.05), 0 12px 48px 16px rgba(0,0,0,.03); /* CL:156 boxShadow3(NDrawer) */
  --n-fix-shadow-l: inset 12px 0 8px -12px rgba(0, 0, 0, .18);   /* data-table/styles/light.mjs:76 boxShadowAfter(固定在左的列,横向滚动后右缘的阴影) */
  --n-fix-shadow-r: inset -12px 0 8px -12px rgba(0, 0, 0, .18);  /* data-table/styles/light.mjs:75 boxShadowBefore(固定在右的列) */
  --n-warn-bg-a: 12%; --n-warn-bd-a: 35%;                         /* tag/styles/light.mjs:127-133 colorBorderedWarning .12 / borderWarning .35 */
  /* —— 下拉选中底(NDropdown 才有;NSelect 菜单无底色,当前规则未引用,留作 NDropdown 参照) —— */
  --dd-on-a: 10%;                        /* dropdown/styles/light.mjs:47-49 optionColorActive = primary alpha .1 */
  /* —— 复选框 —— */
  --chk-border: rgb(224, 224, 230);      /* checkbox/styles/light.mjs:39 border = borderColor(CL:112) */
  --chk-bg: #ffffff;                     /* checkbox/styles/light.mjs:29 color = baseColor */
  --chk-mark: #ffffff;                   /* checkbox/styles/light.mjs:36 checkMarkColor = baseColor */
  /* —— NTag —— */
  --tag-a: 10%;                          /* tag/styles/light.mjs:77-79 colorBorderedPrimary alpha .1(NTag 默认 bordered) */
  --tag-bd-a: 30%;                       /* tag/styles/light.mjs:70-72 borderPrimary alpha .3 */
  --tag-hover-a: 12%;                    /* tag/styles/light.mjs:83-85 closeColorHoverPrimary alpha .12 */
  --tag-a-press: 18%;                    /* tag/styles/light.mjs:86-88 closeColorPressedPrimary alpha .18 */
  --tag-close: var(--n-primary);         /* tag/styles/light.mjs:80 closeIconColorPrimary = primaryColor */
  --tag-bg: rgb(250, 250, 252);          /* tag/styles/light.mjs:64 colorBordered(默认类型、bordered 的底) */
  /* —— NPagination —— */
  --pg-active-bd: var(--n-primary);      /* pagination/styles/light.mjs:50 itemBorderActive = 1px solid primaryColor */
  /* —— 官方状态值(明暗各一套,见 html[data-theme="dark"] 同名项)—— */
  --chk-bg-table: var(--n-card-bg);      /* DataTable 内未选中勾选框的底 = checkbox colorTableHeader = cardColor(checkbox/styles/light.mjs:33;checkbox/src/styles/index.cssr.mjs:17-18 inside-table);随主题取 --n-card-bg,暗色不透明,不是表外 --chk-bg 的 "#0000" */
  --n-op-disabled: .5;                   /* CL:149 opacityDisabled = alphaDisabled(CL:18):Button disabled / DataTable loading(opacityLoading)/ Checkbox disabled */
  --n-clear-hover: rgb(146, 146, 146);   /* CL:119-121 clearColorHover = scaleColor(clearColor, lightness .75)(实算 rgba(146,146,146,1)):Input / Select 的清除图标悬停 */
  --n-close: rgb(102, 102, 102);         /* CL:113-115 closeIconColor = closeIconColorHover = closeIconColorPressed = neutral(alphaClose .6)(实算 rgba(102,102,102,1)):Card / Dialog / Drawer 关闭图标 */
  --n-close-bg-hover: rgba(0, 0, 0, .09); /* CL:116 closeColorHover */
  --n-close-bg-press: rgba(0, 0, 0, .13); /* CL:117 closeColorPressed */
  --n-item-press: rgb(237, 237, 239);    /* CL:148 pressedColor(Tree 节点按下:tree/styles/light.mjs:27) */
  --tn-on-a: 10%;                        /* tree/styles/light.mjs:28-30 nodeColorActive = primary alpha .1 */
  --dp-incl-a: 10%;                      /* date-picker/styles/light.mjs:36-38 itemColorIncluded = primary alpha .1 */
  --radio-focus-a: 20%;                  /* radio/styles/light.mjs:34-36 boxShadowFocus 光圈 = primary alpha .2 */
  --n-ring-input-err: 0 0 0 2px color-mix(in srgb, var(--n-error) 20%, transparent);  /* input/styles/light.mjs:95-97 boxShadowFocusError */
  --n-ring-select-err: 0 0 0 2px color-mix(in srgb, var(--n-error) 20%, transparent); /* selection/styles/light.mjs:90-95 boxShadowActiveError / boxShadowFocusError */
  --n-bg-focus-err: #ffffff;             /* input/styles/light.mjs:93 colorFocusError、selection/styles/light.mjs:96 colorActiveError = inputColor */
  /* —— 设计稿外壳(侧栏/主区/待议占位页):自有,官方无对应物 —— */
  --shell-bg: #ececee;                   /* 自有 */
  --panel-bg: #ffffff;                   /* 自有 */
  --accent: #2563eb;                     /* 自有(当前无规则引用,保留) */
  --warn: #d97706;                       /* 自有:「进行中」徽标。刻意不取官方 warningColor #f0a020(CL:83),它在白底上对比度仅约 2.2:1 */
  --ok: #18a058;                         /* 自有:「已完成」徽标。数值恰与官方 successColor 相同(CL:79) */
}
html[data-theme="dark"] {
  /* —— 主色 —— */
  --n-primary: #63e2b7;                  /* CD:72 primaryColor(base.primaryDefault CD:37) */
  --n-primary-hover: #7fe7c4;            /* CD:73 primaryColorHover(CD:36) */
  --n-primary-pressed: #5acea7;          /* CD:74 primaryColorPressed(base.primaryActive CD:38) */
  --n-on-primary: #000000;               /* button light.mjs:100 textColorPrimary = baseColor;CD:71 baseColor = "#000" */
  /* —— 面 —— */
  --n-body-bg: rgb(16, 16, 20);          /* CD:133 bodyColor(CD:11);暗色 NLayout embedded 的 colorEmbedded 也等于 bodyColor(layout/styles/dark.mjs:25),明暗两套分层逻辑一致 */
  --n-card-bg: rgb(24, 24, 28);          /* CD:131 cardColor(CD:9) */
  --n-modal-bg: rgb(44, 44, 50);         /* CD:132 modalColor(CD:10) */
  --n-popover-bg: rgb(72, 72, 78);       /* CD:129 popoverColor(CD:8) */
  --n-fill: rgba(255, 255, 255, 0.06);   /* 自有取值:CD:140 actionColor = overlay(alphaAction .06)。官方暗色 card colorEmbedded=cardColor(card/styles/dark.mjs:14),与卡片同色、卡片里看不出层次,故不取它 */
  --n-th-bg: rgb(38, 38, 42);            /* data-table/styles/light.mjs:49(dark 复用)thColor = composite(cardColor, tableHeaderColor(CD:141 .06))(实算 rgba(38,38,42,1)) */
  --n-row-hover: rgb(38, 38, 42);        /* data-table/styles/light.mjs:46 tdColorHover = composite(cardColor, tableColorHover(CD:143 .06))(实算 rgba(38,38,42,1)) */
  --n-th-hover: rgb(51, 51, 55);         /* thColorHover = composite(thColor rgb(38,38,42), tableColorHover overlay .06)(实算) */
  --n-th-btn-hover: rgba(255, 255, 255, 0.06); /* thButtonColorHover = tableColorHover(CD:143) */
  --n-code-bg: rgba(255, 255, 255, 0.12); /* CD:138 codeColor = overlay(alphaCode .12) */
  --n-tag-plain: rgb(51, 51, 51);        /* CD:134 tagColor = neutral(alphaTag .2)(实算 rgba(51,51,51,1)) */
  /* —— 线 —— */
  --n-border: rgba(255, 255, 255, 0.09); /* CD:108 dividerColor(alphaDivider .09 CD:28) */
  --n-border-strong: rgba(255, 255, 255, 0.24); /* CD:109 borderColor(alphaBorder .24 CD:27):Button/Tag/Checkbox/Pagination 按钮 */
  --n-input-border: transparent;         /* input/styles/dark.mjs:73、selection/styles/dark.mjs:63 border = "1px solid #0000":暗色输入框无边框,靠底色区分 */
  /* —— 文字 —— */
  --n-text-1: rgba(255, 255, 255, 0.9);  /* CD:93 textColor1(alpha1 .9 CD:12) */
  --n-text: rgba(255, 255, 255, 0.82);   /* CD:94 textColor2 */
  --n-text-2: rgba(255, 255, 255, 0.52); /* CD:95 textColor3 */
  --n-text-3: rgba(255, 255, 255, 0.38); /* CD:96-99 placeholder/textColorDisabled/iconColor = overlay(alpha4 .38) */
  /* —— 输入框 / 下拉触发器 —— */
  --n-input-bg: rgba(255, 255, 255, 0.1); /* CD:137 inputColor = overlay(alphaInput .1) */
  --n-input-bg-focus: color-mix(in srgb, var(--n-primary) 10%, transparent);   /* input/styles/dark.mjs:69-71 colorFocus = primary alpha .1 */
  --n-select-bg-active: color-mix(in srgb, var(--n-primary) 10%, transparent); /* selection/styles/dark.mjs:60-62 colorActive = primary alpha .1 */
  --n-input-bg-disabled: rgba(255, 255, 255, 0.06); /* CD:147 inputColorDisabled */
  --n-ring-input: 0 0 8px 0 color-mix(in srgb, var(--n-primary) 30%, transparent);  /* input/styles/dark.mjs:77-79 boxShadowFocus = 0 0 8px 0 primary alpha .3 */
  --n-ring-select: 0 0 8px 0 color-mix(in srgb, var(--n-primary) 40%, transparent); /* selection/styles/dark.mjs:68-73 = 0 0 8px 0 primary alpha .4(与 Input 的 .3 不同) */
  /* —— 悬停 / 按下 —— */
  --n-item-hover: rgba(255, 255, 255, 0.09); /* CD:142 hoverColor(alphaPending .09 CD:20) */
  --n-btn-hover: rgba(255, 255, 255, .12);   /* CD:149 buttonColor2Hover */
  --n-btn-bg: rgba(255, 255, 255, .08);      /* CD:148 buttonColor2 */
  --n-tint-hover: color-mix(in srgb, var(--n-primary-pressed) 20%, transparent);    /* 暗色 colorOpacitySecondaryHover 0.2(button/styles/dark.mjs:11);常态仍 0.16 */
  /* —— 语义色 —— */
  --n-error: #e88080;                    /* CD:88 errorColor(CD:45) */
  --n-error-hover: #e98b8b;              /* CD:89 errorColorHover(CD:44) */
  --n-error-pressed: #e57272;            /* CD:90 errorColorPressed(base.errorActive CD:46) */
  --n-success: #63e2b7;                  /* CD:80 successColor */
  --n-warning: #f2c97d;                  /* CD:84 warningColor */
  --n-info: #70c0e8;                     /* CD:76 infoColor(base.infoDefault,_styles/common/dark.mjs:41) */
  /* —— 阴影 —— */
  --n-shadow-pop: 0 3px 6px -4px rgba(0,0,0,.24), 0 6px 12px 0 rgba(0,0,0,.16), 0 9px 18px 8px rgba(0,0,0,.10); /* CD:152 boxShadow2 */
  --sheet-shadow: 0 6px 16px -9px rgba(0,0,0,.08), 0 9px 28px 0 rgba(0,0,0,.05), 0 12px 48px 16px rgba(0,0,0,.03); /* CD:153 boxShadow3(与亮色相同) */
  --n-fix-shadow-l: inset 12px 0 8px -12px rgba(0, 0, 0, .36);   /* data-table/styles/dark.mjs:29 boxShadowAfter */
  --n-fix-shadow-r: inset -12px 0 8px -12px rgba(0, 0, 0, .36);  /* data-table/styles/dark.mjs:30 boxShadowBefore */
  --n-warn-bg-a: 0%; --n-warn-bd-a: 30%;                          /* tag/styles/dark.mjs:142-149 colorBorderedWarning #0000 / borderWarning .3 */
  --dd-on-a: 15%;                        /* dropdown/styles/dark.mjs:20-22 optionColorActive = primary alpha .15 */
  /* —— 复选框 —— */
  --chk-border: rgba(255, 255, 255, 0.24); /* checkbox/styles/light.mjs:39(dark 复用)border = borderColor(CD:109) */
  --chk-bg: transparent;                 /* checkbox/styles/dark.mjs:12 color = "#0000" */
  --chk-mark: rgb(24, 24, 28);           /* checkbox/styles/dark.mjs:13 checkMarkColor = cardColor */
  /* —— NTag —— */
  --tag-a: 0%;                           /* tag/styles/dark.mjs:80 colorBorderedPrimary = "#0000" */
  --tag-bd-a: 30%;                       /* tag/styles/dark.mjs:73-75 borderPrimary alpha .3 */
  --tag-hover-a: 16%;                    /* tag/styles/dark.mjs:90-92 closeColorHoverPrimary alpha .16 */
  --tag-a-press: 12%;                    /* tag/styles/dark.mjs:93-95 closeColorPressedPrimary alpha .12 */
  --tag-close: rgb(69, 158, 128);        /* tag/styles/dark.mjs:81-83 closeIconColorPrimary = scaleColor(primary, lightness .7)(实算 rgba(69,158,128,1)) */
  --tag-bg: transparent;                 /* tag/styles/dark.mjs:67 colorBordered = "#0000" */
  /* —— NPagination —— */
  --pg-active-bd: color-mix(in srgb, var(--n-primary) 52%, transparent); /* pagination/styles/dark.mjs:21-25 itemBorderActive = primary alpha opacity3(.52) */
  /* —— 官方状态值 —— */
  --n-op-disabled: .38;                  /* CD:146 opacityDisabled = alphaDisabled(CD:18) */
  --n-clear-hover: rgba(255, 255, 255, 0.48); /* CD:116-118 clearColorHover = scaleColor(overlay(alpha4), alpha 1.25)(实算 rgba(255,255,255,.48)) */
  --n-close: rgba(255, 255, 255, 0.52);  /* CD:110-112 closeIconColor(+Hover / Pressed)= overlay(alphaClose .52) */
  --n-close-bg-hover: rgba(255, 255, 255, .12); /* CD:113 closeColorHover */
  --n-close-bg-press: rgba(255, 255, 255, .08); /* CD:114 closeColorPressed */
  --n-item-press: rgba(255, 255, 255, 0.05); /* CD:145 pressedColor = overlay(alphaPressed .05) */
  --tn-on-a: 15%;                        /* tree/styles/dark.mjs:21-23 nodeColorActive = primary alpha .15 */
  --dp-incl-a: 15%;                      /* date-picker/styles/dark.mjs:26-28 itemColorIncluded = primary alpha .15 */
  --radio-focus-a: 30%;                  /* radio/styles/dark.mjs:37-39 boxShadowFocus 光圈 = primary alpha .3 */
  --n-ring-input-err: 0 0 8px 0 color-mix(in srgb, var(--n-error) 30%, transparent);  /* input/styles/dark.mjs:99-101 boxShadowFocusError */
  --n-ring-select-err: 0 0 8px 0 color-mix(in srgb, var(--n-error) 40%, transparent); /* selection/styles/dark.mjs:98-103 boxShadowActiveError / boxShadowFocusError */
  --n-bg-focus-err: color-mix(in srgb, var(--n-error) 10%, transparent); /* input/styles/dark.mjs:95-97 colorFocusError、selection/styles/dark.mjs:104-106 colorActiveError = error alpha .1 */
  /* —— 设计稿外壳:自有 —— */
  --shell-bg: #0b0b0e;                   /* 自有 */
  --panel-bg: rgb(24, 24, 28);           /* 自有(数值恰同 cardColor) */
  --accent: #60a5fa;                     /* 自有 */
  --warn: #fbbf24;                       /* 自有(官方暗色 warningColor #f2c97d,CD:84) */
  --ok: #63e2b7;                         /* 自有(数值同官方暗色 successColor CD:80) */
}

* { box-sizing: border-box; }
html, body { height: 100%; }
/* 自有:naive 的主题不含 color-scheme;加它是为了让原生滚动条 / 表单控件跟随明暗 */
html { color-scheme: light; }
html[data-theme="dark"] { color-scheme: dark; }   /* 原生滚动条 / 表单控件跟随主题 */
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  font-size: 14px; color: var(--n-text); background: var(--shell-bg);
  -webkit-font-smoothing: antialiased;
}

/* ---------- 骨架 ---------- */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.side {
  background: var(--panel-bg); border-right: 1px solid var(--n-border);
  padding: 22px 14px 8px; position: sticky; top: 0; height: 100vh; overflow-y: auto;   /* 底部内边距 8px:13 个子页的侧栏在 1440×900 下刚好放下、不出滚动条 */
}
.side h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: .2px; }
.side .sub { font-size: 11.5px; color: var(--n-text-2); margin: 0 0 18px; line-height: 1.6; }
.side .group-title {
  font-size: 11px; font-weight: 600; letter-spacing: .08em;
  color: var(--n-text-2); text-transform: uppercase; margin: 22px 0 8px;
}

.mod {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; cursor: pointer;
  border: 1px solid transparent; background: transparent; color: inherit;
  border-radius: 7px; padding: 9px 10px; margin-bottom: 3px; font-family: inherit; font-size: 13px;
  transition: background-color .15s;
}
.mod:hover { background: var(--n-item-hover); }
.mod.on { background: color-mix(in srgb, var(--n-primary) 10%, transparent); border-color: color-mix(in srgb, var(--n-primary) 35%, transparent); font-weight: 600; }
.mod .nm { flex: 1 1 auto; min-width: 0; }
/* 两级目录:组名是不可点的小标题(正文色、比「设计模块」这类灰色区块标题深一档,层级才分得开),子页常显、无编号;
   亮点 ★ 只用 warn 色字、不加底,不抢当前项的主色。 */
.nav-h { font-size: 12px; font-weight: 600; color: var(--n-text); margin: 11px 0 3px 10px; }
.nav-h:first-child { margin-top: 0; }
.mod .hl { flex: none; font-size: 11px; line-height: 1; color: var(--warn); }
#grpBar { display: none; }

/* ---- 升级变更页。入口 = 侧栏版本行里的「升级变更」文字链接(不占目录高度);
   这是外壳里的文档页、不是表格模拟,属于设计标准 3 的明确例外(见设计文档「2.1.1 → 3.0.0 变更总览」)。 ---- */
.ver-link { font: inherit; color: var(--n-primary); background: none; border: 0; padding: 0; cursor: pointer; }
.ver-link:hover { text-decoration: underline; }
.ver-link.on { font-weight: 600; }
.chg { background: var(--n-card-bg); border: 1px solid var(--n-border); border-radius: 10px; padding: 20px 24px 24px; color: var(--n-text); font-size: 13px; line-height: 1.65; }
.chg-lead { margin: 0; color: var(--n-text-2); }
.chg-lead b { color: var(--n-text); font-weight: 600; }
.chg h3 { font-size: 14px; font-weight: 600; margin: 22px 0 6px; }
.chg-note { margin: 0 0 8px; color: var(--n-text-2); }
.chg-wrap { overflow-x: auto; }
.chg-t { width: 100%; min-width: 720px; border-collapse: collapse; }
.chg-t th, .chg-t td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--n-border); }
.chg-t th { background: var(--n-th-bg); font-weight: 500; white-space: nowrap; }
.chg-t td:first-child { white-space: nowrap; color: var(--n-text-2); }
.chg-t b { font-weight: 600; }
.chg code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; background: var(--n-fill); padding: 0 4px; border-radius: 3px; }
.chg ol { margin: 0; padding-left: 20px; }
.chg .warn { color: var(--warn); }
.mod .st { font-size: 10px; padding: 1px 5px; border-radius: 3px; flex: none; font-weight: 500; }
.st.done { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.st.doing { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.st.todo { background: var(--n-tag-plain); color: var(--n-text-2); }

.mini { display: flex; gap: 6px; }
.mini button {
  flex: 1; cursor: pointer; font-family: inherit; font-size: 12px;
  border: 1px solid var(--n-border-strong); background: transparent; color: var(--n-text-2);
  border-radius: 5px; padding: 5px 8px; transition: background-color .15s, border-color .15s, color .15s;
}
.mini button:hover { border-color: var(--n-primary); }
.mini button.on { border-color: var(--n-primary); color: var(--n-primary); background: color-mix(in srgb, var(--n-primary) 10%, transparent); }

/* 子页签:只在窄档出现(宽档侧栏已常显全部子页)—— 分组里有 ≥2 个子页时,内容区上方的分段控件。与 .mini 同一套 token、同一个 .15s 过渡,
   但不画描边:槽底用 --n-tag-plain,选中项浮成卡片底 + 主色字(macOS 分段控件的做法)。纯呈现,点一下 = enterModule(键)。 */
.subtabs { display: none; gap: 2px; padding: 2px; border-radius: 7px; background: var(--n-tag-plain); align-self: center; }
.subtab {
  cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 500; line-height: 16px; white-space: nowrap;
  border: 0; background: transparent; color: var(--n-text-2); border-radius: 5px; padding: 3px 12px;
  transition: background-color .15s, color .15s;
}
.subtab:hover { color: var(--n-text); }
.subtab.on { background: var(--n-card-bg); color: var(--n-primary); }

/* ---------- 主区 ---------- */
.main { padding: 26px 32px 64px; min-width: 0; }
.crumb { font-size: 12px; color: var(--n-text-2); margin-bottom: 6px; }
.stage-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
.stage-head h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
.stage-desc { color: var(--n-text-2); font-size: 13px; margin: 0 0 18px; max-width: 860px; line-height: 1.75; }
.stage-desc:empty { display: none; }

.viewport {
  background: var(--n-body-bg); border: 0; border-radius: 10px;   /* 视口只当宿主页面区域,不画描边:里面的卡片已有官方 1px 描边,再画一层就成了「双框」 */
  padding: 22px; position: relative;
}

/* ---------- naive-ui 复刻 ---------- */
.n-card { background: var(--n-card-bg); border: 1px solid var(--n-border); border-radius: 3px; padding: 16px; }   /* 四边相等(5.4):工具栏上缘 / 表格左右缘 / 分页条下缘到卡片边都是 16px + 1px 描边 */
.smart-table { display: flex; flex-direction: column; gap: 16px; container-type: inline-size; }   /* 三档布局的查询容器:宽度 = 卡片外宽 */

.n-form-item { display: flex; align-items: center; gap: 0; min-width: 0; }
.n-form-item > label { font-size: 14px; color: var(--n-text-1); white-space: nowrap; flex: none; }   /* NFormItem labelTextColor = textColor1(form/styles/light.mjs:21;form/src/styles/form-item.cssr.mjs:15) */

/* 真输入框 NInput(medium):高 34px、字号 14px、内边距 0 12px(官方边框是绝对定位覆盖层、不占内容区;原型用真 1px 边框,所以内边距写 11px)、圆角 3px(input/styles/_common.mjs paddingMedium、_styles/common/_common.mjs)
   边框 borderColor(暗色透明,靠底色 .1 区分)、hover / focus 边框 primaryColorHover(input/styles/light|dark.mjs:73-76)
   focus:亮色 0 0 0 2px primary .2;暗色 0 0 8px 0 primary .3 且底色变 primary .1(input/styles/light.mjs:71,77-79、dark.mjs:69-79)—— 见 --n-ring-input / --n-input-bg-focus */
.n-input {
  height: 34px; border: 1px solid var(--n-input-border); border-radius: 3px;
  background: var(--n-input-bg); display: flex; align-items: center; padding: 0 11px;
  font-size: 14px; color: var(--n-text); min-width: 0; flex: 1 1 auto;
  transition: border-color .15s, box-shadow .15s, background-color .15s; cursor: text;
}
.n-input:hover { border-color: var(--n-primary-hover); }
.n-input:focus-within { border-color: var(--n-primary-hover); background: var(--n-input-bg-focus); box-shadow: var(--n-ring-input); }
.n-input input {
  border: 0; outline: 0; background: transparent; font: inherit; color: inherit;
  width: 100%; min-width: 0; padding: 0;
}
.n-input input::placeholder { color: var(--n-text-3); }
/* 下拉触发器 NSelect(InternalSelection):内边距 0 26px 0 12px,不随 size 变,右侧 26px 留给箭头(selection/styles/_common.mjs:3);边框是覆盖层不占内容区,原型真 1px 边框所以写 0 25px 0 11px
   箭头 16px、距右 10px(selection/src/styles/index.cssr.mjs base-suffix right:10px;_common.mjs arrowSize)
   hover 边框 primaryColorHover、展开边框 primaryColor(selection/styles/light.mjs:58-59)
   展开:亮色 0 0 0 2px primary .2;暗色 0 0 8px 0 primary .4 且底色 primary .1(selection/styles/light.mjs:62-67、dark.mjs:60-73)—— 见 --n-ring-select / --n-select-bg-active */
.n-select {
  position: relative;
  height: 34px; border: 1px solid var(--n-input-border); border-radius: 3px;
  background: var(--n-input-bg); display: flex; align-items: center;
  padding: 0 25px 0 11px; font-size: 14px; color: var(--n-text); min-width: 0; cursor: pointer;
  transition: border-color .15s, box-shadow .15s, background-color .15s; user-select: none;
}
.n-select:hover { border-color: var(--n-primary-hover); }
.n-select:focus-visible { outline: 0; border-color: var(--n-primary-hover); box-shadow: var(--n-ring-select); }   /* 已聚焦、菜单未展开:borderFocus = primaryColorHover + boxShadowFocus(selection/styles/light.mjs:60、65-67、dark.mjs:66、71-73;selection/src/styles/index.cssr.mjs:123-125),写在 .open 之前,展开后的 primaryColor 覆盖它 */
.n-select.open { border-color: var(--n-primary); background: var(--n-select-bg-active); box-shadow: var(--n-ring-select); }
.n-select .val { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.n-select .val.ph { color: var(--n-text-3); }
.n-select .caret {
  position: absolute; top: 0; bottom: 0; right: 8px; width: 16px;   /* 官方 base-suffix right:10px 且边框是覆盖层;原型有 1px 真边框,再让出 1px,箭头中心距外沿 17px 同官方实测 */
  display: flex; align-items: center; justify-content: center;
  color: var(--n-text-3);   /* arrowColor = iconColor(selection/styles/light.mjs:69);图形 = ChevronDown 16px(_internal/icons/ChevronDown.mjs、selection/styles/_common.mjs arrowSize) */
}
.n-select .caret svg { display: block; width: 16px; height: 16px; }
.n-select.sm { height: 28px; font-size: 14px; }   /* NSelect small:高 heightSmall 28px、字号 fontSizeSmall 14px(_styles/common/_common.mjs:15、22;_internal/selection/styles/light.mjs:41) */
.n-input.sm { height: 28px; font-size: 14px; padding: 0 9px; }   /* 与 .n-select.sm 同高(heightSmall 28px),面板行对齐;官方 paddingSmall 0 10px(input/styles/_common.mjs),扣真边框 1px */

/* NButton(medium,default):边框 borderColor(暗 .24)、字 textColor2;hover 边框与字 primaryColorHover(button/styles/light.mjs:73,75,89,90)
   quaternary(.quiet / .icon):无边框、字 textColor2 且 hover 不变、hover 底 buttonColor2Hover(button/src/Button.mjs:275-297、light.mjs:66) */
.n-btn {
  height: 34px; padding: 0 14px; border-radius: 3px; font-size: 14px; cursor: pointer;
  /* 边框不占布局(同官方):NButton 本体 border: none,边框是绝对定位铺满的 .n-button__border(inset 0、border 1px solid、pointer-events: none、过渡只有 border-color,
     button/src/styles/index.cssr.mjs:22、89-97)。原型用 border-width: 0 保住 border-color 供各变体改色,1px 描边画在 ::after 上(border-color: inherit),
     按钮宽度 = 内边距 × 2 + 内容,与官方一致(真实 1px 边框会把每个有边框的按钮撑宽 2px)。 */
  position: relative; border: 0 solid var(--n-border-strong); background: transparent; color: var(--n-text);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-family: inherit;
  transition: background-color .15s, border-color .15s, color .15s;
}
.n-btn::after { content: ""; position: absolute; inset: 0; border: 1px solid; border-color: inherit; border-radius: inherit; pointer-events: none; }
.n-btn:hover { border-color: var(--n-primary-hover); color: var(--n-primary-hover); }
.n-btn.primary { background: var(--n-primary); border-color: var(--n-primary); color: var(--n-on-primary); }
.n-btn.primary:hover { background: var(--n-primary-hover); border-color: var(--n-primary-hover); color: var(--n-on-primary); }
/* 淡色主题按钮(NButton secondary type=primary):无描边、底 = 主色 α、字 = 主色;「搜索」专用(设计 2.13)。不是实心,不占「一屏一个实心主色」 */
.n-btn.tint { background: var(--n-tint); border-color: transparent; color: var(--n-primary-pressed); }
.n-btn.tint:hover { background: var(--n-tint-hover); border-color: transparent; color: var(--n-primary-pressed); }
/* 淡灰按钮(NButton secondary,默认型):无描边、底 = buttonColor2、字 textColor2、hover 底 buttonColor2Hover 字不变;「重置」专用,与「搜索」成对(设计 2.13) */
.n-btn.sec { background: var(--n-btn-bg); border-color: transparent; color: var(--n-text); }
.n-btn.sec:hover { background: var(--n-btn-hover); border-color: transparent; color: var(--n-text); }
.n-btn.quiet { border-color: transparent; color: var(--n-text); padding: 0 14px; }   /* quaternary medium:paddingMedium 0 14px(button/styles/_common.mjs:5) */
.n-btn.quiet:hover { background: var(--n-btn-hover); color: var(--n-text); border-color: transparent; }
.n-btn.icon {
  width: 28px; height: 28px; padding: 0; border-radius: 50%; border-color: transparent;
  justify-content: center; color: var(--n-text);
}
.n-btn.icon:hover { background: var(--n-btn-hover); color: var(--n-text); border-color: transparent; }
.n-btn.icon.on { background: var(--n-btn-hover); color: var(--n-text); }
.n-btn.sm { height: 28px; padding: 0 10px; font-size: 14px; }   /* NButton size=small:heightSmall 28 / paddingSmall 0 10px / fontSizeSmall 14(button/styles/_common.mjs、_styles/common/_common.mjs:15、22)*/
/* 焦点环:全部 .n-btn 统一(不依赖浏览器默认的黑色圆环,观感一致);
   只在键盘聚焦(:focus-visible)时出现,鼠标点击不出现;克制的主色细环,外扩 2px,圆形图标按钮的环自动跟着圆角走 */
.n-btn:focus-visible { outline: 2px solid color-mix(in srgb, var(--n-primary) 55%, transparent); outline-offset: 2px; }
/* 文字按钮:NButton text —— 无边框无底无盒:height / padding / border-radius 都是 initial(button/src/Button.mjs:342、344、347),宽 = 文字宽;字色 textColor2,悬停 primaryColorHover(button/styles/light.mjs textColorText / textColorTextHover)。
   窄档卡片 .rc-act、窄档抽屉与列头面板的 .hp-tools 里放大了点击区域,各自在下面声明为有意偏离 */
.n-btn.text { border-color: transparent; height: auto; padding: 0; border-radius: 0; }
.n-btn.text:hover { border-color: transparent; color: var(--n-primary-hover); }
/* 危险:字色 errorColor / 悬停 errorColorHover(_styles/common/light|dark.mjs);描边仍是低对比的 borderColor(有意偏离官方 type=error 的红描边:macOS 取向,少一处强色) */
.n-btn.danger { color: var(--n-error-pressed); }
.n-btn.danger:hover { color: var(--n-error-hover); border-color: var(--n-error-hover); }
/* 表单 / 弹窗操作区(设计 2.15 B):默认动作 = 实心主色(.primary);删除确认的「删除」= 实心红(NButton type=error,button/styles/light.mjs colorError、textColorError = baseColor);
   其余 = 淡灰 .sec。底部按钮最小宽 80,取消 / 保存宽度稳定、转圈不让按钮宽度跳 */
.n-btn.err { background: var(--n-error); border-color: transparent; color: var(--n-on-primary); }
.n-btn.err:hover { background: var(--n-error-hover); border-color: transparent; color: var(--n-on-primary); }
/* 页面操作按钮的淡红(NButton secondary type=error:底 = errorColor α .16、字 = errorColor,Button.mjs:250-265);删除类动作(设计 2.15 A) */
.n-btn.tint-e { background: color-mix(in srgb, var(--n-error-pressed) 16%, transparent); border-color: transparent; color: var(--n-error-pressed); }
.n-btn.tint-e:hover { background: color-mix(in srgb, var(--n-error-pressed) 22%, transparent); border-color: transparent; color: var(--n-error-pressed); }
.n-btn.sec.on { background: var(--n-btn-hover); }   /* 菜单按钮展开态 */
/* 表格行内 / 子表的文字按钮(宿主写法):颜色对应用途 + 小图标,无底(行密度)。编辑 = 主色字(NButton text type=primary),删除 = 红字(type=error) */
.n-btn.text.pri { color: var(--n-primary-pressed); }
.n-btn.text.pri:hover { color: var(--n-primary-hover); }
.n-btn.text { gap: 0; }
.n-btn.text .btn-ic { width: 1em; height: 1em; font-size: inherit; margin: 0 4px 0 0; }
.mc-foot .n-btn, .sheet-foot .n-btn, .dw-foot .n-btn, .dlg-act .n-btn { min-width: 80px; }
.n-btn.text.danger:hover { border-color: transparent; }

.st-title { margin: 0; font-size: 16px; font-weight: 500; color: var(--n-text-1); }   /* 卡片标题:small 16px / fontWeightStrong 500 / textColor1(card/styles/_common.mjs titleFontSizeSmall、card/styles/light.mjs:36,39) */

table.n-table { width: 100%; border-collapse: collapse; font-size: 14px; }
/* 单元格内边距 = 官方 DataTable size 的 th/td padding:medium 12px、small 8px(data-table/styles/_common.mjs:3-8 thPadding* / tdPadding*,四边相等、不含边框)。紧凑 = small(见下方 [data-density=compact]) */
table.n-table th, table.n-table td { border: 1px solid var(--n-border); padding: 12px; text-align: left; white-space: nowrap; }
table.n-table th { background: var(--n-th-bg); font-weight: 500; color: var(--n-text-1); }   /* data-table/styles/light.mjs:54-55 thTextColor = textColor1、thFontWeight = 500 */
table.n-table td { color: var(--n-text); }
table.n-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
/* 勾选行没有整行底色:官方 NDataTable 勾选只改复选框 */
/* 状态徽标 = NTag size small(默认 bordered、非 round):高 22px、字号 12px、行高 1、内边距 0 7px、圆角 2px(tag/styles/light.mjs:22,41,47、_common.mjs:11、tag/src/styles/index.cssr.mjs:22)
   primary 型:底 --tag-a、边 --tag-bd-a、字 primaryColor(tag light.mjs:70-79、dark.mjs:73-80);默认型(.off):底 colorBordered、边 borderColor、字 textColor2(light.mjs:61-64、dark.mjs:64-67)
   边框用 inset box-shadow 画(官方是绝对定位的 __border 层,不占布局) */
.pill {
  display: inline-flex; align-items: center; vertical-align: middle; height: 22px; padding: 0 7px; border-radius: 2px;
  font-size: 12px; line-height: 1; white-space: nowrap;
  background: color-mix(in srgb, var(--n-primary) var(--tag-a), transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--n-primary) var(--tag-bd-a), transparent);
  color: var(--n-primary);
}
.pill.off { background: var(--tag-bg); box-shadow: inset 0 0 0 1px var(--n-border-strong); color: var(--n-text); }
/* NPagination:文字 textColor2;上一页/下一页按钮边 borderColor;当前页边 primary(暗 primary .52)(pagination/styles/light.mjs:30,36,39,50、dark.mjs:21-25) */

.search-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 16px; }
.search-grid .n-form-item > label { width: 70px; padding-right: 12px; text-align: right; justify-content: flex-end; }   /* 官方 NFormItem label-placement=left:labelWidth(此处 70)含右内边距 12px(form/styles/_common.mjs:20 labelPaddingHorizontal "0 12px 0 0"),文字右缘离控件 12px */
.search-grid > .search-actions { grid-column: -2 / -1; }
.search-actions { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }

/* ============================================================
   条件构造器 / 工具栏(模式 2)
   三档由 .smart-table 的容器宽度决定(卡片外宽):
     宽 >= 960 · 中 600-959 · 窄 < 600  —— 与 JS 的 T_NARROW / T_WIDE 一致
   ============================================================ */
.f-field, .f-op, .f-val { position: relative; min-width: 0; }
.f-val .n-input { padding-right: 30px; }
.f-val .ic { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: var(--n-text-2); pointer-events: none; display: flex; }
.f-val.novalue .n-input { background: var(--n-input-bg-disabled); border-style: dashed; }   /* 无值态 ≈ NInput disabled:底 inputColorDisabled(CL:150 / CD:147) */
:where(.f-val.novalue) .n-input { border-color: var(--n-border-strong); }   /* 暗色输入框边是透明的,虚线要看得见就取 borderColor;:where 让 hover/focus 的 primary 边仍能盖过 */

.cond { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cond .f-field { width: 136px; flex: none; }
.cond .f-op    { width: 112px; flex: none; }
.cond .f-val   { flex: 1 1 100px; min-width: 100px; }   /* 宽档 1:1 的最窄点(整行 1280)左半区 609px,值输入框只剩约 114px,最小宽度取 100 才放得下 */
.cond > .n-btn, .cond > .pop-wrap { flex: none; }

/* 下拉菜单:NDropdown 底色 = popoverColor(暗 rgb(72,72,78)),无描边、靠 boxShadow2,圆角 3px(dropdown/styles/light.mjs、_styles/common/light|dark.mjs)
   选项:高 34px、字号 14px(dropdown/styles/light.mjs optionHeightMedium / optionFontSizeMedium);
   文字距菜单边 12px = 菜单 padding 4px + 选项 padding 8px,hover 块两侧各缩进 4px、圆角 3px(dropdown/src/styles/index.cssr.mjs ::before inset 4px);
   hover = hoverColor,选中 = 字色 primary(NSelect 无底色,NDropdown 才有 primary 10%/15% 底;本页三个控件都是 NSelect,取 NSelect 的) */
.dd {
  position: absolute; z-index: 40; top: calc(100% + 4px); left: 0; min-width: 100%;
  max-height: 258px; overflow-y: auto;   /* NSelect 菜单 height = 选项高 34px × 7.6(_internal/select-menu/styles/_common.mjs) */
  background: var(--n-popover-bg); border-radius: 3px;
  box-shadow: var(--n-shadow-pop); padding: 4px;
}
.dd .it, .col-pop .it {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  height: 34px; line-height: 34px; font-size: 14px; padding: 0 8px; border-radius: 3px; color: var(--n-text);
  cursor: pointer; white-space: nowrap;
  transition: background-color .15s;
}
.dd .it:hover, .col-pop .it:hover { background: var(--n-item-hover); }
.dd .it.on { color: var(--n-primary); }   /* NSelect 菜单:选中项无底色、仅字色 primary(_internal/select-menu/styles/light.mjs optionColorActive = rgba(0,0,0,0)、optionTextColorActive = primaryColor) */

/* 图标按钮 / 角标的定位锚 */
.pop-wrap { position: relative; display: inline-flex; }
.n-btn.icon { position: relative; }
.badge {
  display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px;
  padding: 0 4px; border-radius: 8px; font-size: 11px; background: var(--n-primary); color: var(--n-on-primary);
  position: absolute; top: -3px; right: -3px; pointer-events: none;
}

/* —— 工具栏骨架:grid,默认 = 宽档单行 —— */
/* 宽档(整行 ≥ 1280):两个等宽的列 1:1 —— 左半 = 搜索区域(标题 + 条件构造器 + 搜索/重置),右半 = 按钮区域(业务按钮 + 图标,靠右)。
   中档 / 窄档下两个包装 .tb-left / .tb-right 用 display: contents 退场,里面的元素回到下面各自的 grid-area(见容器查询)。 */
.tb {
  display: grid; align-items: center; column-gap: 12px; row-gap: 10px; margin-bottom: 12px;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
}
.tb-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tb-left .tb-title { flex: none; }
.tb-left .tb-cond { flex: 1 1 0; min-width: 0; }
.tb-right { display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-width: 0; }
.tb-title { grid-area: title; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-cond { grid-area: cond; position: relative; min-width: 0; }
.tb-actions { grid-area: actions; display: flex; align-items: center; gap: 8px; }
.tb-icons { grid-area: icons; display: flex; align-items: center; gap: 4px; }
.tb-search { grid-area: search; display: none; align-items: center; gap: 8px; min-width: 0; }
.tb-csearch { grid-area: csearch; }   /* 模块 3 / 4 的窄档:条件搜索自成一行(在列头「筛选 / 排序」两个按钮之上) */
.tb .ops-toggle { grid-area: ops; display: none; }
.tb.ops-open .ops-toggle { background: var(--n-btn-hover); color: var(--n-text); }
.tb-search .f-val { flex: 1 1 auto; min-width: 0; }
.tb-search .pop-wrap { flex: none; }
.tb-search .badge { top: -6px; right: 0; }   /* 角标贴在按钮右上角内沿:不伸出卡片内容区,否则 390 宽下工具栏会横向溢出 */

/* 多条件气泡:NPopover = popoverColor(暗 rgb(72,72,78))+ boxShadow2 + 圆角 3px(popover/styles/light.mjs);show-arrow=false,无描边,与触发器间距 6px(无箭头取 space,popover/styles/_common.mjs:3、popover/src/styles/index.cssr.mjs:135)。
   官方内边距 8px 14px(popover/styles/_common.mjs),此处内容是表单面板,取 14px 均匀内边距 */
.cond-panel {
  position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; width: min(660px, 100%);
  background: var(--n-popover-bg); border-radius: 3px;
  box-shadow: var(--n-shadow-pop); padding: 14px;
}
.cond-panel .row {
  display: grid; align-items: center; gap: 8px; margin-bottom: 10px;
  grid-template-columns: 64px minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.5fr) 28px;
}
.cond-panel .logic { position: relative; min-width: 0; }
.cond-panel .logic-ghost {
  height: 28px; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--n-text-2);
}
.cond-panel .panel-foot { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--n-border); padding-top: 12px; margin-top: 2px; }

/* 列设置气泡:锚在按钮下方、右对齐 */
.col-pop {
  position: absolute; z-index: 30; top: calc(100% + 6px); right: 0; min-width: 168px;
  background: var(--n-popover-bg); border-radius: 3px;
  box-shadow: var(--n-shadow-pop); padding: 4px;
}
.col-pop .it { justify-content: flex-start; gap: 8px; padding: 0 12px 0 10px; }   /* NDropdown 选项文字距菜单边:左 14px(前缀槽 optionPrefixWidthMedium 14px)、右 16px(后缀槽 min-width 14px + padding 0 8px,box-sizing: border-box → 16px)(dropdown/styles/_common.mjs:9、17;dropdown/src/styles/index.cssr.mjs:66-67、82-90);容器内边距已占 4px,所以选项内边距左 10 / 右 12。NSelect 菜单(.dd)的选项是 0 12px,不在此列 */

/* 「更多」菜单(设计文档 7.3):官方 NDropdown 的外观——选项 34px、hover 块、分隔线 = dividerColor(dropdown/styles/light.mjs)。
   锚在按钮下方、左对齐(按钮在业务按钮组末尾,右侧还有内置图标,不靠右贴边) */
.more-pop { left: 0; right: auto; min-width: 148px; }
.more-pop .sep { height: 1px; margin: 4px 0; background: var(--n-border); }
.n-btn .chev { display: inline-flex; margin-right: -2px; color: var(--n-text-3); }   /* 官方 NButton / NDropdown 触发器 / NSelect 箭头展开时都不旋转(_internal/selection/src/styles/index.cssr.mjs:34-44 arrow 只有 color 过渡;_internal/suffix/src/Suffix.mjs 固定 ChevronDown);仓库动效铁律:过渡只做 opacity / background-color / border-color */

/* 批量栏:原地替换工具栏那一行,min-height 由 JS 内联 */
.tb-batch { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }   /* 内容贴第 1 行,min-height 占位 */
.tb-batch .bt-info { display: inline-flex; align-items: center; gap: 8px; height: 34px; font-weight: 500; white-space: nowrap; }
.tb-batch .bt-acts { display: flex; align-items: center; gap: 8px; }
.tb-batch .tb-icons { margin-left: auto; height: 34px; }

/* 已生效条件:NTag(round / size small / type primary / closable / 默认 bordered)
   高 22px、字号 12px:tag/styles/light.mjs:41,47(heightSmall<-heightTiny、fontSizeSmall<-fontSizeTiny)+ _styles/common/_common.mjs
   圆角 = 高/2 = 11px,内边距 0 h/4 0 h/3 = 0 5.5px 0 7.33px:tag/src/styles/index.cssr.mjs:51-59(--round + --closable)
   关闭钮 16px、图标 12px、margin-left 4px:tag/styles/_common.mjs:4,8,12
   底色 primary 10%(暗色透明)+ 1px 边框 primary 30%:tag/styles/light.mjs:70-79、dark.mjs:73-80
     边框用 inset box-shadow 画(官方是绝对定位的 __border 层),不占布局
   标签间距取 NSpace medium = 8px 12px:space/styles/_common.mjs */
/* chips 位于表格下方、与分页同一行(.dt-foot:chips 靠左、分页靠右)。原因:放在表格上方时 chips 出现 / 消失会让页面布局跳动,放到分页那一行(恒占分页的 28px 高)就不会。
   宽 / 中档单行不换行:.chips-list 吃剩余宽度、放不下的 chip 由 JS(foldChips)折成「+N」;「清除全部 / 恢复默认」紧跟其后、不折。窄档(容器 < 600)chips 单独一行在分页上方,可换行(见窄档规则) */
.chips { display: flex; align-items: center; gap: 12px; flex: 1 1 0; min-width: 0; }
.chips-list { display: flex; align-items: center; gap: 8px 12px; flex: 0 1 auto; min-width: 0; overflow: hidden; }
.chips [hidden] { display: none !important; }
.chips[data-n="1"] { display: none; }
.dt-foot { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 12px; }
.dt-foot > .n-pagination { margin-top: 0; flex: none; }
.chip {
  display: inline-flex; align-items: center; flex: none; height: 22px; padding: 0 5.5px 0 7.33px;
  border-radius: 11px; font-size: 12px; line-height: 1; white-space: nowrap; cursor: default;
  background: color-mix(in srgb, var(--n-primary) var(--tag-a), transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--n-primary) var(--tag-bd-a), transparent);
  color: var(--n-primary);
}
.chip button {
  /* 官方 NTag 的关闭钮 = n-base-close absolute:元素本身 12×12(= closeIconSize,tag/styles/_common.mjs:3-4、_internal/close/src/styles/index.cssr.mjs 的 absolute 修饰),
     悬停 / 按下的圆底是 ::before,16×16(closeSize,tag/styles/_common.mjs:7-8)居中,不占布局 */
  position: relative; flex: none; width: 12px; height: 12px; margin: 0 0 0 4px; padding: 0; border: 0; border-radius: 0;
  background: transparent; color: var(--tag-close); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.chip button::before { content: ""; position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%); border-radius: 50%; transition: background-color .15s; }
.chip button svg { width: 12px; height: 12px; position: relative; }
.chip button:hover::before { background: color-mix(in srgb, var(--n-primary) var(--tag-hover-a), transparent); }
.chip button:active::before { background: color-mix(in srgb, var(--n-primary) var(--tag-a-press), transparent); }
.chips .clear {
  flex: none; height: 22px; padding: 0 4px; border: 0; background: transparent; cursor: pointer;
  font: inherit; font-size: 12px; color: var(--n-text); transition: color .15s;   /* NButton text:字 textColor2、hover primaryColorHover(button/styles/light.mjs:79-80) */
}
.chips .clear:hover { color: var(--n-primary-hover); }

/* ============================================================
   复选框 .n-check:NCheckbox
   尺寸 16px(medium):checkbox/styles/_common.mjs sizeMedium
   圆角 2px:checkbox/styles/light.mjs borderRadius = borderRadiusSmall(_styles/common/_common.mjs)
   未选中:1px borderColor(暗 .24)、底 baseColor(暗透明);选中/悬停边 = primaryColor;勾 = baseColor(暗 cardColor):checkbox/styles/light|dark.mjs
   ============================================================ */
.n-check {
  position: relative; display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 16px; height: 16px; border-radius: 2px; cursor: pointer; vertical-align: middle;
  border: 1px solid var(--chk-border); background: var(--chk-bg); color: var(--chk-mark);
  transition: background-color .15s, border-color .15s;
}
.n-check::before { content: ""; position: absolute; inset: -6px; }  /* 扩大点击热区,不改视觉 */
.n-check:hover { border-color: var(--n-primary); }
.n-check.on, .n-check.half { background: var(--n-primary); border-color: var(--n-primary); }
.n-check svg { display: block; width: 100%; height: 100%; }
.n-check.half:empty::after { content: ""; width: 8px; height: 2px; border-radius: 1px; background: var(--chk-mark); }
/* DataTable 的表头 / 行勾选框带 privateInsideTable(data-table/src/TableParts/Header.mjs:195、BodyCheckbox.mjs:31):未选中底 = colorTableHeader(--chk-bg-table);表在弹窗里取 colorTableHeaderModal = modalColor */
table.n-table .n-check:not(.on):not(.half) { background: var(--chk-bg-table); }
.pick-root table.n-table .n-check:not(.on):not(.half) { background: var(--n-modal-bg); }

/* ============================================================
   表格(模式 2):复选列 / 操作列 / 横向滚动 / 密度
   数据表格内边距:normal = 12px、small = 8px,四边相等(data-table/styles/_common.mjs:3-8 thPadding* / tdPadding*)。
   行高 = 内边距 × 2 + 行内容 22.4px(14px × lineHeight 1.6)+ 下边框 1px = small 39.4 / medium 47.4。
   ============================================================ */
.tbl-scroll { overflow-x: auto; }
.tbl-scroll table.n-table { min-width: 760px; }   /* naive scroll-x 的等价物:中档出现横向滚动而不是压扁 */
table.n-table th.ck, table.n-table td.ck { width: 40px; min-width: 40px; padding-left: 0; padding-right: 0; text-align: center; }   /* 勾选列:padding 0 + 居中(data-table/src/styles/index.cssr.mjs:125-129、254-258) */
table.n-table tbody tr:not(.sum-row):hover > td { background: var(--n-row-hover); }   /* tdColorHover(data-table/styles/light.mjs:46);合计行(summary)不吃 hover(data-table/src/styles/index.cssr.mjs:107 cNotM("summary")) */
table.n-table td.acts { white-space: nowrap; }
table.n-table td.acts .n-btn.text { height: auto; padding: 0; line-height: inherit; }   /* 官方 NButton text 内边距 initial(0)(button/src/Button.mjs:344),按钮宽 = 文字宽 */
table.n-table td.acts .n-btn.text + .n-btn.text { margin-left: 12px; }   /* 间距 12 = 宿主 NSpace size 12(库对照页 编辑 / 删除 起点 +8 / +48) */
.smart-table[data-density="compact"] table.n-table th,
.smart-table[data-density="compact"] table.n-table td { padding: 8px; }   /* size="small":tdPaddingSmall / thPaddingSmall 8px(data-table/styles/_common.mjs:3,6) */
/* 窄档卡片固定用舒适间距、不响应密度(设计文档 5.3):触屏上紧凑只省 16px / 张、一屏多 0.2 张,收益可忽略,
   而间距要留给 44px 触控目标。密度只作用于表格。 */
.smart-table[data-density="compact"] table.n-table th.ck,
.smart-table[data-density="compact"] table.n-table td.ck { padding-left: 0; padding-right: 0; }

/* ============================================================
   窄档卡片列表(每行一张卡片)
   每张 = NCard size small + embedded:内边距 12px 16px(card/styles/_common.mjs paddingSmall)、
   底色 actionColor(card/styles/light.mjs colorEmbedded)、圆角 3px、无描边;
   标题 16px / 500(card/styles/_common.mjs titleFontSizeSmall、_styles/common/_common.mjs fontWeightStrong);
   标签:值 = NDescriptions size small,行距 8px(descriptions/styles/_common.mjs tdPaddingSmall = 0 0 8px 0),
   标签与值间距 14px 在两列窄卡里过挤,取 8px;标签用次要色 + 常规字重(macOS 取向,官方为 500),值用主色。
   卡片间距 8px。
   ============================================================ */
.tbl-cards { display: none; flex-direction: column; gap: 8px; }
.rc {
  background: var(--n-fill); border-radius: 3px; padding: 12px 16px;
  transition: background-color .15s;
}
.rc.sel { background: color-mix(in srgb, var(--n-primary) 8%, transparent); }
.rc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.rc-title { min-width: 0; flex: 1 1 auto; font-size: 16px; font-weight: 500; line-height: 1.6; color: var(--n-text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-head .n-check { width: 18px; height: 18px; margin-top: 3px; }   /* checkbox/styles/_common.mjs sizeLarge = 18px */
.rc-head .n-check::before { inset: -14px; }                         /* 热区 44×44(inset 相对内边距框,勾选框有 1px 边框:16 + 14×2 = 44;inset -13px 只有 42px):Apple 44pt / Material 48dp 推荐值;只加不可见热区,外观不变;卡片右上角内边距 16 / 上 15,44px 热区不伸出卡片外 */
.rc-desc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; margin: 8px 0 0; font-size: 13px; line-height: 1.6; }   /* 有意偏离官方 NDescriptions small(14px):13px = macOS 正文字号;卡片套卡片后每对标签:值只有约 137px,14px 时「单据日期 2026-09-21」需要 142px 会折行 */
.rc-desc > div { display: flex; flex-wrap: wrap; column-gap: 8px; min-width: 0; }
.rc-desc dt { margin: 0; flex: none; font-weight: 400; color: var(--n-text-2); }
.rc-desc dd { margin: 0; min-width: 0; color: var(--n-text); overflow-wrap: anywhere; }
.rc-act { display: flex; align-items: center; gap: 4px; margin-top: 8px; padding-top: 4px; border-top: 1px solid var(--n-border); }
.rc-act .n-btn.text { height: 44px; padding: 0 12px 0 0; font-size: 15px; }   /* 有意偏离(触控命中区):官方 text 按钮无盒(height / padding initial);这里 44px 高,与勾选框热区统一,Apple 44pt 推荐值 */
.rc-act .n-btn.text + .n-btn.text { padding: 0 0 0 12px; }   /* 「编辑」「删除」同为 44×44(左 / 右各留 12px 与邻居隔开) */

/* ============================================================
   窄档筛选抽屉:NDrawer placement=bottom
   遮罩 rgba(0,0,0,.3),淡入 0.2s:drawer/src/styles/index.cssr.mjs(drawer-mask)
   顶部圆角 = borderRadius 3px:drawer/src/styles/index.cssr.mjs(bottom-placement)、_styles/common/_common.mjs
   底色 modalColor、阴影 boxShadow3、标题 18px / 500:drawer/styles/light.mjs
   header / body / footer 内边距 16px 24px、header/footer 1px dividerColor 分隔线:drawer/styles/light.mjs
   滑入 translateY(100%)->0,0.3s cubic-bezier(0,0,.2,1)(ease-out):_styles/transitions/slide-in-from-bottom.mjs
   ============================================================ */
.mask { position: fixed; inset: 0; z-index: 2000; background: rgba(0, 0, 0, .3); }
#overlay:has(.sheet.enter) .mask { animation: mask-in .2s cubic-bezier(.4, 0, 1, 1);   /* drawer/src/styles/index.cssr.mjs:145-149 enter = --n-bezier-in */ }
@keyframes mask-in { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 2001;
  background: var(--n-modal-bg); color: var(--n-text); box-shadow: var(--sheet-shadow);
  border-radius: 3px 3px 0 0; overflow: visible; font-size: 15px; line-height: 1.6;
  padding-bottom: env(safe-area-inset-bottom);
  display: flex; flex-direction: column; max-height: 85vh;     /* 条件再多也不顶出视口:中间 .sheet-body 滚动 */
}
.sheet.enter { animation: sheet-in .3s cubic-bezier(0, 0, .2, 1); }
@keyframes sheet-in { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px 24px; line-height: 1; font-size: 18px; font-weight: 500; color: var(--n-text-1);   /* drawer/styles/light.mjs:29 titleTextColor = textColor1 */
  border-bottom: 1px solid var(--n-border);
}
.sheet-head, .sheet-foot { flex: none; }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-bottom: 8px; }
.sb { margin: 0 24px; padding: 16px 0 0; }
.sb + .sb { margin-top: 16px; border-top: 1px solid var(--n-border); }
.sb-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 14px; color: var(--n-text-2); }
.sb-head .logic { margin-left: auto; width: 88px; flex: none; position: relative; }
.sb-head > .n-btn.icon { margin-left: auto; }
.sb-head .logic + .n-btn.icon { margin-left: 0; }
.sb-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px 8px; }
.sb-row .f-val { grid-column: 1 / -1; }
.sheet-foot {

   ============================================================ */
.n-pagination {
  --pg-size: 28px;
  --pg-fs: 14px;
  --pg-ico: 16px;
  display: flex; flex-wrap: nowrap; align-items: center; justify-content: flex-end;
  gap: 0 8px; margin-top: 12px;
  font-size: var(--pg-fs); color: var(--n-text);
}
.n-pagination-prefix { display: flex; align-items: center; margin-right: 8px; }

/* 项:页码 / 省略号 / 上一页 / 下一页 */
.n-pagination-item {
  position: relative; display: flex; align-items: center; justify-content: center; flex: none;
  min-width: var(--pg-size); height: var(--pg-size); padding: 0 4px;
  border: 1px solid transparent; border-radius: 3px; background-color: transparent;
  color: var(--n-text); cursor: pointer; user-select: none; -webkit-user-select: none;
  transition: color .15s, border-color .15s, background-color .15s;
}
.n-pagination-item--button { padding: 0; border-color: var(--n-border-strong); }
.n-pagination-item .ico { display: inline-flex; width: 1em; height: 1em; line-height: 1em; }
.n-pagination-item .ico svg { display: block; width: 100%; height: 100%; }
.n-pagination-item--button .ico { font-size: var(--pg-ico); }

/* 悬停 / 当前页 / 禁用(顺序即优先级:禁用 > 当前页 > 按钮 > 悬停) */
.n-pagination-item:not(.n-pagination-item--disabled):hover { color: var(--n-primary-hover); }
.n-pagination-item--button:not(.n-pagination-item--disabled):hover { color: var(--n-text); }
.n-pagination-item--disabled { cursor: not-allowed; color: var(--n-text-3); }
.n-pagination-item--disabled.n-pagination-item--button { background-color: var(--n-input-bg-disabled); border-color: var(--n-input-border); }

/* size picker:NSelect small,宽度随内容 */
.n-pagination .pg-size { position: relative; display: flex; flex: none; }
.n-pagination .pg-size .n-select { width: auto; height: 28px; font-size: 14px; }
.n-pagination .pg-size .caret svg { display: block; width: 16px; height: 16px; }   /* 官方箭头 = ChevronDown 16px 图标、色 iconColor(= --n-text-3;_internal/icons/ChevronDown.mjs、_internal/suffix),不是 ▾ 字符 */
.n-pagination .dd.up { top: auto; bottom: calc(100% + 4px); }

/* quick jumper(默认不出现) */
.n-pagination-quick-jumper { display: flex; align-items: center; flex: none; white-space: nowrap; font-size: var(--pg-fs); color: var(--n-text); }
.n-pagination-quick-jumper .n-input { flex: none; width: 60px; height: var(--pg-size); margin-left: 8px; padding: 0 10px; font-size: var(--pg-fs); }

/* simple 简洁模式:页码输入框宽 60px(官方 pagination/styles/_common.mjs inputWidth*)、与上一页 / 下一页同高;「/ 总页数」是纯文字 */
.n-pagination.simple .n-pagination-quick-jumper .n-input { margin-left: 0; padding: 0 10px; }   /* NInput small:paddingSmall '0 10px'(input/styles/_common.mjs:4) */
/* 页码输入框文字左对齐 = 官方(input/src/styles/input.cssr.mjs:30 text-align: inherit,simple 分页没有居中规则) */
.pg-total { flex: none; font-size: var(--pg-fs); color: var(--n-text); white-space: nowrap; }
/* 官方 simple 结构(pagination/src/Pagination.mjs:516-527):输入框之后紧跟文字 " /" + " " + 总页数,与输入框之间没有间距;本原型 .n-pagination 用 gap 8px 排列,这里用 -8px 抵掉输入框与文字之间的那一格 */
.n-pagination.simple .pg-total { margin-left: -8px; }

/* 窄档 */
@container (max-width: 599px) {
  .n-pagination { --pg-size: 40px; --pg-fs: 15px; --pg-ico: 18px; flex-wrap: wrap; justify-content: center; row-gap: 8px; }
  .n-pagination-item { flex: 0 1 auto; width: var(--pg-size); min-width: 36px; padding: 0; }
  .n-pagination.simple { flex-wrap: nowrap; justify-content: flex-end; }   /* 窄档:单行,总条数靠左、翻页控件靠右 */
  .n-pagination.simple .n-pagination-prefix { margin-right: auto; font-size: var(--pg-fs); white-space: nowrap; }
}

/* ===== fill viewport + virtual scroll ===== */
/* ============================================================
   页面占满视口 + 表格纵向虚拟滚动
   本片段写在基底规则之后,同特异性靠顺序压过基底;基底里的规则一律不删。
   只用基底已有的 CSS 变量(--n-th-bg 等),明暗两套由 :root / html[data-theme="dark"] 的 token 决定;
   无新增 transition / animation / transform,无硬编码色值。

   目标行为
   1. 页面(document)不出现纵向滚动条:.app 高度 = 视口高度(100dvh,不支持时回退 100vh),不写死分辨率。
   2. 视口高度一路传到表格卡片:.app > .main > #stage > .viewport > #preview > .smart-table > .n-card 逐层 flex 列 + min-height:0。
      设计稿自己的 .crumb / .stage-head 是外壳,自然高度,计入(剩余高度 = 视口高 - 外壳)。
   3. 表格卡片内部自上而下:工具栏(或批量栏)· chips · 表格主体(flex:1,唯一滚动的地方)· 分页条(固定在卡片底部)。
      模块 1 有两张卡:搜索卡片自然高度,表格卡片吃剩余高度;搜索表单展开 / 收起时表格卡片自动伸缩。
   4. 表格主体 = 单一滚动容器(overflow:auto,同时承担横向滚动,表头与主体天然对齐);表头 th 用 position:sticky; top:0;
      行由 JS 按窗口渲染(可见行 + 上下缓冲),上下两个 spacer 撑出总高度。
      窄档(容器 < 600)= 卡片列表在卡片内部滚动,同样窗口化。

   官方对应(naive-ui 2.45.3 es/data-table/src):虚拟滚动需要 flex-height 或 max-height 才有滚动容器(MainTable.mjs:90、TableParts/Body.mjs:436、
   use-scroll.mjs:14);flex-height 的样式是「卡片撑满父容器、表格主体 flex-basis:0 + flex-grow:1」(styles/index.cssr.mjs:32-35);
   三者任一开启都强制 table-layout:fixed(DataTable.mjs:139-141)。

   依赖基底 token:--n-th-bg(表头底色,sticky 表头要不透明)· --n-border(表格线,沿用基底 border 声明,只改宽度)
   依赖基底类:.app .side .main .stage-head .viewport .smart-table .n-card .search-card .tb .tb-batch .chips .n-pagination
              .tbl-table .tbl-scroll table.n-table th.ck td.ck td.acts .tbl-cards .rc .rc-desc
   JS 侧约定:.tbl-scroll[data-vs="table"] / .tbl-cards[data-vs="cards"] 是滚动容器;tbody 首尾各一个 .vs-pad 行(卡片列表是首尾两个 div.vs-pad),
              高度由 JS 写内联 style;行高常量 VS_ROW = { normal: 47.4, compact: 39.4 } 与下面的 --vs-row-h 一致(JS 渲染后还会实测校正)。
   ============================================================ */

/* ---------- 1. 页面壳:占满视口,document 不滚动 ---------- */
html, body { overflow: hidden; }
.app { height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; }
.main {
  display: flex; flex-direction: column; min-height: 0;
  overflow-y: auto;                        /* 仅当视口小到放不下最小表格区(--vs-min-h)、或待议模块的长文档时,在主区内部滚动;document 永不滚动 */
}
.main > * { flex: none; }
#stage { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
#stage > * { flex: none; }
#stage > .viewport { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }   /* 视口 padding 就是表格卡片到视口底边的留白(桌面 22px,窄屏壳 12px) */
#preview { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
.smart-table { flex: 1 1 0; min-height: 0; }                                              /* 基底已是 flex 列 + gap 16px */
.smart-table > .search-card { flex: none; }                                                /* 模块 1:搜索卡片自然高度 */
.smart-table > .n-card:not(.search-card) {                                                  /* 放表格的那张卡片:吃剩余高度 */
  flex: 1 1 0; min-height: 0; display: flex; flex-direction: column;
}
.smart-table > .n-card:not(.search-card) > * { flex: none; }                               /* 工具栏 / 批量栏 / chips / 分页条:自然高度 */

@media (min-width: 861px) {
  .app { grid-template-rows: minmax(0, 1fr); }
  .side { height: 100%; }                                                                   /* 基底是 100vh;跟随 .app 的 100dvh */
  .main { padding-bottom: 26px; }                                                           /* 与顶部内边距对称;基底的 64px 是给整页滚动留的 */
}
@media (max-width: 860px) {
  .app { grid-template-rows: auto minmax(0, 1fr); }                                         /* 顶部模块条自然高度,其余给 .main */
}

/* ---------- 2. 表格主体:唯一滚动的地方 ---------- */
.smart-table {
  --vs-row-h: 47.4px;      /* 行高 = 官方 medium:td 上下内边距 12 + 12 + 行高 --vs-line 22.4(14px × lineHeight 1.6,data-table/src/styles/index.cssr.mjs:280)+ 下边框 1;JS 常量 VS_ROW.normal */
  --vs-line: 22.4px;       /* 行内文字行高 = fontSize 14 × lineHeight 1.6(_styles/common/_common.mjs lineHeight);盖住 22px 高的状态徽标 */
  --vs-card-gap: 8px;      /* 窄档卡片间距(基底 .tbl-cards 的 gap 8px) */
  --vs-min-h: 160px;       /* 表格区最小高度:表头 + 约 3 行;视口再矮就让 .main 出滚动条,而不是把表格压没 */
}
.smart-table[data-density="compact"] {
  --vs-row-h: 39.4px;      /* 官方 small:8 + 8 + 22.4 + 1 = 39.4;JS 常量 VS_ROW.compact(卡片不响应密度,没有 --vs-card-gap 的紧凑值) */
}

/* .tbl-table 的占位规则改在 .dt 里(见文件末尾) */
/* 滚动容器绝对定位铺满 .tbl-table:高度不依赖内容,行数再少表格区也撑满、分页条始终贴卡片底部 */
.tbl-scroll {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0;
  overflow: auto; overscroll-behavior: contain; overflow-anchor: none;                       /* 窗口换行时不让浏览器的滚动锚定去动 scrollTop */
}

/* 固定布局 + <colgroup>(JS 输出):窗口换行时列宽不抖;容器不够宽时靠内联 min-width 走横向滚动,不压扁列。
   border-collapse:separate + 单元格只画右 / 下边框(首列补左边、表头补上边):视觉与 collapse 模型一致,
   但 collapse 下 sticky 表头的边框会跟着滚走,分开模型下边框属于单元格本身,sticky 时一起固定。
   有意偏离:外框是直角。官方 bordered 的 data-table-wrapper 底角 3px、表头顶角 2px(data-table/src/styles/index.cssr.mjs:296-300、311-313);外框由单元格边框拼成,裁出圆角会把弧线切成直角,
   要画弧线须把外框移到 .tbl-scroll 并重做 sticky 表头 / 固定列 / 横向滚动的边框,收益只有 3px 圆角 */
.tbl-scroll table.n-table { table-layout: fixed; width: 100%; border-collapse: separate; border-spacing: 0; }
.tbl-scroll table.n-table th,
.tbl-scroll table.n-table td {
  border-width: 0 1px 1px 0; height: var(--vs-row-h); line-height: var(--vs-line);
  vertical-align: middle; overflow: hidden; text-overflow: ellipsis;
}
.tbl-scroll table.n-table th:first-child,
.tbl-scroll table.n-table td:first-child { border-left-width: 1px; }
.tbl-scroll table.n-table thead th {
  border-top-width: 1px; position: sticky; top: 0; z-index: 2;                               /* 底色沿用基底 th 的 --n-th-bg(不透明),行从底下滚过不会透出 */
}

/* 已排序列整列底色:官方 td 的 --sorting 修饰符(data-table/src/styles/index.cssr.mjs:244-245),取 tdColorSorting(data-table/styles/light.mjs:47 = composite(cardColor, tableColorHover),
   与 tdColorHover 同值 → 复用 --n-row-hover);表头对应 thColorSorting(:51,= --n-th-hover,上方 th.sorting 已画)。明暗两套由 token 决定。 */
.tbl-scroll table.n-table td.sorting { background: var(--n-row-hover); }

/* 行高确定性:单元格里两种比 22px 行高更高的行内块(状态徽标 22px、带 1px 透明边的文字按钮 24px)会把行盒撑到 23~26px,
   这里把它们压到 --vs-line 并顶对齐,行高只由 padding + --vs-line + 下边框决定(与字体回退无关) */
.tbl-scroll table.n-table td .pill { vertical-align: top; }
.tbl-scroll table.n-table td.acts .n-btn.text { height: var(--vs-line); vertical-align: top; }

/* spacer 行:只占高度(高度由 JS 写在 tr 的内联 style 上),不画线、不响应悬停 */
.tbl-scroll table.n-table tr.vs-pad { pointer-events: none; }
.tbl-scroll table.n-table tr.vs-pad td { height: 0; padding: 0; border-width: 0; line-height: 0; }

/* ---------- 3. 窄档:卡片列表在卡片内部滚动 ---------- */
@container (max-width: 599px) {
  .smart-table > .n-card:not(.search-card) > .dt > .tbl-cards {
    display: block; flex: 1 1 0; min-height: var(--vs-min-h);                                /* 基底这里是 flex 列 + gap;窗口化用 spacer,改成块级 + 卡片下外边距(等价于 gap) */
    overflow-y: auto; overscroll-behavior: contain; overflow-anchor: none;
  }
  .tbl-cards .rc { margin: 0 0 var(--vs-card-gap); }
  .tbl-cards .vs-pad { margin: 0; }
  /* 虚拟滚动要求每张卡片等高(spacer = 张数 × 间距):字段值单行显示、过长省略,不折行 */
  .tbl-cards .rc-desc > div { flex-wrap: nowrap; }
  .tbl-cards .rc-desc dd { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 值是标签(.pill = 库里的 NTag)时标签让位:英文标签长(「Document Status」约 100px),dt 是 flex: none,每对只有约 137px,
     值只剩 29px,dd 的 overflow 会把 70px 的 Approved 标签裁成「App」。标签是整块、没法像文字那样省略,所以这一对里改成
     dt 收缩 + 省略、dd 不收缩(只用 max-width 封顶,不撑破卡片)。文字值不受影响。 */
  .tbl-cards .rc-desc > div:has(dd .pill) dt { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tbl-cards .rc-desc > div:has(dd .pill) dd { flex-shrink: 0; max-width: 100%; }
}

/* ============================================================
   模块 3 / 4 · 表头排序 + 列头过滤(官方承载)
   官方依据(naive-ui 2.45.3 es/data-table):
   - 表头结构 Header.mjs:222-225:标题 + 排序箭头在 title-wrapper 里(title flex:1,箭头落在右端),漏斗 FilterButton 是 th 右缘的独立热区。
   - styles/index.cssr.mjs:121-123:th--filterable padding-right 36px;--sortable 叠加 th-padding(12px)+ 36px。
   - :155-170 排序箭头 = 单个 ArrowDown 图标(15px,margin-left 4px):desc 0°、asc 旋转 -180°、未激活 thIconColor、asc/desc 用 thIconColorActive;
     :196-215 漏斗 = 绝对定位 right:0 宽 36px 整列高、居中、15px,hover / 面板打开底 thButtonColorHover。
   - 筛选菜单 FilterMenu.mjs + cssr:332-352:选项组 padding 12px 12px 0、复选框间距 12px、最高 240px 可滚动;
     底部 action padding 8px 12px、上边 1px 分隔线,「重置」(默认)+「确认」(primary),均为 size="tiny"(高 22px、字 12px、内边距 0 6px)。
   有意偏离官方:
   - 图标悬停表头才显示(官方常驻):透明度过渡 .15s;已排序 / 已筛选 / 面板打开的列常驻,否则看不出哪列在起作用。
   - 排序箭头旋转取 .2s(官方 .3s),对齐本库「动效 ≤ .2s」的约束。
   ============================================================ */
table.n-table th.h-th { user-select: none; transition: background-color .15s; }
.tbl-scroll table.n-table th.h-th { padding-right: 16px; }                                   /* 右缘留给列宽拖拽把手(8px)+ 8px 缓冲,图标簇不会贴到把手上 */
.tbl-scroll table.n-table th.h-th.sortable { cursor: pointer; }                              /* 图标簇拥在标题后面,右缘不预留官方的 36px 热区 */
.tbl-scroll table.n-table th.h-th.sortable:hover,
.tbl-scroll table.n-table th.h-th.sorting,
.tbl-scroll table.n-table th.h-th.f-open { background: var(--n-th-hover); }
.th-wrap { display: flex; align-items: center; flex-wrap: nowrap; max-width: 100%; }
.th-title { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }   /* 官方是 flex:1(箭头被推到最右);这里不撑开,漏斗与箭头紧跟标题 */
.th-sorter {
  flex: none; width: 15px; height: 15px; margin-left: 4px; display: inline-flex; align-items: center; justify-content: center;
  color: var(--n-text-3);                                                                    /* thIconColor = iconColor */
  transition: opacity .15s, color .15s;
}
.th-sorter svg { width: 100%; height: 100%; fill: currentColor; transition: transform .2s; transform: rotate(0deg); }
.th-sorter.asc svg { transform: rotate(-180deg); }
.th-sorter.on { color: var(--n-primary); }                                                   /* thIconColorActive = primaryColor */
.th-filter {
  position: relative; flex: none; width: 22px; height: 22px; margin-left: 8px; padding: 0; border: 0; border-radius: 3px; background: transparent;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px;
  color: var(--n-text-3); transition: opacity .15s, color .15s, background-color .15s;
}
.th-filter + .th-sorter { margin-left: 6px; }                                               /* 顺序:标题 → 漏斗 → 排序箭头;间距:标题-漏斗 8px、漏斗-箭头 6px(漏斗按钮 22px 内图标 15px,两侧各再 3.5px,视觉间距约 11.5 / 9.5px) */
.th-filter svg { width: 1em; height: 1em; fill: currentColor; }
.th-filter:hover, .th-filter.show { background: var(--n-th-btn-hover); }
.th-filter.on { color: var(--n-primary); }
.hf-n {
  position: absolute; top: -3px; right: -5px; min-width: 12px; height: 12px; padding: 0 3px; border-radius: 6px;
  font-size: 10px; line-height: 12px; font-weight: 500; font-style: normal; text-align: center; background: var(--n-primary); color: var(--n-on-primary); pointer-events: none;
}
/* 悬停才显示:未激活的箭头 / 漏斗平时透明(仍占位,不引起回流);悬停表头、键盘聚焦到表头内、面板打开时显现 */
.h-th .th-sorter:not(.on), .h-th .th-filter:not(.on):not(.show) { opacity: 0; }
.h-th:hover .th-sorter,
.h-th:hover .th-filter:not(.on):not(.show),
.h-th:focus-within .th-filter:not(.on):not(.show),
.h-th .th-filter:focus-visible:not(.on):not(.show) { opacity: 1; }   /* 选择器带 :not() 是为了优先级不低于上面的隐藏规则 */
/* 触屏(没有悬停,如平板):未激活的箭头 / 漏斗改为淡显常驻,否则永远点不到(见 3.9) */
@media (hover: none) {
  .h-th .th-sorter:not(.on), .h-th .th-filter:not(.on):not(.show) { opacity: .5; }
}

/* 列头过滤面板:官方 NPopover(popoverColor + boxShadow2 + 圆角 3px,padding 0),经 overlay 定位到漏斗下方 */
.hpop {
  position: fixed; z-index: 2002; top: 0; left: 0; width: min(400px, calc(100vw - 16px));
  background: var(--n-popover-bg); color: var(--n-text); border-radius: 3px; box-shadow: var(--n-shadow-pop);
  font-size: 14px; line-height: 1.6;
}
.hpop.opt { width: auto; min-width: 168px; max-width: min(400px, calc(100vw - 16px)); }       /* 官方勾选菜单宽度由内容决定 */
.hp-body { padding: 12px 12px 0; }
.hp-group { display: flex; flex-direction: column; max-height: 240px; overflow-y: auto; }    /* cssr:332-337 */
.hp-opt { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; cursor: pointer; white-space: nowrap; }
.hp-row { display: grid; align-items: center; gap: 8px; margin-bottom: 12px; grid-template-columns: 56px 112px minmax(0, 1fr) 28px; }
.hp-row .f-op, .hp-row .f-val, .hp-row .logic { position: relative; min-width: 0; }
.hp-lead { font-size: 12px; color: var(--n-text-2); text-align: center; min-width: 0; }
.hp-row .n-input, .hp-row .n-select { width: 100%; }
.hp-tools { display: flex; align-items: center; margin: -4px 0 8px; }
/* 面板里的「添加条件 / 高级条件 ▾ / 收起高级条件 ▴」= 淡灰 secondary + small 档(28px、0 10px、14px,与同面板的值控件同高;设计 2.15 D) */
.hp-hint { font-size: 12px; color: var(--n-text-2); margin-left: 8px; }
.hp-foot { display: flex; flex-wrap: nowrap; justify-content: space-evenly; padding: 8px 12px; border-top: 1px solid var(--n-border); }   /* actionPadding 8px 12px;actionDividerColor = dividerColor */

.hp-foot .n-btn:last-child { margin-right: 0; }
.n-btn.tiny { height: 22px; padding: 0 6px; font-size: 12px; }                                /* NButton size=tiny:button/styles/_common.mjs heightTiny / paddingTiny / fontSizeTiny */
.chip.click { cursor: pointer; }
.chip.click:hover { background: color-mix(in srgb, var(--n-primary) calc(var(--tag-a) + 4%), transparent); }

/* 列宽拖拽把手:官方 data-table-resize-button(容器 8px、线宽 2px;官方线高 50% 且静止时画表格线色,悬停 / 拖动时 thIconColorActive)。
   有意偏离:静止时不画线(暗色下每个列界都冒出一截灰条),悬停才显示主色条,高度取 70%(比官方的 50% 更醒目)。
   位置:居中骑在列界(表格竖线)上 —— 热区 11px 宽、以 th 内边距右缘为中心向两侧各出 5~6px(th 边线 1px 正好落在正中),竖条 3px 宽、高度 = 表头整行,压在线上。
   为了让它能伸到相邻列里,表头 th 改 overflow:visible(标题的省略号由 .th-title / .th-txt 自己负责),并给各列 th 依次递减的 z-index
   (靠前的列更高),否则伸进下一列的那一半会被下一列的背景盖住、也点不到。
   拖动时额外拉一条贯穿整张表的 1px 引导线(.rz-guide),提前看到列边会落在哪;松手即消失。 */
.tbl-scroll table.n-table thead th { overflow: visible; }
.th-txt { display: block; overflow: hidden; text-overflow: ellipsis; }
.th-resize { position: absolute; top: 0; bottom: 0; right: -6px; width: 11px; z-index: 3; cursor: col-resize; user-select: none; touch-action: none; }
.th-resize::after {
  content: ""; position: absolute; top: -1px; bottom: -1px; left: 4px; width: 3px; border-radius: 0;   /* 高度 = 表头整行(与行高一致):th 上 / 下各有 1px 边框,定位基准是内边距框,所以各外扩 1px 才与整行严格等高 */
  background: transparent; transition: background-color .15s, box-shadow .15s;   /* 静止时不画(官方静止时画一条表格线色的细线,暗色下会在每个列界上冒出一截灰条,所以悬停才显示) */
}
.th-resize:hover::after, .th-resize.active::after { background: var(--n-primary); }   /* 悬停 / 拖动:主色圆角竖条 + col-resize 光标 */
.th-resize.active::after { box-shadow: 0 0 0 3px color-mix(in srgb, var(--n-primary) 18%, transparent); }   /* 拖动中:再加一圈柔和光晕 */
@media (hover: none) { .th-resize { right: -12px; width: 24px; } .th-resize::after { left: 10px; } }   /* 触屏:热区加宽到 24px(手指够得着),竖条仍居中压在线上 */
.rz-guide { position: absolute; top: 0; width: 1px; z-index: 1; pointer-events: none; background: color-mix(in srgb, var(--n-primary) 55%, transparent); }
body.rz-ing, body.rz-ing * { cursor: col-resize !important; user-select: none !important; }

/* 窄档:筛选 / 排序入口 + 抽屉内的排序分段 / 选项 */
.hdr-tb .tb-search:not(.tb-csearch) .pop-wrap { flex: 1 1 0; }
.hdr-tb .tb-search:not(.tb-csearch) .n-btn { width: 100%; justify-content: center; }

  color: var(--n-text); font: inherit; font-size: 15px; cursor: pointer; transition: background-color .15s, border-color .15s, color .15s;
}
.seg button:first-child { margin-left: 0; border-radius: 3px 0 0 3px; }
.seg button:last-child { border-radius: 0 3px 3px 0; }
.seg button:hover { color: var(--n-primary-hover); }
.seg button.on { position: relative; z-index: 1; color: var(--n-primary); border-color: var(--n-primary); }   /* NRadioButton 选中(亮色):字与边 primary、底 baseColor(radio/styles/light.mjs:50、52) */
html[data-theme="dark"] .seg button:hover { border-color: var(--n-primary); }   /* 暗色 hover 边 = primaryColor(radio/styles/dark.mjs:51;亮色是 borderColor,light.mjs:48) */
html[data-theme="dark"] .seg button.on { background: var(--n-primary); color: var(--n-on-primary); }   /* 暗色选中 = 实心 primary 底 + baseColor(#000)字(radio/styles/dark.mjs:53、55 buttonColorActive / buttonTextColorActive) */
.sd-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 24px; padding: 12px 0; }
.sd-row + .sd-row { border-top: 1px solid var(--n-border); }
.sd-row .lab { font-size: 15px; color: var(--n-text-1); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet .hp-body { padding: 16px 24px 0; }
.sheet .hp-opt { height: 40px; margin-bottom: 0; font-size: 15px; }
.sheet .hp-group { max-height: none; }
.sheet .hp-row { grid-template-columns: minmax(0, 1fr) auto; gap: 12px 8px; margin-bottom: 16px; }
.sheet .hp-row .hp-lead { grid-column: 1; grid-row: 1; text-align: left; font-size: 14px; }
