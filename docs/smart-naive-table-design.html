.sheet .hp-row .f-val { grid-column: 1 / -1; grid-row: 3; }
.sheet .hp-row > .n-btn.icon, .sheet .hp-row > .hp-del-ph { grid-column: 2; grid-row: 1; }
.hp-del-ph { width: 28px; }
.sheet .hp-tools .n-btn.sec { font-size: 15px; height: 40px; padding: 0 18px; }   /* 窄档抽屉里的控件统一 40px = large 档:内边距 0 18px、图标 20(iconSizeLarge) */
.sheet .hp-head-pick { padding: 16px 24px 0; }
.sheet .hp-head-pick .f-field { position: static; }
.sheet .hp-head-pick .n-select { width: 100%; }
.sheet .hp-foot { display: none; }

/* ============================================================
   放大(页面内最大化,设计文档 7)
   表格组件 position:fixed 铺满视口,盖住宿主的侧栏 / 顶栏 / 标签页;不调用浏览器全屏 API(浏览器自己的地址栏、书签栏仍在)。
   层级:放大层 z-index 1999,**刻意低于 2000**——naive 的 Popover / Drawer / Modal / Select 菜单等动态浮层从 2000 起递增
   (vdirs zindexable/z-index-manager.js:nextZIndex = 2000),放大后表格自己弹出的筛选气泡、抽屉、提示才会显示在它上面。
   背景取页面底色 --n-body-bg(与宿主页面的 NLayout embedded 灰底一致)。库用 Teleport 到 body,避免宿主祖先的 transform / filter
   把 fixed 的包含块变成那个祖先(原型没有这类祖先,直接 fixed)。
   ============================================================ */
.smart-table[data-max] {
  position: fixed; inset: 0; z-index: 1999; box-sizing: border-box; padding: 16px;
  background: var(--n-body-bg);
}


/* ============================================================
   对齐真实库的控件与状态
   —— 以下全部是官方 naive-ui 2.45.3 组件的静态复刻,数值取自 node_modules/naive-ui/es(逐项标了出处);
      明暗两套走 :root / html[data-theme="dark"] 的 token。
   ============================================================ */

/* ---------- 表体外层 .dt = 官方 .n-data-table 根:loading / 空状态 / 固定列 ---------- */
.smart-table > .n-card:not(.search-card) > .dt { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
.dt > * { flex: none; }
.dt > .tbl-table { flex: 1 1 0; min-height: var(--vs-min-h); position: relative; }
/* loading:表体 opacity = opacityLoading(= opacityDisabled:亮 .5 / 暗 .38,data-table/styles/light.mjs:79)且禁点;spinner 居中于整个 data-table(含分页),28px(loadingSize = heightSmall)、主色 */
.dt.loading > .tbl-table, .dt.loading > .tbl-cards { opacity: var(--n-op-disabled); pointer-events: none; }
.dt-loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; width: 28px; height: 28px; font-size: 28px; line-height: 0; color: var(--n-primary); pointer-events: none; }
.n-base-loading { position: relative; width: 1em; height: 1em; line-height: 0; }
.n-base-loading svg { display: block; width: 1em; height: 1em; animation: n-rotator 3s linear infinite both; }   /* _internal/loading/src/styles/index.cssr.mjs:30-31(animation: rotator)、:4-12(keyframes) */
@keyframes n-rotator { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
/* 空状态:官方 data-table-empty = padding 48px 0、撑满表体、水平 / 垂直居中(data-table/src/styles/index.cssr.mjs:258-269)。表头仍在上方 */
.dt-empty { position: absolute; left: 0; right: 0; bottom: 0; top: var(--vs-row-h); display: flex; align-items: center; justify-content: center; padding: 48px 0; box-sizing: border-box; pointer-events: none; }
.tbl-cards .dt-empty { position: static; height: 100%; min-height: 160px; }
.n-empty { display: flex; flex-direction: column; align-items: center; font-size: 14px; }   /* empty/src/styles/index.cssr.mjs:3-8 */
.n-empty__icon { width: 40px; height: 40px; font-size: 40px; line-height: 40px; color: var(--n-text-3); }   /* iconSizeMedium 40px(empty/styles/_common.mjs:5)、iconColor */
.n-empty__icon svg { display: block; width: 1em; height: 1em; }
.n-empty__desc { margin-top: 8px; color: var(--n-text-3); }   /* textColor = textColorDisabled(empty/styles/light.mjs:22) */

/* 固定列:position: sticky + 偏移走 CSS 变量(表格根 inline 写、fixMeasure 实测校正);边缘阴影 = 官方 36px 伪元素 + boxShadowAfter / Before,横向滚动后才出现
   (data-table/src/styles/index.cssr.mjs:375-405、TableParts/Body.mjs:271-285)。单元格底色必须不透明,否则滚动内容会透出来 */
table.n-table td { background: var(--n-card-bg); }
.tbl-scroll table.n-table th.fx, .tbl-scroll table.n-table td.fx { position: sticky; }
.tbl-scroll table.n-table td.fx { z-index: 1; }
.tbl-scroll table.n-table .fx-edge { overflow: clip; overflow-clip-margin: 36px; }   /* 阴影伪元素伸到单元格外,单元格本身又要 ellipsis,所以用 clip + 裁剪外延 */
.tbl-scroll table.n-table .fx-edge::after { content: ""; position: absolute; top: 0; bottom: -1px; width: 36px; pointer-events: none; transition: box-shadow .2s; }
.tbl-scroll table.n-table .fx-l.fx-edge::after { right: -36px; }
.tbl-scroll table.n-table .fx-r.fx-edge::after { left: -36px; }
.tbl-scroll.sh-l table.n-table .fx-l.fx-edge::after { box-shadow: var(--n-fix-shadow-l); }
.tbl-scroll.sh-r table.n-table .fx-r.fx-edge::after { box-shadow: var(--n-fix-shadow-r); }
table.n-table td.idx { color: var(--n-text); font-variant-numeric: tabular-nums; }

/* ---------- 状态标签:NTag small bordered,语义色 success / warning / default(tag/styles/light.mjs:70-133、dark.mjs:117-149) ---------- */
.pill.warn {
  background: color-mix(in srgb, var(--n-warning) var(--n-warn-bg-a), transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--n-warning) var(--n-warn-bd-a), transparent);
  color: var(--n-warning);
}

/* ---------- 输入类控件(NInputNumber / NDatePicker)—— 外观与 NInput 同一套,右侧多一个图标 ---------- */
.n-input .ico-r { flex: none; display: inline-flex; margin-left: 4px; color: var(--n-text-3); font-size: 16px; line-height: 0; }   /* NInput suffix 图标:iconColor、16px(medium)*/
.n-input.sm .ico-r { font-size: 14px; }
.n-input .ico-r svg { width: 1em; height: 1em; display: block; fill: currentColor; }
.n-input.dp { cursor: pointer; }
.n-input.dp input { cursor: pointer; flex: 1 1 auto; }
.n-input.dp .ico-r .ico-clear { display: none; cursor: pointer; }
.n-input.dp:hover .has-v .ico-date { display: none; }
.n-input.dp:hover .has-v .ico-clear { display: block; }
.n-input.dp .ico-clear:hover { color: var(--n-clear-hover); }
/* daterange:NInput pair —— [开始][→][结束][日历],输入框文字居中(input/src/styles/input.cssr.mjs:127) */
.n-input.pair input { text-align: center; flex: 1 1 0; min-width: 0; }
.n-input.pair .sep { flex: none; display: inline-flex; color: var(--n-text-3); font-size: 14px; line-height: 0; padding: 0 12px; }   /* 官方:起 / 止两个 wrapper 各自左右 padding 12,分隔符本体 14px(input/src/styles/input.cssr.mjs:69-75) */
.n-input.pair .sep svg { width: 1em; height: 1em; fill: currentColor; }

/* ---------- 日期面板:官方 date-panel(date-picker/src/styles/index.cssr.mjs、styles/_common.mjs) ---------- */
.dp-pop { position: fixed; z-index: 2004; left: 0; top: 0; }
.dp-panel {
  display: grid; width: fit-content; border-radius: 3px; background: var(--n-popover-bg); color: var(--n-text);
  box-shadow: var(--n-shadow-pop); user-select: none; -webkit-user-select: none; outline: none; position: relative; font-size: 14px;
}
.dp-panel.range { grid-template-columns: auto 1px auto; grid-template-areas: "l div r" "act act act"; }
.dp-panel.single { grid-template-columns: auto; grid-template-areas: "l" "act"; }
.dp-cal { padding: 6px 12px 4px; display: grid; grid-template-columns: 1fr; position: relative; }   /* calendarLeftPaddingDate "6px 12px 4px 12px" */
.dp-cal.l { grid-area: l; } .dp-cal.r { grid-area: r; }
.dp-vdiv { grid-area: div; width: 1px; background: var(--n-border); }   /* calendarDividerColor = dividerColor */
.dp-month { display: grid; grid-template-columns: 28px 28px 1fr 28px 28px; align-items: center; justify-items: center; height: 28px; }
.dp-month .arr { display: flex; align-items: center; justify-content: center; line-height: 0; cursor: pointer; width: 14px; height: 14px; color: var(--n-text-3); }   /* arrowSize 14px、arrowColor = iconColor */
.dp-month .arr svg { width: 14px; height: 14px; display: block; }
.dp-month .arr:hover { color: var(--n-text-2); }
.dp-month .txt { font-size: 14px; line-height: 14px; font-weight: 500; padding: 6px 8px; text-align: center; color: var(--n-text-1); cursor: pointer; border-radius: 3px; transition: background-color .3s; white-space: nowrap; }
.dp-month .txt:hover, .dp-month .txt.active { background: var(--n-item-hover); }
.dp-wk { display: grid; margin: auto; grid-template-columns: repeat(7, 38px); grid-template-rows: 32px; align-items: center; justify-items: center; margin-bottom: 4px; border-bottom: 1px solid var(--n-border); }   /* itemCellWidth 38 / itemCellHeight 32 */
.dp-wk div { width: 24px; text-align: center; font-size: 14px; line-height: 15px; color: var(--n-text); }
.dp-dates { margin: auto; display: grid; grid-template-columns: repeat(7, 38px); grid-template-rows: repeat(6, 32px); align-items: center; justify-items: center; }
.dp-d { position: relative; width: 24px; height: 24px; line-height: 24px; text-align: center; font-size: 14px; border-radius: 2px; z-index: 0; cursor: pointer; transition: background-color .2s, color .2s; }   /* itemSize 24px;圆角 itemBorderRadius = borderRadiusSmall 2px(date-picker/styles/light.mjs:42;date-picker/src/styles/index.cssr.mjs:214) */
.dp-d::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; transition: background-color .3s; }
.dp-d:hover:not(.sel)::after { background: var(--n-item-hover); }
.dp-d.out { color: var(--n-text-3); }
.dp-d.cur .sup { position: absolute; top: 2px; right: 2px; height: 4px; width: 4px; border-radius: 2px; background: var(--n-primary); }
.dp-d.sel { color: var(--n-popover-bg); }
.dp-d.sel::after { background: var(--n-primary); }
.dp-d.sel .sup { background: var(--n-popover-bg); }
.dp-d.cov:not(.out)::before, .dp-d.st:not(.out)::before, .dp-d.en:not(.out)::before {
  content: ""; position: absolute; z-index: -2; left: -7px; right: -7px; top: 0; bottom: 0;
  background: color-mix(in srgb, var(--n-primary) var(--dp-incl-a), transparent);   /* itemColorIncluded = primary alpha .1(暗色 .15):date-picker/styles/light.mjs:36-38、dark.mjs:26-28 */
}
.dp-d.st:not(.out)::before { left: 50%; }
.dp-d.en:not(.out)::before { right: 50%; }
.dp-d:nth-child(7n + 1).cov:not(.out)::before, .dp-d:nth-child(7n + 1).st:not(.out)::before, .dp-d:nth-child(7n + 1).en:not(.out)::before { border-top-left-radius: 2px; border-bottom-left-radius: 2px; }
.dp-d:nth-child(7n + 7).cov:not(.out)::before, .dp-d:nth-child(7n + 7).st:not(.out)::before, .dp-d:nth-child(7n + 7).en:not(.out)::before { border-top-right-radius: 2px; border-bottom-right-radius: 2px; }   /* 范围条两端圆角同 itemBorderRadius 2px(date-picker/src/styles/index.cssr.mjs:256-260) */
.dp-act { grid-area: act; padding: 8px 12px; display: flex; align-items: center; justify-content: flex-end; border-top: 1px solid var(--n-border); gap: 8px; }   /* panelActionPadding "8px 12px"、actionDividerColor */
.dp-act .n-btn.tiny[disabled] { opacity: var(--n-op-disabled); cursor: not-allowed; }
/* 点月年标题弹出的快速跳转:两列滚动选择(年 / 月),每项 40px、高 6 项 = 240px(scrollItemWidth 80 / scrollItemHeight 40) */
.dp-jump { position: absolute; z-index: 5; top: 37px; display: flex; background: var(--n-popover-bg); border-radius: 3px; box-shadow: var(--n-shadow-pop); height: 240px; }
.dp-jcol { min-width: 80px; height: 240px; overflow-y: auto; scrollbar-width: none; }
.dp-jcol::-webkit-scrollbar { display: none; }
.dp-jcol:first-child { min-width: 84px; }
.dp-jcol .pad { height: 200px; }
.dp-ji { position: relative; z-index: 0; cursor: pointer; height: 40px; padding-top: 4px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: var(--n-text); }
.dp-ji::before { content: ""; position: absolute; z-index: -1; left: 0; right: 4px; top: 4px; bottom: 0; border-radius: 3px; transition: background-color .3s; }
.dp-jcol:first-child .dp-ji::before { left: 4px; }
.dp-ji:hover::before { background: var(--n-item-hover); }
.dp-ji.on { color: var(--n-primary); }
.dp-ji.on::before { background: var(--n-item-hover); }

/* ---------- NSwitch(medium):轨道 22×40、滑块 18×18(switch/styles/_common.mjs、light|dark.mjs);圆角:round 默认 true,轨道 11px / 滑块 9px(switch/src/Switch.mjs:35-38、switch/src/styles/index.cssr.mjs:59) ---------- */
.n-switch { position: relative; display: inline-flex; align-items: center; height: 22px; min-width: 40px; border-radius: 11px; cursor: pointer; vertical-align: middle; background: var(--sw-off); transition: background-color .3s, box-shadow .3s; border: 0; padding: 0; outline: none; }
.n-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 9px; background: #fff; box-shadow: var(--sw-knob); transition: left .3s, box-shadow .3s; }
.n-switch.on { background: var(--sw-on); }
.n-switch.on::after { left: calc(100% - 18px - 2px); }
.n-switch:focus-visible { box-shadow: 0 0 0 2px color-mix(in srgb, var(--n-primary) 20%, transparent); }   /* 亮色 boxShadowFocus(switch/styles/light.mjs:29-31) */
html[data-theme="dark"] .n-switch:focus-visible { box-shadow: 0 0 8px 0 color-mix(in srgb, var(--n-primary) 30%, transparent); }   /* 暗色 boxShadowFocus(switch/styles/dark.mjs:34-36) */
:root { --sw-off: rgba(0, 0, 0, .14); --sw-on: #18a058; --sw-knob: 0 1px 4px 0 rgba(0, 0, 0, 0.3), inset 0 0 1px 0 rgba(0, 0, 0, 0.05); }   /* switch/styles/light.mjs:12、19-21(rail .14 / railColorActive / buttonBoxShadow) */
html[data-theme="dark"] { --sw-off: rgba(255, 255, 255, .2); --sw-on: rgb(42, 148, 125); --sw-knob: 0px 2px 4px 0 rgba(0, 0, 0, 0.4); }   /* switch/styles/dark.mjs:16-27(active = primaryColorSuppl) */

/* ---------- NSelect multiple filterable tag:标签 = NTag,size 随选择框(Selection.mjs:562 原样传入):高 small 22 / medium 28 / large 34(tag/styles/light.mjs:41-43),默认 bordered、非 round,内边距 0 7、圆角 2;可输入回车新增(tag)----------
   关闭钮 / 图标:small 16 / 12,medium、large 18 / 14(tag/styles/_common.mjs:3-10),左间距 4px(closeMargin :12);字号被 Selection 固定为 14px(selection/src/styles/index.cssr.mjs:197)。输入位高 = 选择框高 - 6px(:146) */
.n-select.multi { height: auto; min-height: 28px; flex-wrap: wrap; align-items: flex-start; align-content: flex-start; row-gap: 3px; padding: 2px 25px 2px 11px; cursor: text; }   /* 官方容器 padding 3px 26px 0 12px、每个 tag 外包 padding 0 7px 3px 0(selection/styles/_common.mjs:4、selection/src/styles/index.cssr.mjs:195):高 = 3 + n × (tag + 3) = tag + 6;官方边框是覆盖层、不占位,原型有真 1px 边框,所以上下内边距各 2px、行距 3px 用 row-gap:单行高 = tag + 6(small 28 / medium 34 / large 40),多行每行 +tag+3 */
.n-select.multi:not(.sm) { min-height: 34px; }
.n-select.multi:not(.sm) .ms-tag, .n-select.multi:not(.sm) .ms-in { height: 28px; }   /* medium:tag 28、输入位 34 - 6 */
.n-select.multi:not(.sm) .ms-tag button { width: 18px; height: 18px; }
.n-select.multi:not(.sm) .ms-tag button svg { width: 14px; height: 14px; }
.n-select.multi .ms-tag { display: inline-flex; align-items: center; height: 22px; margin: 0 7px 0 0; padding: 0 7px; border-radius: 2px; font-size: 14px; line-height: 1; background: var(--tag-bg); box-shadow: inset 0 0 0 1px var(--n-border-strong); color: var(--n-text); white-space: nowrap; max-width: 100%; }
.n-select.multi .ms-tag .tx { overflow: hidden; text-overflow: ellipsis; }
.n-select.multi .ms-tag button { flex: none; width: 16px; height: 16px; margin: 0 0 0 4px; padding: 0; border: 0; border-radius: 3px; background: transparent; color: var(--n-text-3); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.n-select.multi .ms-tag button:hover { color: var(--n-text-2); }
.n-select.multi .ms-tag button svg { width: 12px; height: 12px; }
.n-select.multi .ms-in { flex: 1 1 24px; min-width: 24px; height: 22px; border: 0; outline: 0; background: transparent; font: inherit; color: inherit; padding: 0; }
.n-select.multi .ms-ph { position: absolute; left: 11px; top: 0; bottom: 0; display: flex; align-items: center; color: var(--n-text-3); pointer-events: none; }
.n-select.multi.open { cursor: text; }
/* 官方 filterable 多选的输入位平时 display:none,聚焦才 inline-block(selection/src/styles/index.cssr.mjs:145-152、selection/src/Selection.mjs:154、160);这里输入位恒在 DOM 里,未聚焦、未展开且已有 tag 时让它不占行,否则 medium / large 的 tag 较宽,输入位会单独占一行 */
.n-select.multi:not(:focus-within):not(.open):has(.ms-tag) .ms-in { position: absolute; flex: none; width: 0; min-width: 0; opacity: 0; pointer-events: none; }
.dd .it .ck-r { display: inline-flex; color: var(--n-primary); }   /* NSelect 多选菜单:已选项行尾的 ✓(_internal/select-menu 的 check icon) */
.dd .it .ck-r svg { width: 16px; height: 16px; }

/* ---------- NRadio(medium):16px 圆、选中 1px primary 描边 + 8px 内点(radio/styles/_common.mjs、light|dark.mjs;单选过滤 multiple:false 官方用 NRadio)---------- */
.n-radio { position: relative; display: inline-flex; align-items: center; justify-content: center; flex: none; width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--chk-border); background: var(--n-radio-bg); transition: box-shadow .3s, background-color .3s; cursor: pointer; vertical-align: middle; }
.n-radio:hover { box-shadow: inset 0 0 0 1px var(--n-primary); }
.n-radio.on { box-shadow: inset 0 0 0 1px var(--n-primary); }
.n-radio.on::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--n-primary); }   /* dotColorActive = primaryColor */
:root { --n-radio-bg: #fff; } html[data-theme="dark"] { --n-radio-bg: transparent; }

/* ---------- NPopconfirm / NPopover:popoverColor + boxShadow2 + 圆角 3px + padding 8px 14px;带箭头(popover/styles/_common.mjs、popconfirm/src/styles/index.cssr.mjs) ---------- */
.pop { position: fixed; z-index: 2003; left: 0; top: 0; background: var(--n-popover-bg); color: var(--n-text); border-radius: 3px; box-shadow: var(--n-shadow-pop); padding: 8px 14px; font-size: 14px; line-height: 1.6; }
.pop .pop-arrow { position: absolute; left: 0; right: 0; height: 10px; overflow: hidden; pointer-events: none; }
.pop.top .pop-arrow { top: 100%; }
.pop.bottom .pop-arrow { bottom: 100%; }
.pop .pop-arrow i { position: absolute; left: var(--arrow-x, 50%); width: 8.484px; height: 8.484px; background: var(--n-popover-bg); box-shadow: 0 0 8px 0 rgba(0, 0, 0, .12); transform: translateX(-50%) rotate(45deg); pointer-events: all; }
.pop.top .pop-arrow i { top: -4.242px; }
.pop.bottom .pop-arrow i { bottom: -4.242px; }
.pc-body { display: flex; align-items: center; flex-wrap: nowrap; }
.pc-body .ico { display: flex; font-size: 22px; color: var(--n-warning); margin: 0 8px 0 0; }
.pc-body .ico svg { width: 1em; height: 1em; fill: currentColor; }
.pc-act { display: flex; justify-content: flex-end; margin-top: 8px; }
.pc-act .n-btn + .n-btn { margin-left: 8px; }

/* ---------- 列设置气泡(ColumnSettings.vue):NPopover bottom-end、无箭头;行 = 拖动手柄 + NCheckbox + 固定到左 / 右两个 tiny 圆形按钮;底部「恢复默认」 ---------- */
.colset-pop { font-size: 14px; line-height: 1.6; position: absolute; z-index: 30; top: calc(100% + 6px); right: 0; background: var(--n-popover-bg); border-radius: 3px; box-shadow: var(--n-shadow-pop); padding: 8px 14px; }
.colset { min-width: 200px; max-height: 320px; overflow: auto; text-align: left; }
.colset-row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; cursor: default; }
.colset-row.over { background: var(--n-item-hover); }
.colset-row.dragging { opacity: .5; }
.colset-drag { cursor: grab; display: inline-flex; align-items: center; color: var(--n-text-3); font-size: 14px; line-height: 0; }
.colset-drag svg { width: 1em; height: 1em; fill: currentColor; }
.colset-lab { flex: 1; min-width: 0; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; }
.colset-lab.dis { cursor: not-allowed; opacity: var(--n-op-disabled); }   /* 最后一列不能取消:NCheckbox disabled(opacityDisabled:亮 .5 / 暗 .38)*/
.colset-pins { display: inline-flex; gap: 2px; }
.colset-pins .n-btn { width: 22px; height: 22px; padding: 0; border-radius: 50%; border-color: transparent; justify-content: center; font-size: 14px; line-height: 1; }
.colset-pins .n-btn:hover { background: var(--n-btn-hover); color: var(--n-text); border-color: transparent; }
.colset-pins .n-btn.on { color: var(--n-primary); }   /* NButton type=primary quaternary:字色 primary */
.colset-foot { margin-top: 6px; padding-top: 6px; display: flex; justify-content: flex-end; border-top: 1px solid var(--n-border); }
.colset-foot .n-btn { height: 22px; padding: 0 6px; font-size: 12px; }

/* 按钮 loading(NButton loading:图标位换成 18px spinner,margin-right 6px;button/src/Button.mjs:454-470)*/
.n-btn .btn-ld, .n-btn .btn-ic { display: inline-flex; width: 18px; height: 18px; font-size: 18px; margin: 0; line-height: 0; }   /* 图标与文字的 6px 由按钮的 gap 给,不叠加 margin(对照 parity:官方 搜索 / 重置 宽 80,不是 82) */
.n-btn .btn-ld svg { display: block; width: 1em; height: 1em; animation: n-rotator 3s linear infinite both; }
.n-btn .btn-ic svg { display: block; width: 1em; height: 1em; }   /* 按钮图标 1em = 18px;笔画按 18px 渲染都约 1.5px(搜索 16 视口 × 1.35、重置 24 视口 × 2),两枚粗细一致 */
.n-btn.loading { cursor: default; }

/* 自定义渲染的过滤面板(示例:宿主自己用 NButton 拼的负责人选择) */
.cust-owners { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; width: 244px; }
.n-btn.tiny.sel { color: var(--n-primary); border-color: var(--n-primary); }

.tb-lt { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tb-lt .st-title { white-space: nowrap; }
.dd .it.hl { background: var(--n-item-hover); }   /* 键盘高亮项 = NSelect 的 pending 项(select-menu optionColorPending = hoverColor) */
.pc-act .n-btn { font-size: 14px; }
.hp-opt:focus-visible, .hp-opt:focus { outline: 0; }
.hp-opt:focus-visible .n-check { box-shadow: 0 0 0 2px color-mix(in srgb, var(--n-primary) 30%, transparent); }   /* Checkbox 聚焦环(checkbox/styles/light.mjs:44-46) */
.hp-opt:focus-visible .n-radio { box-shadow: inset 0 0 0 1px var(--n-primary), 0 0 0 2px color-mix(in srgb, var(--n-primary) var(--radio-focus-a), transparent); }   /* Radio 聚焦:1px 内描边 + 光圈(亮 .2 / 暗 .3)(radio/styles/light.mjs:34-36、dark.mjs:37-39) */
.hpop:focus { outline: 0; }
.n-input.dp.open { border-color: var(--n-primary-hover); background: var(--n-input-bg-focus); box-shadow: var(--n-ring-input); }
.n-btn.quiet.on { background: var(--n-btn-hover); }
/* NTooltip(tooltip/styles/light|dark.mjs):亮色深底白字 composite(#FFF, rgba(0,0,0,.85)) = rgb(38,38,38),暗色 popoverColor + textColor2;padding 8px 14px、圆角 3px、boxShadow2、带箭头、延迟 100ms */
:root { --tip-bg: rgb(38, 38, 38); --tip-fg: #fff; }
html[data-theme="dark"] { --tip-bg: rgb(72, 72, 78); --tip-fg: rgba(255, 255, 255, 0.82); }
.pop.tip { z-index: 2005; background: var(--tip-bg); color: var(--tip-fg); pointer-events: none; white-space: nowrap; }
.pop.tip .pop-arrow i { background: var(--tip-bg); }
/* 表体自成层叠上下文:里面表头 / 固定列的 z-index 不与表外的气泡(列设置、更多菜单)竞争 */
.tbl-scroll { isolation: isolate; }
.slot-n { display: none; }
@container (max-width: 599px) { .slot-w { display: none; } .slot-n { display: inline-flex; } }
/* 窄档(容器 < 600)日期范围面板:官方双日历并排宽 581px,超出 390 视口、右半与「确认」够不着;自有适配 = 两个日历上下叠(宽 290),分隔线变横线 */
.dp-panel.range.stack { grid-template-columns: auto; grid-template-areas: "l" "div" "r" "act"; }
.dp-panel.range.stack .dp-vdiv { width: auto; height: 1px; }
/* 窄档(size=large)的多选 tag:最小高 40px、字号 15px,标签 34px 高、关闭钮 18px / 图标 14px(tag/styles/light.mjs:43、_common.mjs:9-10)(抽屉本身只在窄档出现;搜索卡 / 工具栏按容器宽度判档) */
.sheet .n-select.multi { height: auto; min-height: 40px; font-size: 15px; }
.sheet .n-select.multi .ms-tag, .sheet .n-select.multi .ms-in { height: 34px; }
.sheet .n-select.multi .ms-tag button { width: 18px; height: 18px; }
.sheet .n-select.multi .ms-tag button svg { width: 14px; height: 14px; }
.sheet .n-select.multi .ms-ph { left: 14px; }
@container (max-width: 599px) {
  .tb .n-select.multi, .search-card .n-select.multi { height: auto; min-height: 40px; font-size: 15px; }
  .tb .n-select.multi .ms-tag, .tb .n-select.multi .ms-in, .search-card .n-select.multi .ms-tag, .search-card .n-select.multi .ms-in { height: 34px; }
  .tb .n-select.multi .ms-tag button, .search-card .n-select.multi .ms-tag button { width: 18px; height: 18px; }
  .tb .n-select.multi .ms-tag button svg, .search-card .n-select.multi .ms-tag button svg { width: 14px; height: 14px; }
  .tb .n-select.multi .ms-ph, .search-card .n-select.multi .ms-ph { left: 14px; }
}

/* ============================================================
   模块 5–9 补充样式
   ============================================================ */
/* ---- 多级表头(children 列):第 1 行 rowspan=2 / 组头 colspan,第 2 行叶子列;组头居中、下有分隔线(data-table 的 colspan 表头) ---- */
table.n-table thead th[rowspan] { height: auto; }
.tbl-scroll table.n-table thead tr + tr th { top: var(--vs-row-h); border-top-width: 0; }
.tbl-scroll table.n-table thead th.grp { text-align: center; }
.tbl-scroll table.n-table thead th.grp .th-txt { text-align: center; }
.dt-empty { top: var(--vs-row-h); }
table.n-table.hd2 ~ * .dt-empty {}
.tbl-table:has(table.hd2) > .dt-empty { top: calc(var(--vs-row-h) * 2); }

/* ---- 展开列 / 展开行(官方 expand 列:16px 的 ChevronRight,展开后转 90°;展开内容不随横向滚动) ---- */
table.n-table td.ex, table.n-table th.ex { width: 40px; padding: 0; text-align: center; }
.ex-tg { display: inline-flex; width: 16px; height: 16px; vertical-align: middle; cursor: pointer; color: var(--n-text); transition: transform .3s; }
.ex-tg svg { width: 100%; height: 100%; display: block; }
.ex-tg.open { transform: rotate(90deg); }
.ex-tg:focus-visible { outline: 2px solid color-mix(in srgb, var(--n-primary) 55%, transparent); outline-offset: 2px; border-radius: 3px; }
.tbl-scroll table.n-table tr.exp-row > td { height: auto; line-height: 1.6; padding: 0; white-space: normal; overflow: visible; background: var(--n-card-bg); }   /* overflow 必须 visible:td 一旦是滚动容器,里面的 sticky 就相对它而不是表体,内容会跟着横向滚走 */
.exp-in { position: sticky; left: 0; width: var(--sc-w, 100%); box-sizing: border-box; padding: 12px 16px 14px 56px; }
.exp-t { font-size: 13px; color: var(--n-text-2); margin-bottom: 8px; }
.tbl-scroll table.n-table.mt, table.n-table.mt { width: auto; min-width: 420px; table-layout: auto; border-collapse: separate; border-spacing: 0; font-size: 13px; }   /* 嵌套小表:不吃外层表格的 fixed 布局 / 行高规则 */
.tbl-scroll table.n-table.mt th, .tbl-scroll table.n-table.mt td, table.n-table.mt th, table.n-table.mt td { padding: 6px 12px; height: auto; line-height: 1.6; border-width: 0 1px 1px 0; overflow: visible; text-overflow: clip; white-space: nowrap; }
.tbl-scroll table.n-table.mt th:first-child, .tbl-scroll table.n-table.mt td:first-child { border-left-width: 1px; }
.tbl-scroll table.n-table.mt thead th { border-top-width: 1px; position: static; z-index: auto; }
.tbl-scroll table.n-table.mt td { background: var(--n-card-bg); }
.tbl-scroll table.n-table.mt td.num { text-align: right; }

/* ---- 合计行(summary):底色 thColor,文字 tdTextColor、不加粗(Body.mjs:494-517、index.cssr.mjs:225、240-241) ---- */
.tbl-scroll table.n-table tr.sum-row td { background: var(--n-th-bg); }
.tbl-scroll table.n-table tr.sum-row:hover td { background: var(--n-th-bg); }

/* ---- 超长省略 + Tooltip(ellipsis: { tooltip: true }):td 本来就 ellipsis;Tooltip 内容可换行,最宽 480px ---- */
.pop.tip.wrap { white-space: normal; max-width: min(480px, calc(100vw - 16px)); }
.empty-txt { color: var(--n-text); }

/* ---- 窄档卡片里的展开内容 ---- */
.rc-more { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--n-border); overflow-x: auto; }
.rc-more table.n-table.mt { min-width: 0; width: 100%; }
.rc-more table.n-table.mt th, .rc-more table.n-table.mt td { padding: 6px 8px; }

/* ---- 选择框:分组标题 / 禁用项 / 加载中(NSelect group 标题 = textColor3、高 34px(min-height = option-height)、字号 .93em ≈ 13px、不可选(_internal/select-menu/src/styles/index.cssr.mjs:28-32、60-64);disabled 项 textColorDisabled、not-allowed;loading 时箭头换成 spinner) ---- */
.dd .it-grp { height: 34px; line-height: 34px; padding: 0 8px; font-size: 13px; color: var(--n-text-2); }
.dd .it.dis { color: var(--n-text-3); cursor: not-allowed; }
.dd .it.dis:hover { background: transparent; }
.n-select .caret.ld { color: var(--n-primary); }
.n-select .caret.ld svg { width: 16px; height: 16px; display: block; animation: n-rotator 3s linear infinite both; }
.n-empty__extra { margin-top: 12px; color: var(--n-text); pointer-events: auto; }   /* empty/src/styles/index.cssr.mjs:extra margin-top 12px、extraTextColor = textColor2 */

/* ---- NMessage 的类型图标(message/src/Message.mjs、styles):success / error / info 带 20px 图标,margin-right 10px ---- */
.toast { display: flex; align-items: center; }
.toast .mi { flex: none; display: inline-flex; width: 20px; height: 20px; margin-right: 10px; }
.toast .mi svg { width: 20px; height: 20px; fill: currentColor; }
.toast.t-success .mi { color: var(--n-success); }
.toast.t-error .mi { color: var(--n-error); }
/* 文本框清除 ×:有值且悬停 / 聚焦才显示(placeholder 一直存在,:placeholder-shown 判空) */
.n-input .clr { display: none; cursor: pointer; margin-left: 4px; }
.n-input:has(> input:not(:placeholder-shown)):is(:hover, :focus-within) > .clr { display: inline-flex; }
.n-input .clr:hover { color: var(--n-clear-hover); }
/* NInputNumber 的 − + 文字按钮:18×18、图标 18、textColor2,悬停 primaryColorHover(text button) */
.n-input .num-btns { flex: none; display: inline-flex; margin-left: 0; }
.n-input .num-btns button { width: 18px; height: 18px; padding: 0; border: 0; background: transparent; color: var(--n-text); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; transition: color .15s; }
.n-input .num-btns button svg { width: 1em; height: 1em; display: block; }
.n-input .num-btns button:hover { color: var(--n-primary-hover); }
.n-input.num .clr { margin-right: 0; }
.n-input.num input { flex: 1 1 auto; }

/* ============================================================
   弹窗 / 表单 / 确认框(NModal preset=card、NForm、NDialog;数值取自 modal/card/form/dialog 的 styles 与真实库 DemoCrud 的实测)
   ============================================================ */
:root { --n-shadow-1: 0 1px 2px -2px rgba(0, 0, 0, .08), 0 3px 6px 0 rgba(0, 0, 0, .06), 0 5px 12px 4px rgba(0, 0, 0, .04); --n-warning-hover: #fcb040; }   /* card/styles/light.mjs boxShadow1(CL:154) */
html[data-theme="dark"] { --n-shadow-1: 0 1px 2px -2px rgba(0, 0, 0, .24), 0 3px 6px 0 rgba(0, 0, 0, .18), 0 5px 12px 4px rgba(0, 0, 0, .12); --n-warning-hover: #f5d599; }
.modal-root { position: fixed; inset: 0; z-index: 2001; }
.modal-mask { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); }   /* modal/src/styles/index.cssr.mjs:17-25 */
.modal-scroll { position: fixed; inset: 0; overflow: auto; display: flex; padding: 16px; box-sizing: border-box; pointer-events: none; }
.modal-scroll > * { pointer-events: auto; }
.modal-card { position: relative; margin: auto; width: 480px; max-width: 100%; background: var(--n-modal-bg); color: var(--n-text); border-radius: 3px; box-shadow: var(--n-shadow-1); outline: none; font-size: 14px; line-height: 1.6; }
.mc-head { display: flex; align-items: center; padding: 19px 24px 20px; }   /* card medium:padding 19px 24px 20px(card/styles/_common.mjs:4) */
.mc-title { flex: 1; min-width: 0; font-size: 18px; font-weight: 500; color: var(--n-text-1); }
.mc-close, .dlg-close { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; font-size: 18px; border-radius: 3px; color: var(--n-close); cursor: pointer; margin-left: 8px; transition: background-color .3s, color .3s; }   /* 关闭图标:closeIconColor(亮 rgb(102,102,102) / 暗 .52),hover / pressed 字色不变、只换底(card/styles/light.mjs:40-45、dialog/styles/light.mjs:35-40、drawer/styles/light.mjs) */
.mc-close:hover, .dlg-close:hover { background: var(--n-close-bg-hover); }
.mc-close:active, .dlg-close:active { background: var(--n-close-bg-press); }
.mc-close svg, .dlg-close svg { width: 1em; height: 1em; display: block; }
.mc-body { padding: 0 24px 20px; }
.mc-foot { padding: 0 24px 20px; display: flex; justify-content: flex-end; gap: 8px; }

/* NForm:label-placement left、label-width 80;每项 = 34px 控件 + 24px 反馈区(feedbackHeightMedium)= 58px;必填星号在文字右侧(默认 require-mark-placement: right) */
.fm-item { display: grid; grid-template-columns: 80px minmax(0, 1fr); grid-template-areas: "lab ctl" "lab fb"; align-items: start; }
.fm-lab { grid-area: lab; display: grid; grid-template-columns: 1fr auto; align-items: center; min-height: 34px; padding: 0 12px 0 0; box-sizing: border-box; text-align: right; line-height: 1.25; color: var(--n-text-1); white-space: nowrap; }
.fm-ast { color: var(--n-error); margin-left: 2px; }
.fm-ctl { grid-area: ctl; position: relative; min-height: 34px; display: flex; align-items: center; min-width: 0; }
.fm-ctl > .n-input, .fm-ctl > .n-select { width: 100%; }
.fm-fb { grid-area: fb; min-height: 24px; line-height: 1.25; }
.fm-fb:not(:empty) { padding: 4px 0 0 2px; }
.fm-err { color: var(--n-error); }
.fm-item.ta .fm-ctl { align-items: flex-start; }
.n-input.ta { height: auto; align-items: flex-start; padding: 0; }
.n-input.ta textarea { width: 100%; box-sizing: border-box; border: 0; outline: 0; background: transparent; font: inherit; color: inherit; padding: 5.5px 11px; resize: none; line-height: 1.6; }   /* 官方垂直 padding = (34-1.5*14)/2 = 6.5px(input/src/styles/input.cssr.mjs:17),扣真边框 1px;水平 12px 同样扣 1px */
.n-input.ta textarea::placeholder { color: var(--n-text-3); }
/* status="error":边框 errorColor、聚焦环 errorColor alpha .2(input/styles/light.mjs) */
.n-input.err, .n-select.err { border-color: var(--n-error); }
.n-input.err:hover, .n-select.err:hover { border-color: var(--n-error-hover); }
.n-input.err:focus-within, .n-input.err.open { border-color: var(--n-error-hover); background: var(--n-bg-focus-err); box-shadow: var(--n-ring-input-err); }   /* Input 聚焦:borderFocusError = errorColorHover、暗色底 error .1、光圈暗 0 0 8px 0 .3(input/styles/light.mjs:93-97、dark.mjs:95-101) */
.n-select.err:focus-visible { border-color: var(--n-error-hover); box-shadow: var(--n-ring-select-err); }   /* Select 已聚焦未展开:borderFocusError = errorColorHover(selection/styles/light.mjs:88、93-95) */
.n-select.err.open { border-color: var(--n-error); background: var(--n-bg-focus-err); box-shadow: var(--n-ring-select-err); }   /* Select 展开:borderActiveError = errorColor、暗色底 error .1、光圈暗 0 0 8px 0 .4(selection/styles/light.mjs:87-96、dark.mjs:95-106) */

/* 窄档:表单放在底部抽屉里(控件 40px / 15px,label 仍在左 80px),底部按钮栏靠右 */
.fm-wrap { padding: 16px 24px 0; }
.crud-sheet .fm-item { grid-template-columns: 72px minmax(0, 1fr); }
.crud-sheet .fm-lab { min-height: 40px; font-size: 15px; }
.crud-sheet .fm-ctl { min-height: 40px; }
.crud-sheet .n-input.ta textarea { font-size: 15px; padding: 8px 14px; }
.crud-foot { justify-content: flex-end; margin-top: 0; }
.sheet-foot.crud-foot:not(.pk-foot) > .n-btn { flex: 1 1 0; min-width: 0; }   /* 窄档底部抽屉:两个按钮等宽并排(设计 2.15 B3);带「已选 N 项」的选择物料除外 */
.crud-sheet .sheet-foot { margin-top: 0; }

/* NDialog warning:宽 446、padding 16px 28px 20px、标题 18px / 500 + 28px 图标(warningColor)、内容 margin 8px 0 16px、按钮 small:取消 ghost、确认 type=warning */
.dlg-card { position: relative; margin: auto; width: 446px; max-width: calc(100vw - 32px); box-sizing: border-box; background: var(--n-modal-bg); color: var(--n-text); border-radius: 3px; padding: 16px 28px 20px; box-shadow: var(--n-shadow-1); outline: none; font-size: 14px; line-height: 1.6; }
.dlg-close { position: absolute; right: 0; top: 0; margin: 20px 26px 0 0; z-index: 1; }
.dlg-title { display: flex; align-items: center; font-size: 18px; font-weight: 500; color: var(--n-text-1); padding-right: 28px; }
.dlg-ico { display: inline-flex; font-size: 28px; color: var(--n-warning); margin: 0 4px 0 0; }
.dlg-ico svg { width: 1em; height: 1em; fill: currentColor; }
.dlg-body { margin: 8px 0 16px; }
.dlg-act { display: flex; justify-content: flex-end; }
.dlg-act > * + * { margin-left: 12px; }
.n-btn.ghost { background: transparent; }
.n-btn.warning { background: var(--n-warning); border-color: var(--n-warning); color: var(--n-on-primary); }
.n-btn.warning:hover { background: var(--n-warning-hover); border-color: var(--n-warning-hover); color: var(--n-on-primary); }
.n-btn[disabled] { opacity: var(--n-op-disabled); cursor: not-allowed; }   /* button/src/styles/index.cssr.mjs:141 opacity = opacityDisabled(亮 .5 / 暗 .38) */

/* ============================================================
   模块 10–13 + 外壳开关(语言 / 页面底色 / 个人密度)
   ============================================================ */

/* ---- 外壳:侧栏「主题」组里的四行开关(明暗 / 语言 / 页面底色 / 密度),都是宿主外壳的控件,不在表格页面里 ---- */
.shell-row { margin-bottom: 6px; }
.shell-row .sr-l { display: block; font-size: 11px; line-height: 1.3; color: var(--n-text-2); margin: 0 0 3px 2px; }
.shell-row .mini button { padding: 4px 6px; }
.side .group-title { margin: 16px 0 8px; }
.mod { padding: 7px 10px; margin-bottom: 2px; }
#modList .mod { padding: 6px 10px; margin-bottom: 1px; }   /* 两级目录 12 个子页常显:条目收紧一点,1440×900 下侧栏(含全局设置)不出滚动 */
.side { scrollbar-width: thin; }

/* ---- 页面底色:灰 = NLayout embedded(colorEmbedded = actionColor);白 = 不开 embedded(color = bodyColor,亮色 #fff;暗色两者相等,没有差别) ---- */
html[data-bg="white"] { --n-body-bg: #ffffff; }
html[data-theme="dark"][data-bg="white"] { --n-body-bg: rgb(16, 16, 20); }

/* ---- 英文下的表单 label:库 NForm 的 label-width 由宿主按语言给(中文 80、英文更宽) ---- */
html[lang="en"] .fm-item { grid-template-columns: 128px minmax(0, 1fr); }
html[lang="en"] .search-grid .n-form-item > label { width: 124px; }   /* 英文 label 更宽:NForm 的 label-width 由宿主按语言给 */
@media (min-width: 861px) { .side { overflow-x: hidden; } }

/* ---- 自然高度页面(不开 fillHeight):整页在 .main 里滚动,卡片按内容撑开 ---- */
#stage[data-nat] { flex: none; }
#stage[data-nat] > .viewport { flex: none; }
#stage[data-nat] #preview { flex: none; }
#stage[data-nat] .smart-table { flex: none; }
#stage[data-nat] .smart-table > .n-card:not(.search-card) { flex: none; display: block; }
#stage[data-nat] .smart-table > .n-card:not(.search-card) > .dt { display: block; flex: none; }
#stage[data-nat] .dt > .tbl-table { position: static; min-height: 0; }
#stage[data-nat] .tbl-scroll { position: static; overflow-x: auto; overflow-y: hidden; }
#stage[data-nat] .tbl-cards { overflow: visible; position: static; }
#stage[data-nat] .smart-table > .n-card:not(.search-card) > .dt > .tbl-cards { max-height: none; overflow: visible; }
#stage[data-nat] table.n-table thead th { position: static; }
.smart-table .card-top { scroll-margin-top: 16px; }

/* ---- 卡片头:标题 + 右侧操作(嵌入形态里的子表卡片) ---- */
.card-hd { display: flex; align-items: center; gap: 12px; min-height: 28px; margin-bottom: 12px; }
.card-hd .card-title { flex: 1; min-width: 0; font-size: 16px; font-weight: 500; color: var(--n-text-1); }

/* ---- 模块 10:行拖拽 ---- */
.drag-handle { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; margin: -2px 0; border-radius: 3px; color: var(--n-text-2); cursor: grab; touch-action: none; user-select: none; font-size: 16px; }
.drag-handle:hover { background: var(--n-btn-hover); color: var(--n-text-1); }
.drag-handle svg { width: 1em; height: 1em; fill: currentColor; display: block; }
.drag-handle:focus-visible { outline: 2px solid var(--n-primary); outline-offset: 1px; }
table.n-table th.rd-h, table.n-table td.rd-h { width: 48px; padding-left: 12px; padding-right: 0; }
.smart-table[data-density="compact"] table.n-table th.rd-h, .smart-table[data-density="compact"] table.n-table td.rd-h { padding-left: 8px; }
body.rd-ing, body.rd-ing * { cursor: grabbing !important; user-select: none !important; }
tr.rd-chosen > td { background: var(--n-card-bg); position: relative; z-index: 3; }
tr.rd-chosen { filter: drop-shadow(0 6px 10px rgba(0,0,0,.22)); }
.rc.rd-chosen { background: var(--n-card-bg); box-shadow: 0 6px 16px -6px rgba(0,0,0,.35); position: relative; z-index: 3; }
.rc.rd-chosen { border-radius: 3px; }
tr.rd-shift, .rc.rd-shift { transition: transform .15s cubic-bezier(.4, 0, .2, 1); }
.rc .rd-head { display: flex; align-items: center; gap: 8px; }
.rc .drag-handle { width: 44px; height: 44px; margin: -10px 0 -10px -10px; font-size: 18px; }   /* 窄档卡片:触控目标 44px(5.3) */

/* ---- 模块 11:主从联动(左树 + 右表) ---- */
.md { display: flex; gap: 16px; flex: 1 1 0; min-height: 0; align-items: stretch; }
.md-side { flex: none; width: 240px; padding: 16px 12px; display: flex; flex-direction: column; min-height: 0; overflow: auto; }
.md[data-t="mid"] .md-side { width: 200px; }
.md-side .md-title { font-size: 14px; font-weight: 500; color: var(--n-text-1); padding: 0 4px 8px; }
.md-main { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.md-main > .smart-table { flex: 1 1 0; min-height: 0; }
.md[data-t="narrow"] { flex-direction: column; gap: 12px; }
.md[data-t="narrow"] .md-main { flex: 1 1 0; }
.md-pick { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 16px; position: relative; }
.md-pick .lab { color: var(--n-text-1); font-size: 14px; flex: none; }
.md-pick .n-select { flex: 1 1 auto; min-width: 0; }
.md-pick .dd.tdd { position: absolute; left: 0; right: 0; width: auto; min-width: 0; margin: 0 16px; top: calc(100% - 6px); z-index: 40; padding: 4px 6px; max-height: 320px; overflow: auto; }
/* NTree(tree/src/styles/index.cssr.mjs、tree/styles/light.mjs):节点 30px 高、包装上下 3px、缩进 24、内容左 4 右 6、选中 primary 10%(暗色 15%)、悬停 hoverColor、按下 pressedColor、圆角 2px、箭头 14px textColor3 */
.n-tree { font-size: 14px; line-height: 1.5; outline: none; }
.tn-w { padding: 3px 0; }
.tn { position: relative; display: flex; align-items: center; min-height: 30px; border-radius: 2px; cursor: pointer; color: var(--n-text); transition: background-color .3s; }   /* nodeBorderRadius = borderRadiusSmall(tree/styles/light.mjs:25) */
.tn:hover { background: var(--n-item-hover); }
.tn:active:not(.on) { background: var(--n-item-press); }   /* nodeColorPressed = pressedColor(tree/styles/light.mjs:27;tree/src/styles/index.cssr.mjs:34-38) */
.tn.on { background: color-mix(in srgb, var(--n-primary) var(--tn-on-a), transparent); }   /* nodeColorActive:亮 .1 / 暗 .15(tree/styles/light.mjs:28-30、dark.mjs:21-23) */
.tn:focus-visible { outline: 2px solid color-mix(in srgb, var(--n-primary) 55%, transparent); outline-offset: -2px; }
.tn .tn-ind { flex: none; }
.tn .tn-sw { flex: none; width: 24px; height: 30px; display: inline-flex; align-items: center; justify-content: center; color: var(--n-text-2); transition: transform .15s; }
.tn .tn-sw svg { width: 14px; height: 14px; fill: currentColor; display: block; }
.tn .tn-sw.open { transform: rotate(90deg); }
.tn .tn-sw.hide { visibility: hidden; }
.tn .tn-ct { display: inline-flex; align-items: center; gap: 8px; padding: 0 6px 0 4px; min-width: 0; flex: 1 1 auto; }
.tn .tn-tx { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tn .tn-cnt { flex: none; font-size: 12px; color: var(--n-text-2); font-variant-numeric: tabular-nums; }

/* 行高亮(activeRowKey):与库一致,默认取主色 9%(库的 --smart-table-active-row-bg-auto;宿主可经全局 activeRowBg / --smart-table-active-row-bg 覆盖) */
tr.active > td, tr.active > td.fx, tr.active > td.sorting { background: color-mix(in srgb, var(--n-primary) 9%, var(--n-card-bg)); }
.rc.active { background: color-mix(in srgb, var(--n-primary) 9%, var(--n-card-bg)); border-color: color-mix(in srgb, var(--n-primary) 35%, transparent); }
.md-main tbody tr[data-no], .md-main .rc[data-no], #stage[data-rowclick] tbody tr[data-no] { cursor: pointer; }

/* NDrawer(drawer/styles/light.mjs:头 / 脚内边距 16 24、标题 18px、头下分隔线、boxShadow3;遮罩 rgba(0,0,0,.3) 淡入 0.2s,与底部抽屉的 .mask 同(drawer/src/styles/index.cssr.mjs:137、145-149);右侧本体左上 / 左下圆角 var(--n-border-radius) = 3px(:76-77),滑入 0.3s cubic-bezier(0,0,.2,1)(_styles/transitions/slide-in-from-right.mjs、_styles/common/_common.mjs:8)) */
.drawer-root { position: fixed; inset: 0; z-index: 2001; }
.drawer-mask { position: fixed; inset: 0; background: rgba(0, 0, 0, .3); animation: mask-in .2s cubic-bezier(.4, 0, 1, 1); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 100vw; display: flex; flex-direction: column; background: var(--n-modal-bg); color: var(--n-text); box-shadow: var(--sheet-shadow); border-radius: 3px 0 0 3px; outline: none; font-size: 14px; line-height: 1.6; animation: dwIn .3s cubic-bezier(0, 0, .2, 1); }
@keyframes dwIn { from { transform: translateX(100%); } to { transform: none; } }
.dw-head { display: flex; align-items: center; padding: 16px 24px; border-bottom: 1px solid var(--n-border); flex: none; }
.dw-title { flex: 1; min-width: 0; font-size: 18px; font-weight: 500; line-height: 1; color: var(--n-text-1); }
.dw-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 16px 24px; }
.dw-foot { flex: none; display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px; }
/* NDescriptions bordered + size small + label-placement left + column 1(descriptions/styles/_common.mjs:2-12:th / td padding 8px 12px) */
table.desc { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 14px; }
table.desc th, table.desc td { border: 1px solid var(--n-border); padding: 8px 12px; text-align: left; vertical-align: top; word-break: break-all; }
table.desc th { width: 108px; background: var(--n-th-bg); color: var(--n-text-2); font-weight: 400; }
.dw-sub { margin: 20px 0 8px; font-size: 14px; font-weight: 500; color: var(--n-text-1); }

/* ---- 模块 12:嵌入形态 ---- */
.sub-card { padding-bottom: 8px; }
/* 模块 12:子表卡排在大表下方,自然高度、不参与「吃剩余高度」(压过 .smart-table > .n-card:not(.search-card) 的 flex:1);
   封顶高度落在 .tbl-scroll 上:多出的行在子表内滚动,thead 吸顶(基底规则)、合计行吸底;封顶 = 视口 28%,夹在 140–280px,大表至少留出 --vs-min-h */
.smart-table > .n-card.sub-card { flex: none; display: block; }
.smart-table > .n-card.sub-card > .dt { flex: none; display: block; }
.sub-card .tbl-scroll { max-height: calc(clamp(140px, 28vh, 280px) + var(--vs-row-h) + 2px); overflow-y: auto; }   /* 官方 maxHeight 只管表体、表头在外:封顶 = 表体 clamp(140–280) + 表头一行(--vs-row-h)+ 外框上下各 1px */
.sub-card .sum-row td { position: sticky; bottom: 0; z-index: 1; }
/* 条纹行:官方 striped 与 hover 同优先级、hover 在后,所以 hover 行显示 hover 色(data-table/src/styles/index.cssr.mjs:107);合计行不吃条纹(TableParts/Body.mjs:585 striped = !isSummary && …) */
table.n-table.striped tbody tr:nth-child(even):not(.sum-row):not(:hover) > td { background: var(--n-td-striped); }
table.n-table.sub { font-size: 14px; }
table.n-table.sub td.num, table.n-table.sub th.num { text-align: right; }
.sub-card .dt { position: relative; }
.sub-card .sum-row td { background: var(--n-th-bg); }
.sub-card .rm { color: var(--n-error); }
.si { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }   /* search.layout: 'inline':无卡片、单行自动换行(SearchForm.vue .smart-table-search-inline) */
.si .si-i { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.si .si-i label { font-size: 14px; color: var(--n-text-1); white-space: nowrap; }
.si .si-i .n-input, .si .si-i .n-select { width: 168px; }
.pk-tbl { border: 1px solid var(--n-border); border-radius: 3px; overflow: hidden; }
.pk-tbl table.n-table { margin: 0; }
.pk-tbl table.n-table th:first-child, .pk-tbl table.n-table td:first-child { border-left: 0; }
.pk-tbl table.n-table th:last-child, .pk-tbl table.n-table td:last-child { border-right: 0; }
.pk-tbl table.n-table thead th { border-top: 0; }
.pk-tbl table.n-table tbody tr:last-child td { border-bottom: 0; }
.pk-foot { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.pk-foot .pk-sel, .pk-foot2 .pk-sel { flex: 1; color: var(--n-text-2); font-size: 14px; text-align: left; }
.modal-card.wide { width: 720px; }
.pk-wrap .n-pagination { margin: 0; }
.sheet .pk-tbl { overflow-x: auto; }
.sheet .pk-tbl table.n-table { min-width: 480px; }
.sheet .si { flex-direction: column; align-items: stretch; gap: 10px; }
.sheet .si .si-i { width: 100%; }
.sheet .si .si-i label { flex: none; width: 64px; }
.sheet .si .si-i .n-input, .sheet .si .si-i .n-select, .sheet .si .si-i .pop-wrap { flex: 1; width: auto; min-width: 0; }
.sheet .si .si-i .pop-wrap { display: block !important; }
.si-act { display: contents; }
.sheet .si-act { display: flex; gap: 8px; }
.sheet .si-act .n-btn { flex: 1; width: auto; }
.rc .rm-line { margin-top: 4px; }

.pick-root { position: fixed; inset: 0; z-index: 2001; }
:root { --n-td-striped: rgb(250, 250, 252); }   /* data-table/styles/light.mjs:48 tdColorStriped = composite(cardColor, tableColorStriped rgba(0,0,100,.02)) */
html[data-theme="dark"] { --n-td-striped: rgb(36, 36, 39); }   /* dark:composite(cardColor rgb(24,24,28), overlay(.05)) */
.add-cond svg { width: 18px; height: 18px; }          /* 面板里的「添加条件」:官方 NButton small 档图标 18px(button/styles/_common.mjs iconSizeSmall) */
.sheet .add-cond svg { width: 20px; height: 20px; }   /* 窄档抽屉的控件是 40px = large 档,iconSizeLarge 20px */

/* ============================================================
   模块 14 · 可编辑表格 —— 选中框 / 编辑框 / 已修改标记 / 新增行 / 待删行 / 校验红框 / 浮层 / 窄档抽屉表单
   只用页面已有 token(--n-primary --n-error --warn --n-card-bg --n-text-2 --n-border-strong …),明暗两套自动跟随;动效只有 .15s 的 background-color / border-color / opacity。
   尺寸取值:选中 / 编辑框 = 2px 内描边(inset box-shadow,不占布局、不撑行高);编辑态单元格 padding 置 0、控件撑满单元格(行高不变,文字不跳);
   已修改标记 = 单元格左上角 6px 小三角(--warn:亮 #d97706 / 暗 #fbbf24,白底 / 卡片底上对比度够);新增行 = 主色 7% 底 + 首格左侧 3px 主色条;待删行 = 淡化 + 删除线。
   ============================================================ */
[data-xl] td.xc { position: relative; cursor: default; }
[data-xl] td.xro { color: var(--n-text-2); }                                       /* 只读格:次要文字色,与可编辑格区分 */
[data-xl] td.xk-ck { text-align: center; }
[data-xl] td.xk-ck .n-check { vertical-align: middle; }
[data-xl] td.xsel { box-shadow: inset 0 0 0 2px var(--n-primary); outline: 0; }
[data-xl] td.xerr { box-shadow: inset 0 0 0 2px var(--n-error); }
/* 「含 M 条当前不可见」:带草稿、但被搜索挡住的行数,放在「保存修改(N)」旁(次要文字色,12px) */
.xl-hid { align-self: center; font-size: 12px; color: var(--n-text-2); white-space: nowrap; }
[data-xl] td.xd::before {
  content: ""; position: absolute; top: 0; left: 0; width: 0; height: 0; pointer-events: none;
  border-style: solid; border-width: 6px 6px 0 0; border-color: var(--warn) transparent transparent transparent;
}
/* 编辑态:单元格 padding 置 0,控件撑满(NInput / NSelect / NInputNumber / NDatePicker 的触发器,去掉自带边框,改画 2px 内描边);多行文本框的单元格仍显示文本,保留 padding */
[data-xl] table.n-table td.xed:not([data-xk="textarea"]) { padding: 0; overflow: visible; }   /* 特异性要压过 .smart-table[data-density] table.n-table td 的 padding */
[data-xl] td.xed .xe { width: 100%; height: calc(var(--vs-row-h) - 1px); border: 0; border-radius: 0; padding-left: 8px; padding-right: 6px; background: var(--n-card-bg); box-shadow: inset 0 0 0 2px var(--n-primary); }
[data-xl][data-density="normal"] td.xed .xe { padding-left: 12px; }
[data-xl] td.xed .xe:hover, [data-xl] td.xed .xe:focus-within, [data-xl] td.xed .xe.open { border: 0; box-shadow: inset 0 0 0 2px var(--n-primary); background: var(--n-card-bg); }
[data-xl] td.xed .xe.err, [data-xl] td.xed .xe.err:hover, [data-xl] td.xed .xe.err:focus-within { border: 0; box-shadow: inset 0 0 0 2px var(--n-error); }
[data-xl] td.xed .n-select.xe { padding-right: 26px; }

.rc.xsum { cursor: default; }   /* 模块 5 窄档的合计卡(设计文档 13):不是数据行,不可点 */
</style>

   英文名对齐 README.en 与业界文档的叫法(Header filters / Column settings / Row reordering …)。no 是内部编号(对照页 ?m=、基线 m1–m14),界面上不显示。

  return new RegExp('^' + esc.replace(/%/g, '.*').replace(/_/g, '.') + '$', 'i');

function matchOne(row, c, get) {
  const raw = get ? get(row) : row[c.field];   // get:字段声明里的取值函数(模块 6 的时间戳列要先格式化成日期串再比较)
  const s = raw === null || raw === undefined ? '' : String(raw);
  const v = c.value;
  switch (c.op) {
    case 'isNull':      return isBlank(raw);
    case 'isNotNull':   return !isBlank(raw);
    case 'equal':       return cmp(raw, v) === 0;
    case 'notEqual':    return cmp(raw, v) !== 0;
    case 'gt':          return cmp(raw, v) > 0;
    case 'gte':         return cmp(raw, v) >= 0;
    case 'lt':          return cmp(raw, v) < 0;
    case 'lte':         return cmp(raw, v) <= 0;
    case 'contains':    return s.toLowerCase().includes(String(v).toLowerCase());
    case 'notContains': return !s.toLowerCase().includes(String(v).toLowerCase());
    case 'startsWith':  return s.toLowerCase().startsWith(String(v).toLowerCase());
    case 'endsWith':    return s.toLowerCase().endsWith(String(v).toLowerCase());
    case 'like':        return likeToRe(v).test(s);
    case 'in':          return toList(v).some(x => cmp(raw, x) === 0);
    case 'notIn':       return !toList(v).some(x => cmp(raw, x) === 0);
    default:            return false;   // 未知操作符 fail-closed(与 src/filter.ts 一致,规格 §5.9):脏条件按「不匹配」处理,不能让 or 逻辑下整列过滤被短路成放行全部
  }
}


/* 同字段多条件按其 logic 连接;跨字段一律 AND(现有 FilterState 的结构决定,见设计文档 7.4)。
   同字段的「且/或」选择器只出现在该字段的第 2 条及之后,所以以后续条件的 logic 为准。 */
function applyConditions(rows, conds, mod) {
  const active = conds.filter(isActive);
  if (!active.length) return rows;
  const byField = {}, getOf = {};
  active.forEach(c => { (byField[c.field] ||= []).push(c); getOf[c.field] = mod ? fieldDefs(mod).find(f => f.key === c.field)?.get : undefined; });
  return rows.filter(row =>
    Object.values(byField).every(group =>
      group.slice(1).some(c => c.logic === 'or')
        ? group.some(c => matchOne(row, c, getOf[c.field]))
        : group.every(c => matchOne(row, c, getOf[c.field])),
    ),
  );
}

/* ---- 类型推断(优先级,设计文档「可编辑表格」一节):① 列显式 editor / readonly → ② 列声明(options / format)→ ③ 数据值(前 20 行里第一个非空值)→ ④ 兜底输入框。
   返回 { kind, via }:kind = 'input' | 'textarea' | 'number' | 'select' | 'date' | 'datetime' | 'checkbox' | null(不可编辑);via = 命中的是哪一条。
   这里不用后面才定义的 isoOk(const,会落在暂时性死区),日期校验自带一份 xlYmdOk。 ---- */
const XL_KINDS = ['input', 'textarea', 'number', 'select', 'select-table', 'date', 'datetime', 'checkbox'];   // select-table = 选项来自外部 / 主数据(长列表):下拉里是一张带搜索 + 分页的表(库里是嵌套的 SmartTable);小静态枚举仍用 select
const XL_DATE_RX = /^\d{4}-\d{2}-\d{2}$/, XL_DT_RX = /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/;
function xlYmdOk(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s ?? '');
  if (!m) return false;
  const t = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  return t.getUTCFullYear() === +m[1] && t.getUTCMonth() === +m[2] - 1 && t.getUTCDate() === +m[3];
}
const xlDtOk = (s) => XL_DT_RX.test(s ?? '') && xlYmdOk(s.slice(0, 10)) && +s.slice(11, 13) < 24 && +s.slice(14, 16) < 60 && +s.slice(17, 19) < 60;
function xlInfer(col, rows) {
  if (col.editor === false || col.readonly) return { kind: null, via: col.readonly ? 'readonly' : 'editor:false' };
  if (XL_KINDS.includes(col.editor)) return { kind: col.editor, via: 'editor' };
  if (col.options) return { kind: 'select', via: 'options' };
  if (col.format === 'date' || col.format === 'datetime') return { kind: col.format, via: 'format' };
  if (col.format) return { kind: 'number', via: 'format' };   // money / percent / 数字格式
  const v = rows.slice(0, 20).map((r) => r[col.key]).find((x) => x !== null && x !== undefined && x !== '');
  if (typeof v === 'boolean') return { kind: 'checkbox', via: 'value' };
  if (typeof v === 'number') return { kind: 'number', via: 'value' };
  if (v instanceof Date) return { kind: 'date', via: 'value' };
  if (typeof v === 'string') {
    if (XL_DATE_RX.test(v)) return { kind: 'date', via: 'value' };
    if (XL_DT_RX.test(v)) return { kind: 'datetime', via: 'value' };
    if (v.includes('\n') || v.length > 30) return { kind: 'textarea', via: 'value' };
    return { kind: 'input', via: 'value' };
  }
  return { kind: 'input', via: 'fallback' };   // 全空列 / 不认识的类型:推不出就退回输入框
}
const XL_INF = {};
const xlInf = (c) => (XL_INF[c.key] ??= xlInfer(c, XL_DATA));

  const ck = new Set(state.checked);
  const sel = rows.filter(r => ck.has(r.no)).length;
  const all = rows.length > 0 && sel === rows.length;
  const half = sel > 0 && !all;
  const narrow = state.tier === 'narrow';
  const virtual = m.virtual !== false;
  const empty = rows.length === 0 && (pi.loaded || m.immediate === false) && !pi.loading;   // immediate:false 的首屏:没请求过也是空数据 → NEmpty(同官方,不会是一片空白)
  const sortKeys = new Set(hdrMod() ? activeSorts().map(s => s.key) : []);
  /* 「页」的签名:页 / 页大小 / 生效条件任一变了,滚动位置回到顶部;其余重绘(勾选、删除、新增、列设置、密度……)保持位置 */
  const sig = [state.mod, pi.page, pi.size, JSON.stringify(queryOf(state.mod))].join('|');
  const frozen = isFrozen();   // 拖过列宽:所有列冻结成固定宽度;吸收列不钉宽,吸收剩余宽度(右侧不留白、也没有多出来的空列)
  vt.pending = { kind: narrow ? 'cards' : 'table', rows, cols, plan, sortKeys, offset: pi.startIndex, ck, sig, density: state.compact ? 'compact' : 'normal', virtual };
  Object.assign(vt, { plan, sortKeys, offset: pi.startIndex });   // 整页直出时 rowHtml 现在就要用

  let main;
  if (narrow) {
    main = `<div class="tbl-cards" data-vs="cards"${m.drag ? ' data-rdlist' : ''}>${!rows.length
      ? (empty ? emptyHtml() : '')
      : virtual ? '<div class="vs-pad" aria-hidden="true"></div><div class="vs-pad" aria-hidden="true"></div>' : rows.map((r, i) => cardHtml(r, cols, ck, i)).join('') + (m.excel && m.summary ? xlSumCardHtml(rows) : !m.excel && m.allSum ? sumCardsHtml(rows) : '')}</div>`;
  } else {
    const flexKey = frozen ? fillColKey(cols) : (cols.find(c => c.flex) ?? cols[0]).key;   // 没拖过:弹性列 = 名称(被隐藏时退到第一个可见列);拖过:弹性列 = 吸收列
    const minW = tableMinW();
    const nCol = plan.length;
    const colgroup = `<colgroup>${plan.map(it => it.c ? (it.c.key === flexKey ? '<col>' : `<col style="width:${it.w}px">`) : `<col style="width:${it.w}px">`).join('')}</colgroup>`;
    let body = '';
    if (rows.length) {
      if (virtual) body = padRowHtml(nCol) + padRowHtml(nCol);
      else body = rows.map((r, i) => rowHtml(r, ck.has(r.no), i) + (state.expanded[r.no] ? expRowHtml(r, nCol) : '')).join('') + (m.summary ? sumRowsHtml(m.excel ? rows.filter(r => !state.xl.dels.has(r.no)) : rows) : '');
    }
    main = `<div class="tbl-table"><div class="tbl-scroll" data-vs="table"><table class="n-table${visibleUnits().some(u => u.children) ? ' hd2' : ''}" style="min-width:${minW}px;${fxVars(plan)}" aria-rowcount="${rows.length + 1}">${colgroup}
      <thead>${theadHtml(plan, all, half)}</thead>
      <tbody${m.drag ? ' data-rdlist' : ''}>${body}</tbody>
    </table></div>${empty ? emptyHtml() : ''}</div>`;
  }
  /* 底部一行 = chips(靠左)+ 分页(靠右),同一水平线;chips 出现 / 消失不改变这一行的高度(分页恒 28px) */
  const chips = hdrMod() ? hdrChipsHtml() : hasCond() ? chipsHtml() : '', pg = m.pagination === false ? '' : paginationHtml(pi);   // pagination:false(模块 14:一条路线十几道工序,不分页)
  return `<div class="dt${pi.loading ? ' loading' : ''}">${main}${pi.loading ? loadingHtml() : ''}
    ${chips || pg ? `<div class="dt-foot">${chips}${pg}</div>` : ''}</div>`;
}

/* 固定列偏移:渲染时用声明宽度估算(弹性列取最小宽),渲染后用实测的表头宽度校正,写回表格根上的 CSS 变量(单元格 left / right 引用它) */
function fixMeasure(sc) {
  const tbl = sc?.querySelector('table.n-table'), plan = vt.plan;
  if (!tbl || !plan) return;
  tbl.style.setProperty('--sc-w', sc.clientWidth + 'px');   // 展开行内容的宽 = 可视宽度(随横向滚动 sticky 在左边)
  const w = {};
  plan.forEach(it => { const th = tbl.querySelector(`thead th[data-ck="${it.k}"]`); w[it.k] = th ? th.getBoundingClientRect().width : it.w; });
  let off = 0;
  plan.forEach(it => { if (it.side === 'l') { tbl.style.setProperty('--fx' + it.k, off + 'px'); off += w[it.k]; } });
  off = 0;
  for (let i = plan.length - 1; i >= 0; i--) if (plan[i].side === 'r') { tbl.style.setProperty('--fx' + plan[i].k, off + 'px'); off += w[plan[i].k]; }
}
/* 横向滚动后固定列边缘才有阴影(官方:离开左端 → 左固定列右缘有影;没滚到右端 → 右固定列左缘有影) */
function fixShadow(sc) {
  sc.classList.toggle('sh-l', sc.scrollLeft > 0);
  sc.classList.toggle('sh-r', sc.scrollLeft + sc.clientWidth < sc.scrollWidth - 1);
}

/* ---- 窗口计算与绘制 ---- */
/* 给定 scrollTop,算可见行 [first, last](含部分可见)与窗口 [a, b)。
   表格:表头 sticky 占住上方 head 高度,行 i 在内容坐标里的顶边 = head + i*pitch,所以 first = floor(scrollTop / pitch)(表头把 scrollTop 那一段盖住了) */
function vsRange(top) {
  const view = vt.sc.clientHeight || VS_VIEW_FALLBACK, n = vt.n, pitch = vt.pitch;
  const first = Math.max(0, Math.min(Math.floor(top / pitch), n - 1));
  const last = Math.max(first, Math.min(Math.ceil((top + view - vt.head) / pitch) - 1, n - 1));
  return { first, last, a: Math.max(0, first - VS_BUF), b: Math.min(n, last + 1 + VS_BUF) };
}

function vsItemsHtml(i0, i1) {
  let h = '';
  for (let i = i0; i < i1; i++) {
    const r = vt.rows[i], on = vt.ck.has(r.no);
    h += vt.kind === 'table' ? rowHtml(r, on, i) : cardHtml(r, vt.cols, vt.ck, i);
  }
  return h;
}

/* 只动窗口边缘的行:滚出窗口的删掉,新进窗口的插进去,中间的行原样保留(不丢 hover / 焦点);两个 spacer 高度随窗口更新 */
function vsPaint(a, b, force) {
  const list = vt.list, top = list.firstElementChild, bot = list.lastElementChild;
  const oa = vt.a, ob = vt.b;
  if (force || oa < 0 || b <= oa || a >= ob) {
    while (top.nextElementSibling !== bot) top.nextElementSibling.remove();
    bot.insertAdjacentHTML('beforebegin', vsItemsHtml(a, b));
  } else {
    for (let i = oa; i < Math.min(a, ob); i++) top.nextElementSibling.remove();
    for (let i = Math.max(b, oa); i < ob; i++) bot.previousElementSibling.remove();
    if (a < oa) top.insertAdjacentHTML('afterend', vsItemsHtml(a, oa));
    if (b > ob) bot.insertAdjacentHTML('beforebegin', vsItemsHtml(ob, b));
  }
  top.style.height = a * vt.pitch + 'px';
  bot.style.height = (vt.n - b) * vt.pitch + 'px';
  vt.a = a; vt.b = b;
}

function vsSync(force, topOverride) {
  if (!vt.sc || !vt.n) return;
  const { a, b } = vsRange(Math.max(0, topOverride ?? vt.sc.scrollTop));
  if (!force && a === vt.a && b === vt.b) return;
  vsPaint(a, b, force);
}

/* 量真实的行间距 / 表头高;与当前值差 > 0.05px 就采纳并写缓存(缩放 / 字体差异会让整数假设失真)。返回是否变了 */
function vsMeasure() {
  const items = [...vt.list.children].filter(x => !x.classList.contains('vs-pad'));
  if (!items.length) return false;
  const r0 = items[0].getBoundingClientRect();
  let pitch;
  if (items.length > 1) pitch = (items[items.length - 1].getBoundingClientRect().top - r0.top) / (items.length - 1);
  else pitch = r0.height + (vt.kind === 'cards' ? (parseFloat(getComputedStyle(items[0]).marginBottom) || 0) : 0);
  let changed = false;
  if (pitch > 4 && Math.abs(pitch - vt.pitch) > 0.05) { vt.pitch = pitch; changed = true; }
  if (vt.kind === 'table') {
    const h = vt.sc.querySelector('thead')?.getBoundingClientRect().height ?? 0;
    if (h > 4 && Math.abs(h - vt.head) > 0.05) { vt.head = h; changed = true; }
  }
  vt.cache[`${vt.kind}|${vt.kind === 'cards' ? '-' : vt.density}|${vt.cols.length}`] = { pitch: vt.pitch, head: vt.head };
  return changed;
}

function vsSchedule() {
  if (vt.raf) return;
  vt.raf = requestAnimationFrame(() => { vt.raf = 0; vsSync(false); });
}

function vsOnScroll() {
  const sc = vt.sc;
  if (!sc) return;
  vt.kept = { top: sc.scrollTop, kind: vt.kind, sig: vt.sig, pitch: vt.pitch };
  if (vt.kind === 'table') fixShadow(sc);
  if (state.hp) placeHpop();   // 列头过滤气泡跟着漏斗走(横向滚动时漏斗移动,滚出可视区就藏起来)
  if (state.dp) placeDp();
  if (state.pc) placePc();
  if (vt.n) {
    const r = vsRange(sc.scrollTop);
    if (r.first < vt.a || r.last >= vt.b) { vsSync(false); return; }   // 拖滚动条跳出了缓冲区:立刻补,不等下一帧
  }
  vsSchedule();
}

function vsUnmount() {
  if (vt.raf) { cancelAnimationFrame(vt.raf); vt.raf = 0; }
  if (vt.ro) { vt.ro.disconnect(); vt.ro = null; }
  vt.sc = null; vt.list = null;
}

/* renderPreview 换完 DOM 后调用:接管新的滚动容器,画出第一屏窗口,恢复 / 归零滚动位置,挂 scroll 与尺寸监听 */
function vsMount(root) {
  vsUnmount();
  const p = vt.pending;
  vt.pending = null;
  const sc = root.querySelector('[data-vs]');
  if (!p || !sc) return;
  if (p.virtual === false) {   // 整页行已经直出:不开窗口,只管滚动位置 / 固定列偏移 / 阴影
    Object.assign(vt, { sc, kind: p.kind, rows: p.rows, cols: p.cols, plan: p.plan, sortKeys: p.sortKeys, offset: p.offset, ck: p.ck, n: 0, sig: p.sig, density: p.density, a: -1, b: -1, list: null });
    const keepTop = vt.kept && vt.kept.sig === p.sig && vt.kept.kind === p.kind ? vt.kept.top : 0;
    sc.scrollTop = keepTop;
    vt.kept = { top: sc.scrollTop, kind: p.kind, sig: p.sig, pitch: 0 };
    sc.addEventListener('scroll', vsOnScroll, { passive: true });
    if (typeof ResizeObserver === 'function') { vt.ro = new ResizeObserver(() => { if (vt.kind === 'table') { fixMeasure(sc); fixShadow(sc); } }); vt.ro.observe(sc); }
    if (p.kind === 'table') { fixMeasure(sc); fixShadow(sc); }
    return;
  }
  Object.assign(vt, { sc, kind: p.kind, rows: p.rows, cols: p.cols, plan: p.plan, sortKeys: p.sortKeys, offset: p.offset, ck: p.ck, n: p.rows.length, sig: p.sig, density: p.density, a: -1, b: -1 });
  vt.list = p.kind === 'table' ? sc.querySelector('tbody') : sc;
  const keep = vt.kept && vt.kept.sig === p.sig && vt.kept.kind === p.kind ? vt.kept : null;   // 页 / 页大小 / 条件 / 档位变了 -> 不沿用,回顶部
  let top = keep ? keep.top : 0;

  if (vt.n) {
    const cached = vt.cache[`${p.kind}|${p.kind === 'cards' ? '-' : p.density}|${p.cols.length}`];
    vt.pitch = cached?.pitch ?? (p.kind === 'table' ? VS_ROW[p.density] : vsCardEst(p.cols.length));
    vt.head = p.kind === 'table' ? (cached?.head ?? VS_ROW[p.density]) : 0;
    vsSync(true, top);
    const oldPitch = keep?.pitch;
    if (vsMeasure() || (oldPitch && Math.abs(oldPitch - vt.pitch) > 0.05)) {
      /* 行高变了(密度切换 / 首次实测):以「顶部那一行」为锚,滚动位置按新行高换算,窗口重画 */
      if (oldPitch && Math.abs(oldPitch - vt.pitch) > 0.05) top = Math.floor(top / oldPitch) * vt.pitch;
      vsSync(true, top);
    }
    sc.scrollTop = top;                                   // 先有 spacer 撑出总高度,再写 scrollTop
    vsSync(false);                                        // 浏览器可能夹了 scrollTop(例如删除后内容变短),按真实值再对一次窗口
  }
  vt.kept = { top: sc.scrollTop, kind: p.kind, sig: p.sig, pitch: vt.pitch };
  sc.addEventListener('scroll', vsOnScroll, { passive: true });
  if (typeof ResizeObserver === 'function') { vt.ro = new ResizeObserver(() => { vsSchedule(); if (vt.kind === 'table') { fixMeasure(sc); fixShadow(sc); } }); vt.ro.observe(sc); }   // 窗口 / 卡片高度变了,可见行数跟着变;宽度变了固定列偏移与阴影重算
  if (vt.kind === 'table') { fixMeasure(sc); fixShadow(sc); }
}

/* 列设置气泡(库的 ColumnSettings.vue):显隐勾选 + 拖动手柄排序 + 固定到左 / 右 + 恢复默认。
   只剩一列时,那一列的勾选框禁用(库的 ColumnSettings.vue 同样禁用,useColumns.toggleShow 也兜底拒绝;不弹提示) */
function colsPanelHtml() {
  const nVis = visibleUnits().length;
  const rows = colsOrdered().map((c, idx) => {
    const on = !state.hidden.includes(c.key), fx = state.fixed[c.key], lastOne = on && nVis === 1;
    const pin = (side, glyph, lab) => `<button class="n-btn tiny${fx === side ? ' on' : ''}" data-act="colFix" data-v="${c.key}:${side}" data-tip="${fx === side ? '取消固定' : lab}" aria-label="${fx === side ? '取消固定' : lab}">${glyph}</button>`;
    return `<div class="colset-row" draggable="true" data-ci="${idx}"><span class="colset-drag">${I_DRAG}</span>
      <span class="colset-lab${lastOne ? ' dis' : ''}"${lastOne ? ' aria-disabled="true"' : ` data-act="colToggle" data-v="${c.key}"`}>${checkHtml(on, false)}<span>${c.label}</span></span>
      <span class="colset-pins">${pin('left', '⇤', '固定到左侧')}${pin('right', '⇥', '固定到右侧')}</span></div>`;
  }).join('');
  return `<div class="colset-pop" data-stop><div class="colset">${rows}<div class="colset-foot"><button class="n-btn sec" data-act="colReset">恢复默认</button></div></div></div>`;
}

/* 「更多」:业务按钮组末尾的一个菜单按钮(设计文档 7.3)。导出 / 导入 / 下载导入模板是宿主给的菜单项,库只出菜单外壳;
   文字按钮 + 下箭头(不用「…」:模块 2 的条件行已有一个「»」图标叫「更多条件」,图标不重名)。
   菜单项与分隔线对应官方 NDropdown 的 options(含 { type: 'divider' }) */
const MORE_ITEMS = [
  { act: 'export', label: '导出' },
  { act: 'import', label: '导入' },
  { sep: true },
  { act: 'tpl', label: '下载导入模板' },
];
function moreHtml() {
  return `<span class="pop-wrap"><button class="n-btn sec${state.moreOpen ? ' on' : ''}" data-act="more" aria-haspopup="menu" aria-expanded="${state.moreOpen}">更多<span class="chev">${I_CHEV}</span></button>${
    state.moreOpen ? `<div class="col-pop more-pop" role="menu" data-stop>${MORE_ITEMS.map(it => it.sep
      ? '<div class="sep" role="separator"></div>'
      : `<div class="it" role="menuitem" tabindex="-1" data-act="${it.act}">${it.label}</div>`).join('')}</div>` : ''}</span>`;
}

/* 右侧内置图标:刷新 / 列设置。没有密度按钮:密度是个人偏好,由宿主的个人设置经 defaultDensity 决定(设计文档 5.2),原型宿主默认 compact */
function iconsHtml() {
  return `<div class="tb-icons">
    <button class="n-btn icon${state.max ? ' on' : ''}" data-act="max" data-tip="${state.max ? '还原' : '放大'}" aria-label="${state.max ? '还原' : '放大'}" aria-pressed="${state.max}">${state.max ? I_COMPRESS : I_EXPAND}</button>
    <button class="n-btn icon" data-act="refresh" data-tip="刷新" aria-label="刷新">${I_REFRESH}</button>
    <span class="pop-wrap"><button class="n-btn icon ${state.colsOpen ? 'on' : ''}" data-act="cols" data-tip="列设置" aria-label="列设置">${I_COLS}</button>${
      state.colsOpen ? colsPanelHtml() : ''}</span>
  </div>`;
}

/* 普通工具栏:三档排布全由 CSS 决定,窄档才显示的与宽/中档才显示的元素都在 DOM 里。
   模式 1(模块 1)的搜索在上方独立卡片里,这里没有条件构造器 / 窄档搜索框:.tb.no-cond = 标题 + 业务按钮 + 内置图标;
   「搜索」是淡色按钮(设计 2.13),模式 1 一屏的实心主色就是这里的「新增」,与其他模块一致 */
/* 一行式条件搜索的两份壳(宽 / 中档是 .tb-cond 里的一整行,窄档是 .tb-search 里的「搜索框 + 筛选」),所有带条件搜索的模块共用。
   narrowLabel:窄档那个打开多条件抽屉的按钮名;模块 3 / 4 下面一行已经是列头的「筛选 / 排序」,这里改叫「条件」免得同名 */
function condBlockHtml() {
  const n = activeConds().length;
  return `<div class="tb-cond">
      <div class="cond">
        ${condRowHtml(state.main, 'main')}
        <span class="pop-wrap"><button class="n-btn icon ${state.panelOpen ? 'on' : ''}" data-act="togglePanel" title="更多条件">${I_MORE}${
          n > 1 ? badgeHtml(n) : ''}</button></span>
        <button class="n-btn tint" data-act="search">${I_BTN_SEARCH}搜索</button>
        <button class="n-btn sec" data-act="reset">${I_BTN_RESET}重置</button>
      </div>
      ${state.panelOpen && state.tier !== 'narrow' ? condPanelHtml() : ''}
    </div>`;
}
function condNarrowHtml(narrowLabel = '筛选', cls = '') {
  const n = activeConds().length, label = fieldOf(state.main.field)?.label ?? '';
  return `<div class="tb-search${cls}">
      ${fValHtml(state.main, 'main', false, `搜索 ${label}`)}
      <span class="pop-wrap"><button class="n-btn sec" data-act="togglePanel">${I_BTN_FILTER}${narrowLabel}</button>${n > 0 ? badgeHtml(n) : ''}</span>
    </div>`;
}
/* 工具栏标题是可选的(设计 2.1):单表页面页顶已有页面标题,不再重复表名;同页多张表(模块 11 / 12)与带单据身份的标题(模块 14)才传 */
const tbTitleHtml = (t) => t ? `<h3 class="st-title tb-title">${t}</h3>` : '';
function normalBarHtml() {
  if (!hasCond()) {
    const m = MCx();   // 页面上的按钮都是淡色底(设计 2.15 A):「搜索」「新增」淡绿、「重置」淡灰,没有实心;实心只留给弹窗 / 抽屉里的默认动作
    return `<div class="tb no-cond${state.opsOpen ? ' ops-open' : ''}">
    <div class="tb-left">${tbTitleHtml(m.title)}</div>${m.actions === false ? '' : `
    <button class="n-btn sec ops-toggle" data-act="toggleOps" aria-expanded="${state.opsOpen}">操作&nbsp;<span class="caret">${state.opsOpen ? '▴' : '▾'}</span></button>`}
    <div class="tb-right">${m.actions === false ? '' : `
      <div class="tb-actions">
        <button class="n-btn tint" data-act="add">${I_BTN_PLUS} 新增</button>
        ${moreHtml()}
      </div>`}
      ${iconsHtml()}
    </div>
  </div>`;
  }
  const m = MCx(), acts = m.actions !== false;   // actions:false 的模块(5 / 6)没有业务按钮,窄档也就没有「操作」展开;「新增」恒为淡绿(2.15 A)
  return `<div class="tb${state.opsOpen ? ' ops-open' : ''}" id="searchZone">
    <div class="tb-left">
    ${tbTitleHtml(m.title)}
    ${condBlockHtml()}
    </div>
    ${condNarrowHtml()}${acts ? `
    <button class="n-btn sec ops-toggle" data-act="toggleOps" aria-expanded="${state.opsOpen}">操作&nbsp;<span class="caret">${state.opsOpen ? '▴' : '▾'}</span></button>` : ''}
    <div class="tb-right">${acts ? `
      <div class="tb-actions">
        ${m.excel ? xlActionsHtml() : `<button class="n-btn tint" data-act="add">${I_BTN_PLUS} 新增</button>
        ${moreHtml()}`}
      </div>` : ''}
      ${iconsHtml()}
    </div>
  </div>`;
}

/* 批量栏:原地替换工具栏那一行,高度不小于勾选前的工具栏 */
function batchBarHtml() {
  const ck = new Set(state.checked), rows = pageInfo().slice;   // 复选框状态与表头一致(当前页);「已选 N 项」是跨页总数
  const all = rows.length > 0 && rows.every(r => ck.has(r.no));
  const acts = MCx().batch === 'excel'
    ? `<button class="n-btn tint-e" data-act="xlDel">${I_BTN_TRASH}删除所选</button>${xlCount() ? xlActionsHtml().replace(/<button class="n-btn[^"]*" data-act="add"[\s\S]*?<\/button>/, '') : ''}`   // 模块 14:待保存的修改在批量栏里也看得见、够得着(去掉「新增行」)
    : MCx().batch === 'export'
    ? `<button class="n-btn sec" data-act="batchExport">${I_BTN_DOWN}导出所选</button>`
    : `<button class="n-btn tint" data-act="batchApprove">${I_BTN_CHECK}批量审核</button>\n      <button class="n-btn tint-e" data-act="batchDelAsk" data-v="__batch" aria-haspopup="dialog">${I_BTN_TRASH}批量删除</button>`;
  return `<div class="tb-batch"${state.tbH ? ` style="min-height:${state.tbH}px"` : ''}>
    <span class="bt-info">${checkHtml(all, !all, 'toggleAll')}已选 ${state.checked.length} 项</span>
    <div class="bt-acts">
      ${acts}
    </div>
    <button class="n-btn sec bt-clear" data-act="clearSel">${I_BTN_X}取消选择</button>
    ${iconsHtml()}
  </div>`;
}

/* 已应用条件的 chips —— 收起面板后仍看得见筛了什么;渲染在表格下方、与分页同行(tableEHtml 的 .dt-foot)。
   ≥1 条就输出并带 data-n,宽/中档只在 ≥2 条时显示、窄档 ≥1 条显示,由 CSS 按 data-n 决定 */
const condChipHtml = (c, i, conds) => `<span class="chip">${i > 0 && c.logic === 'or' && conds.slice(0, i).some(x => x.field === c.field) ? '或 ' : ''}${esc(fieldOf(c.field)?.label)} ${esc(OP[c.op].zh)}${
  VALUELESS.has(c.op) ? '' : ' ' + esc(chipVal(c))
}<button data-act="dropChip" data-v="${i}" title="移除">${I_X18}</button></span>`;
function chipsHtml() {
  const conds = activeConds();
  if (!conds.length) return '';
  return `<div class="chips" data-n="${conds.length}"><div class="chips-list">
    ${conds.map((c, i) => condChipHtml(c, i, conds)).join('')}<span class="chip more" hidden></span></div>
    ${conds.length > 1 ? '<button class="clear" data-act="reset">全部清除</button>' : ''}
  </div>`;
}

/* 模块 3 / 4 的工具栏:标题 + 业务按钮 + 内置图标 + 一行式条件搜索(列头仍有筛选 / 排序)。
   宿主的主操作「新增」是本屏唯一主色按钮。窄档没有表头(卡片列表),筛选 / 排序的入口是第 2 行的两个文字按钮(与模块 2 窄档的「输入框 + 筛选」同一行位,行数不变) */
function hdrBarHtml() {

  /* #toolbar 左侧插槽:模块 3 在标题旁放一个宿主的快捷过滤按钮「我负责的」(经 setFilter 写负责人列的过滤值) */
  const mine = HS().fv.owner?.conditions.length === 1 && HS().fv.owner.conditions[0].op === 'equal' && HS().fv.owner.conditions[0].value === '张伟';
  const mk = (cls) => `<button class="n-btn ${mine ? 'tint' : 'sec'} ${cls}" data-act="mine" aria-pressed="${mine}">${I_BTN_USER}我负责的</button>`;
  const slot = state.mod === 'filter' ? mk('slot-w') : '';
  const slotN = state.mod === 'filter' ? mk('slot-n') : '';   // 窄档:左侧插槽放不下,宿主把它收进「操作」展开行
  return `<div class="tb hdr-tb${state.opsOpen ? ' ops-open' : ''}" id="searchZone">
    <div class="tb-left">${MCx().title || slot ? `<div class="tb-title tb-lt">${MCx().title ? `<h3 class="st-title">${MCx().title}</h3>` : ''}${slot}</div>` : ''}
    ${condBlockHtml()}
    </div>
    ${condNarrowHtml('条件', ' tb-csearch')}
    <button class="n-btn sec ops-toggle" data-act="toggleOps" aria-expanded="${state.opsOpen}">操作&nbsp;<span class="caret">${state.opsOpen ? '▴' : '▾'}</span></button>
    <div class="tb-right">
      <div class="tb-actions">
        ${slotN}<button class="n-btn tint" data-act="add">${I_BTN_PLUS} 新增</button>

      <span class="pop-wrap"><button class="n-btn sec" data-act="openFilter">${I_BTN_FILTER}筛选</button>${nf ? badgeHtml(nf) : ''}</span>
      <span class="pop-wrap"><button class="n-btn sec" data-act="openSort">${I_BTN_SORT}排序</button>${ns ? badgeHtml(ns) : ''}</span>
