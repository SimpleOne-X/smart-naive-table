/* 模块 3 / 4 的已生效条件 chips(设计文档 3.2):每条条件一个 NTag,点击重开该列面板,× 删这一条;行末「清除全部」。
   同列第 2 条起若该列是「或」前缀「或 」(与 2.9 一致) */
function hdrChipsHtml() {
  const items = [], sc = activeConds();   // sc = 工具栏条件搜索生效的条件(chip 点 × 走 dropChip),与列头过滤的 chip 同排
  for (const [key, fv] of Object.entries(HS().fv)) {
    fv.conditions.forEach((c, i) => items.push({ key, i, c, or: i > 0 && fv.logic === 'or' }));
  }
  if (!items.length && !sc.length) return '';
  return `<div class="chips"><div class="chips-list">
    ${items.map(({ key, i, c, or }) => `<span class="chip click" data-act="chipOpen" data-v="${key}">${or ? '或 ' : ''}${esc(fieldOf(key).label)} ${esc(OP[c.op].zh)}${
      VALUELESS.has(c.op) ? '' : ' ' + esc(valText(c.value))
    }<button data-act="hfDrop" data-v="${key}:${i}" title="移除" aria-label="移除这条条件">${I_X18}</button></span>`).join('')}${sc.map((c, i) => condChipHtml(c, i, sc)).join('')}<span class="chip more" hidden></span></div>
    ${hfClearShown(items.length + sc.length) ? `<button class="clear" data-act="hfClear">${hasDefaults(state.mod) ? '恢复默认' : '清除全部'}</button>` : ''}
  </div>`;
}

/* ---- 列头过滤面板:气泡与抽屉共用同一份内容,只换容器(设计文档 3.1 / 3.6 / 3.7)---- */
const FILTERABLE = COLS.map(c => c.key);
const szCls = () => (state.tier === 'narrow' ? '' : ' sm');

function hpValHtml(c, i, f) {
  const sm = szCls(), hid = 'h:' + i;
  if (VALUELESS.has(c.op)) return `<div class="f-val novalue"><div class="n-input${sm}" style="pointer-events:none"><span style="color:var(--n-text-3)">不需要填值</span></div></div>`;
  if (['in', 'notIn'].includes(c.op)) {
    return `<div class="f-val">${msCtl(hid, Array.isArray(c.value) ? c.value : [], { sm: !!sm, options: f.type === 'select' ? f.options : null, ph: f.type === 'select' ? '请选择' : '输入后回车', arrow: f.type === 'select' })}</div>`;
  }
  if (f.type === 'select') {
    const id = `hp:val:${i}`, open = state.open === id;
    return `<div class="f-val"><div class="n-select${sm}${open ? ' open' : ''}" data-open="${id}" tabindex="0"><span class="val${c.value ? '' : ' ph'}">${esc(c.value || '请选择')}</span><span class="caret">${I_CHEVD}</span></div>${
      open ? `<div class="dd">${f.options.map(o => `<div class="it${o === c.value ? ' on' : ''}" data-pick="hp:val:${i}:${esc(o)}">${esc(o)}</div>`).join('')}</div>` : ''}</div>`;
  }
  if (f.type === 'number') return `<div class="f-val">${numCtl(hid, c.value, '请输入数字', !!sm)}</div>`;
  if (f.type === 'date') return `<div class="f-val">${dateCtl(hid, c.value, { sm: !!sm })}</div>`;
  return `<div class="f-val"><div class="n-input${sm}"><input type="text" value="${esc(c.value ?? '')}" placeholder="请输入" enterkeyhint="done" data-hpi="${i}" />${clrIco()}</div></div>`;
}

function hpRowHtml(c, i, f) {
  const d = state.hp.d, sm = szCls(), ops = OPS_BY_TYPE[f.type];
  const lid = `hp:logic:${i}`, lopen = state.open === lid;
  const lead = i === 0 ? '<span class="hp-lead">条件</span>'
    : `<div class="logic hp-lead"><div class="n-select${sm}${lopen ? ' open' : ''}" data-open="${lid}" tabindex="0"><span class="val">${d.logic === 'or' ? '或' : '且'}</span><span class="caret">${I_CHEVD}</span></div>${
      lopen ? `<div class="dd"><div class="it${d.logic === 'and' ? ' on' : ''}" data-pick="hp:logic:${i}:and">且</div><div class="it${d.logic === 'or' ? ' on' : ''}" data-pick="hp:logic:${i}:or">或</div></div>` : ''}</div>`;
  const oid = `hp:op:${i}`, oopen = state.open === oid;
  const op = `<div class="f-op"><div class="n-select${sm}${oopen ? ' open' : ''}" data-open="${oid}" tabindex="0"><span class="val">${esc(OP[c.op].zh)}</span><span class="caret">${I_CHEVD}</span></div>${
    oopen ? `<div class="dd">${ops.map(o => `<div class="it${o === c.op ? ' on' : ''}" data-pick="hp:op:${i}:${o}">${OP[o].zh}</div>`).join('')}</div>` : ''}</div>`;
  const del = d.conds.length > 1
    ? `<button class="n-btn icon" data-act="hpDel" data-v="${i}" title="删除这条" aria-label="删除这条条件">${I_X}</button>` : '<span class="hp-del-ph"></span>';
  return `<div class="hp-row">${lead}${op}${hpValHtml(c, i, f)}${del}</div>`;
}

/* 官方单选过滤(filterMultiple: false)用 NRadio;多选用 NCheckbox,且 >1 个选项时第一行是「全选」(ColumnFilter.vue:205-214) */
const H_SINGLE = { filter: { dept: true } };   // 模块 3:部门是单选勾选列(filter.multiple: false)
const H_CUSTOM = { filter: { owner: true } };  // 模块 3:负责人用宿主自定义面板(filter.render)
const OWNERS = ['张伟', '李娜', '王强', '刘洋', '陈静', '赵磊', '周敏', '吴凡', '郑浩', '孙婷', '黄磊', '何欣'];
const radioHtml = (on, act, v) => `<span class="n-radio${on ? ' on' : ''}" role="radio" aria-checked="${on}"${act ? ` data-act="${act}" data-v="${esc(v)}"` : ''}></span>`;
const hpIsSingle = (key) => !!H_SINGLE[state.mod]?.[key];
const hpIsCustom = (key) => !!H_CUSTOM[state.mod]?.[key];
function hpBodyHtml() {
  const { key, d } = state.hp, f = fieldOf(key), options = fieldMode(key) === 'options';
  if (hpIsCustom(key)) {
    const cv = HS().fv[key]?.conditions[0]?.value, cur = Array.isArray(cv) ? cv : (cv ? [cv] : []);
    return `<div class="cust-owners">${OWNERS.map(o => `<button class="n-btn tiny${cur.includes(o) ? ' sel' : ''}" data-act="custOwner" data-v="${o}">${o}</button>`).join('')}</div>`;
  }
  if (options && !d.adv) {
    const single = hpIsSingle(key), n = d.checked.length, all = n === f.options.length;
    const allRow = !single && f.options.length > 1
      ? `<div class="hp-opt hp-all" data-act="hpAll" tabindex="0" role="checkbox" aria-checked="${all ? 'true' : n ? 'mixed' : 'false'}">${checkHtml(all, n > 0 && !all)}<span>全选</span></div>` : '';
    return `<div class="hp-group">${allRow}${f.options.map(o => `<div class="hp-opt" data-act="hpCheck" data-v="${esc(o)}" tabindex="0" role="${single ? 'radio' : 'checkbox'}" aria-checked="${d.checked.includes(o)}">${single ? radioHtml(d.checked.includes(o)) : checkHtml(d.checked.includes(o))}<span>${esc(o)}</span></div>`).join('')}</div>
      <div class="hp-tools"><button class="n-btn sec sm" data-act="hpAdv">高级条件 ▾</button></div>`;
  }
  const add = d.conds.length < MAX_CONDS ? `<button class="n-btn sec sm add-cond" data-act="hpAdd">${I_BTN_PLUS} 添加条件</button>` : '';
  let tools = `<div class="hp-tools">${add}</div>`;
  if (options) {
    const ok = canCollapse();
    tools = `<div class="hp-tools">${add}<span style="margin-left:auto"></span><button class="n-btn sec sm" data-act="hpAdv"${ok ? '' : ' disabled'}>收起高级条件 ▴</button></div>${
      ok ? '' : '<div class="hp-hint" style="margin:-4px 0 8px">含勾选无法表达的条件</div>'}`;
  }
  return d.conds.map((c, i) => hpRowHtml(c, i, f)).join('') + tools;
}

function hpopHtml() {
  const { key, d } = state.hp, custom = hpIsCustom(key), opt = custom || (fieldMode(key) === 'options' && !d.adv);
  return `<div class="hpop${opt ? ' opt' : ''}" data-stop role="dialog" tabindex="-1" aria-label="筛选 ${esc(fieldOf(key).label)}">
    <div class="hp-body"${custom ? ' style="padding:0"' : ''}>${hpBodyHtml()}</div>
    ${custom ? '' : '<div class="hp-foot"><button class="n-btn tiny sec" data-act="hpReset">重置</button><button class="n-btn tiny primary" data-act="hpOk">确认</button></div>'}
  </div>`;
}

/* 气泡定位:官方 placement="bottom"(以漏斗为中心、在其下方),夹进视口;下方放不下且上方放得下时翻到上方(follower 的 flip 等价);
   漏斗随表格横向滚出可视区时整块藏起来。scroll / resize / 每次重绘后都重算 */
function placeHpop() {
  const pop = document.querySelector('#overlay .hpop');
  if (!pop || !state.hp) return;
  const btn = document.querySelector(`#preview [data-fk="${state.hp.key}"]`);
  const sc = document.querySelector('#preview .tbl-scroll');
  if (!btn || !sc) { pop.style.visibility = 'hidden'; return; }
  const r = btn.getBoundingClientRect(), s = sc.getBoundingClientRect();
  if (r.right < s.left + 1 || r.left > s.right - 1) { pop.style.visibility = 'hidden'; return; }
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = r.left + r.width / 2 - w / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
  let top = r.bottom + 6;
  if (top + h > window.innerHeight - 8 && r.top - h - 6 > 8) top = r.top - h - 6;
  pop.style.left = left + 'px'; pop.style.top = top + 'px'; pop.style.visibility = 'visible';
}

/* 窄档抽屉:列头过滤(字段选择 + 同一份面板内容)/ 排序(可排序列各一行,无 / 升序 / 降序) */
function hdrSheetHtml(enter) {
  if (state.sd) return sdSheetHtml(enter);
  const { key } = state.hp, pid = 'hp:field', open = state.open === pid;
  const pick = `<div class="hp-head-pick"><div class="f-field"><div class="n-select${open ? ' open' : ''}" data-open="${pid}"><span class="val">${esc(fieldOf(key).label)}</span><span class="caret">${I_CHEVD}</span></div>${
    open ? `<div class="dd">${FILTERABLE.map(k => `<div class="it${k === key ? ' on' : ''}" data-pick="hp:field:${k}">${esc(fieldOf(k).label)}${hfCount(k) ? ` · ${hfCount(k)}` : ''}</div>`).join('')}</div>` : ''}</div></div>`;
  return `<div class="sheet${enter ? ' enter' : ''}" data-stop>
    <div class="sheet-head"><b>筛选</b><button class="n-btn icon" data-act="closePanel" title="关闭">${I_X}</button></div>
    <div class="sheet-body">${pick}<div class="hp-body">${hpBodyHtml()}</div></div>
    <div class="sheet-foot"><button class="n-btn sec" data-act="hpReset">重置</button><div><button class="n-btn primary" data-act="hpOk">确认</button></div></div>
  </div>`;
}
function sdSheetHtml(enter) {
  const sorters = H_CFG[state.mod].sorters;
  const keys = Object.keys(sorters).sort((a, b) => (sorters[b].multiple ?? 0) - (sorters[a].multiple ?? 0));   // 行序 = 优先级(声明的 multiple 大者在前),手机上只能启停各列
  const cur = (k) => state.sd.sorts.find(s => s.key === k)?.order || 'none';
  const seg = (k) => [['none', '无'], ['ascend', '升序'], ['descend', '降序']].map(([o, l]) =>
    `<button class="${cur(k) === o ? 'on' : ''}" data-act="sdSet" data-v="${k}:${o}" aria-pressed="${cur(k) === o}">${l}</button>`).join('');
  return `<div class="sheet${enter ? ' enter' : ''}" data-stop>
    <div class="sheet-head"><b>排序</b><button class="n-btn icon" data-act="closePanel" title="关闭">${I_X}</button></div>
    <div class="sheet-body">${keys.map(k => `<div class="sd-row"><span class="lab">${esc(fieldOf(k).label)}</span><div class="seg" role="group" aria-label="${esc(fieldOf(k).label)}排序">${seg(k)}</div></div>`).join('')}</div>
    <div class="sheet-foot"><button class="n-btn sec" data-act="sdReset">重置</button><div><button class="n-btn primary" data-act="sdOk">确认</button></div></div>
  </div>`;
}

/* 模式 1:搜索独立卡片 —— 与 src/SearchForm.vue 的 grid 布局一致:
   n-card > n-form(label 在左,labelWidth 70 含 12px 右内边距)> n-grid(cols '1 s:2 m:3 l:4' 按视口、x-gap 16 / y-gap 12、collapsed + collapsedRows 1)
   字段格 n-form-item-gi × N + 最后一格 suffix(搜索 / 重置 / 展开·收起 三个按钮);折叠时超出首行的字段整格隐藏,suffix 恒占最后一格。「搜索」带 loading */
function sfCtlHtml(f) {
  const v = state.sf[f.key], id = 'sf:' + f.key;
  switch (f.ctl) {
    case 'select': {
      const open = state.open === id, ld = f.async && !state.dictReady, flat = optFlat(f.options), cur = flat.find(o => o.v === v);
      const item = (o) => o.disabled ? `<div class="it dis" aria-disabled="true">${esc(o.l)}</div>` : `<div class="it${o.v === v ? ' on' : ''}" data-pick="sf:${f.key}:${esc(o.v)}">${esc(o.l)}</div>`;
      const menu = (f.options ?? []).map(o => (typeof o === 'string' ? item({ v: o, l: o }) : o.g ? `<div class="it-grp">${esc(o.g)}</div>${o.items.map(item).join('')}` : item(o))).join('');
      return `<div class="n-select${open ? ' open' : ''}" data-open="${id}" role="combobox" aria-expanded="${open}" tabindex="0">
        <span class="val${cur ? '' : ' ph'}">${esc(cur?.l ?? '请选择')}</span>${
          v && !ld ? `<span class="clr" data-clear="${f.key}" title="清除">${I_X}</span>` : ''}${ld ? `<span class="caret ld">${spinSvg()}</span>` : `<span class="caret">${I_CHEVD}</span>`}</div>${
        open && !ld ? `<div class="dd">${menu}</div>` : ''}`;
    }
    case 'number': return numCtl(id, v, '请输入数字', false);
    case 'daterange': return dateCtl(id, v, { range: true });
    case 'switch': return switchHtml(v, 'sfSwitch', f.key);
    case 'multi': return msCtl(id, v, { options: f.options, ph: '请选择', arrow: true });
    default: return `<div class="n-input"><input type="text" value="${esc(v ?? '')}" placeholder="请输入" enterkeyhint="search" data-input="sf:${f.key}" />${clrIco()}</div>`;
  }
}
function searchCardHtml() {
  const cols = sfColsNow();
  state.sfCols = cols;
  const vis = sfVisible(cols), ld = state.remote[state.mod].loading;
  return `<div class="n-card search-card">
    <div class="search-grid" data-cols="${cols}">
      ${sfDefs().map(f => `<div class="n-form-item" data-f="${f.key}" style="grid-column:span ${Math.min(f.span ?? 1, cols)}"${vis[f.key] ? '' : ' hidden'}>
        <label>${f.label}</label><div class="sf-ctl">${sfCtlHtml(f)}</div></div>`).join('')}
      <div class="n-form-item search-actions">
        <button class="n-btn tint${ld ? ' loading' : ''}" data-act="sfSearch" aria-busy="${ld}">${ld ? I_LOAD : I_BTN_SEARCH}搜索</button>
        <button class="n-btn sec" data-act="sfReset">${I_BTN_RESET}重置</button>
        ${sfCollapsible() ? `<button class="n-btn text link" data-act="sfToggle" aria-expanded="${!state.sfCollapsed}">${state.sfCollapsed ? '展开' : '收起'}</button>` : ''}
      </div>
    </div>
  </div>`;
}

/* 表格卡片:工具栏(有勾选则批量栏)+ 表格件。模块 1 无条件构造器、无 chips(搜索框里本来就看得见值);
   o.table 仅供测工具栏高度时换成空串 */
function tbCardHtml(o = {}) {
  return `<div class="n-card${MCx().natural ? ' card-top' : ''}">
      ${state.checked.length ? batchBarHtml() : hdrMod() ? hdrBarHtml() : normalBarHtml()}
      ${o.table ?? tableEHtml()}
    </div>`;
}

/* chips 折叠:宽 / 中档 chips 与分页同一行、不换行,放不下的 chip 收进末尾的「+N」(title 列出被收起的条件)。窄档 chips 自成一行可换行,不折。
   做法:先全部显示,若 .chips-list 超出自己的可用宽度,从末尾起逐个隐藏直到放下(至少留 1 个),「+N」本身也计入宽度 */
function foldChips(root) {
  (root ?? document).querySelectorAll('.chips-list').forEach(list => {
    const more = list.querySelector('.chip.more');
    const items = [...list.querySelectorAll('.chip:not(.more)')];
    items.forEach(c => { c.hidden = false; });
    if (more) more.hidden = true;
    if (!more || state.tier === 'narrow' || list.getClientRects().length === 0) return;
    if (list.scrollWidth <= list.clientWidth + 0.5) return;
    more.hidden = false;
    let n = 0;
    for (let k = items.length - 1; k >= 1; k--) {
      items[k].hidden = true; n++;
      more.textContent = '+' + n;
      if (list.scrollWidth <= list.clientWidth + 0.5) break;
    }
    more.title = items.filter(c => c.hidden).map(c => c.firstChild.textContent.trim()).join(String.fromCharCode(10));
  });
}

/* 模式 1 页面 = 搜索卡片 + 表格卡片(两卡片间距 = .smart-table 的 gap 16px) */
function schemeAHtml() {
  return `<div class="smart-table" data-density="${state.compact ? 'compact' : 'normal'}"${state.max ? ' data-max' : ''}>
    ${searchCardHtml()}
    ${tbCardHtml()}

/* ============================================================
   覆盖层:底部抽屉(窄档筛选)+ toast。都 teleport 到 body,不放进 .smart-table。
   逐个节点增量更新,避免每次重绘都重播遮罩淡入 / 抽屉滑入动画。
   ============================================================ */
const OV_ORDER = ['mask', 'sheet', 'modal-root', 'xl-root', 'hpop', 'dp-pop', 'xl-pop', 'pconf', 'toast'];
function ovChild(ov, cls) { return Array.from(ov.children).find(c => c.classList.contains(cls)); }
function ovSync(ov, cls, html, keep) {
  const cur = ovChild(ov, cls);
  if (!html) { if (cur) cur.remove(); return; }
  if (cur && ((keep && keep(cur)) || cur.__html === html)) return;   // 内容没变就不换节点:不丢焦点 / 输入中的文字 / 滚动位置
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  const el = t.content.firstElementChild;
  el.__html = html;
  if (cur) {
    const top = cur.querySelector('.sheet-body')?.scrollTop ?? 0;   // 抽屉整体被换掉,内部滚动位置要带过去
    cur.replaceWith(el);
    const body = el.querySelector('.sheet-body');
    if (body && top) body.scrollTop = top;
    return;
  }
  const idx = OV_ORDER.indexOf(cls);
  const next = Array.from(ov.children).find(c => OV_ORDER.findIndex(k => c.classList.contains(k)) > idx);
  ov.insertBefore(el, next || null);
}

function renderOverlay() {

/* ---- NTooltip:带 data-tip 的按钮悬停 100ms 后弹出(placement top,放不下翻到下方);点击 / 键盘 / 重绘 / 滚动即收 ---- */
let tipTimer = 0, tipEl = null, tipTarget = null;

    const f = inp.files?.[0];
    if (!f) return;
    f.text().then(t => toast(`已导入 ${f.name}:${Math.max(0, t.replace(/^\ufeff/, '').split(/\r?\n/).filter(Boolean).length - 1)} 条`));
  };

}
function exportCsv() {
  const rows = apiAll(pagerKey());
  const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  downloadCsv('物料单据.csv', [CSV_HEAD, ...rows.map(r => [r.no, r.name, r.owner, r.status, r.dept, r.amount.toFixed(2), r.bizDate, r.memo])].map(l => l.map(q).join(',')).join('\r\n'));

/* 切模块 = 宿主重新挂载表格:勾选清空;挂载即请求(immediate 默认 true;模块 8 是 immediate: false,等点「搜索」);模块 6 的部门字典是异步的 */
function enterModule(m) {
  state.mod = m; state.view = null; closeFloats();
  state.tbW = 0;                                   // 各模块的工具栏高度不同,占位高度要重新量
  state.checked = [];
  state.crud = null; state.dlg = null;
  state.dictReady = m !== 'dict';
  if (m === 'dict') setTimeout(() => { state.dictReady = true; if (state.mod === 'dict') renderPreview(); }, 900);
  render();
  if (MC[m].immediate !== false) load(m);
}
function runAct(act, v) {
  switch (act) {
    case 'mod': enterModule(v); return;
    case 'view': state.view = v; closeFloats(); state.crud = null; state.dlg = null; state.drawer = null; state.pick = null; render(); trFlush(); return;   // 外壳文档页(升级变更)
    case 'theme':  state.theme = v; document.documentElement.dataset.theme = v; render(); return;

    /* 筛选 */
    case 'togglePanel': state.panelOpen = !state.panelOpen; state.open = null; renderPreview(); return;
    case 'closePanel':  state.panelOpen = false; state.open = null; state.hp = null; state.sd = null; state.dp = null; renderPreview(); return;

    case 'max':
      state.max = !state.max; closeFloats(); renderPreview();
      if (kbdModality) document.querySelector('#preview [data-act="max"]')?.focus();   // 重绘会换掉按钮节点:键盘用户把焦点还给它(连续回车可反复切换);鼠标用户不还,否则会冒出焦点环
      return;
    case 'noop': return;   // 列宽把手:点一下什么都不做(也不冒泡成排序)

    /* 模块 3 / 4:表头排序 */
    case 'sortClick': {   // 官方循环 降序 → 升序 → 取消;多列模式保留其它列,单列模式互斥
      HS().sorts = applySort(HS().sorts, v, nextOrder(sortOrderOf(v)), H_CFG[state.mod].multiple);
      firstPage(state.mod); requery(); return;
    }
    /* 模块 3 / 4:列头过滤面板 */
    case 'hfOpen': {      // 点漏斗:开 / 关该列面板(同列再点 = 关)
      if (state.hp?.key === v) hpClose(); else { state.hp = { key: v, d: hpDraft(v) }; state.hpFocus = true; }
      state.open = null; renderPreview(); return;
    }
    case 'chipOpen':      // 点 chip:打开该列面板(窄档是抽屉)
      state.hp = { key: v, d: hpDraft(v) }; state.hpFocus = true; state.open = null; renderPreview(); return;
    case 'hpCheck': {
      const d = state.hp.d, c = d.checked, i = c.indexOf(v);
      if (hpIsSingle(state.hp.key)) d.checked = [v];   // 单选(NRadio):选中即替换,不能点掉,「重置」清除
      else if (i >= 0) c.splice(i, 1); else c.push(v);
      renderPreview(); return;
    }
    case 'hpAll': {
      const d = state.hp.d, all = fieldOf(state.hp.key).options;
      d.checked = d.checked.length === all.length ? [] : all.slice();
      renderPreview(); return;
    }
    case 'mine': {
      const on = HS().fv.owner?.conditions.length === 1 && HS().fv.owner.conditions[0].op === 'equal';
      if (on) delete HS().fv.owner; else HS().fv.owner = { logic: 'and', conditions: [{ op: 'equal', value: '张伟' }] };
      firstPage(state.mod); requery(); return;
    }
    case 'custOwner': {   // 宿主自定义面板:点一下就经 setValue 落到过滤态并重新请求(面板不自带「确认」)
      const cv = HS().fv.owner?.conditions[0]?.value, cur = Array.isArray(cv) ? [...cv] : (cv ? [cv] : []), i = cur.indexOf(v);
      if (i >= 0) cur.splice(i, 1); else cur.push(v);
      if (cur.length) HS().fv.owner = { logic: 'and', conditions: [{ op: 'in', value: cur }] }; else delete HS().fv.owner;
      firstPage(state.mod); requery(); return;
    }
    case 'hpAdv': {       // options 列:勾选 ↔ 高级条件。展开时把勾选转写成条件,收起仅当条件能被勾选表达
      const { key, d } = state.hp;
      if (!d.adv) { d.conds = checkedToConds(key, d.checked); d.logic = 'and'; d.adv = true; }
      else if (canCollapse()) { d.checked = optionsRepr({ logic: d.logic, conditions: draftActive(key, d.conds) }) ?? []; d.adv = false; }
      state.open = null; renderPreview(); return;
    }
    case 'hpAdd': {
      const { key, d } = state.hp;
      if (d.conds.length < MAX_CONDS) d.conds.push(blankCond(key));
      state.open = null; renderPreview(); return;
    }
    case 'hpDel': state.hp.d.conds.splice(Number(v), 1); state.open = null; renderPreview(); return;
    case 'hpOk':    hpCommit(); requery(); return;
    case 'hpReset': hpReset(); requery(); return;   // 官方「重置」立即生效并关闭;恢复该列的 filter.defaultValue(没有 defaultValue 即清除)
    case 'hfDrop': { const [k, i] = v.split(':'); dropHfCond(k, Number(i)); requery(); return; }
    case 'hfClear': hfClearAll(); hpClose(); firstPage(state.mod); requery(); return;
    /* 窄档入口 */
    case 'openFilter': {
      const k = Object.keys(HS().fv)[0] ?? FILTERABLE[0];
      state.hp = { key: k, d: hpDraft(k) }; state.open = null; renderPreview(); return;
    }
    case 'openSort': state.sd = { sorts: HS().sorts.map(s => ({ ...s })) }; state.open = null; renderPreview(); return;
    case 'sdSet': {
      const [k, o] = v.split(':');
      state.sd.sorts = applySort(state.sd.sorts, k, o === 'none' ? false : o, H_CFG[state.mod].multiple);
      renderPreview(); return;
    }
    case 'sdOk':    HS().sorts = state.sd.sorts; state.sd = null; firstPage(state.mod); requery(); return;
    case 'sdReset': HS().sorts = defaultSorts(state.mod); state.sd = null; firstPage(state.mod); requery(); return;
    case 'addCond':
      const grp = [state.main, ...state.more].filter(x => x.field === 'name');
      state.more.push({ field: 'name', op: 'contains', value: '', logic: grp.some(x => x.logic === 'or') ? 'or' : 'and' });
      state.open = null; renderPreview(); return;
    case 'delCond':
      state.more.splice(Number(v), 1); state.open = null; renderPreview(); return;
    case 'search': doSearch(); requery(); return;
    case 'reset':  doReset(); requery(); return;
    case 'dropChip': dropChip(Number(v)); requery(); return;

    /* 模式 1 搜索卡片 */
    case 'sfSearch': if (state.remote[state.mod].loading) return; doSfSearch(); requery(); return;
    case 'sfSwitch': state.sf[v] = !state.sf[v]; renderPreview(); return;
    case 'sfReset':  doSfReset(); requery(); return;
    case 'sfToggle': state.sfCollapsed = !state.sfCollapsed; state.open = null; redraw(); return;

    /* 工具栏 */
    case 'toggleOps': state.opsOpen = !state.opsOpen; renderPreview(); return;
    case 'cols':      state.colsOpen = !state.colsOpen; renderPreview(); return;
    case 'exToggle': {   // 展开行(expand 列的 renderExpand):点一下展开 / 收起收货明细
      if (state.expanded[v]) delete state.expanded[v]; else state.expanded[v] = true;
      renderPreview(); return;
    }
    case 'sfClear': if (MC[state.mod].sf) doSfReset(); if (hasCond()) doReset(); requery(); return;   // 清除条件 = 搜索表单与工具栏条件搜索一起重置   // 模块 8 的空状态 extra:清除条件 = 重置并重新查询
    case 'batchExport': {   // 模块 5 批量栏:导出所选(宿主的批量操作)
      const set = new Set(state.checked), rows = WIDE_DATA.filter(r => set.has(r.no)), leaves = leavesOf('wide');
      const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
      downloadCsv('物料清单-所选.csv', [leaves.map(c => c.label), ...rows.map(r => leaves.map(c => r[c.key]))].map(l => l.map(q).join(',')).join('\r\n'));
      toast(`已导出所选 ${rows.length} 项`); return;
    }
    case 'colToggle': {
      const i = state.hidden.indexOf(v);
      if (i >= 0) state.hidden.splice(i, 1);
      else if (visibleUnits().length <= 1) return;   // 最后一列的勾选框是禁用的,这里只是兜底
      else state.hidden.push(v);
      csSave(); redraw(); return;
    }
    case 'colFix': {
      const [k, side] = v.split(':');
      if (state.fixed[k] === side) delete state.fixed[k]; else state.fixed[k] = side;
      csSave(); redraw(); return;
    }
    case 'colReset':   // 恢复默认:顺序 / 显隐 / 固定 / 列宽全部还原(ColumnSettings.vue + SmartTable.vue:308-312)
      state.cs[state.mod] = csFresh(state.mod); csClear();   // 同时清掉 storageKey 里存的
      redraw(); return;
    case 'refresh': requery(); return;   // 刷新的反馈 = 表格 loading(库没有消息提示)
    case 'more':    state.moreOpen = !state.moreOpen; renderPreview(); return;
    case 'export':  state.moreOpen = false; renderPreview(); exportCsv(); return;   // 选中菜单项后收起(NDropdown 同)
    case 'import':  state.moreOpen = false; renderPreview(); importCsv(); return;
    case 'tpl':     state.moreOpen = false; renderPreview(); downloadCsv('物料导入模板.csv', CSV_HEAD.join(',')); toast('已下载导入模板'); return;
    case 'add': crudOpen('create'); return;   // 新增 → 弹窗表单(模块 9)

    /* 分页 */
    case 'pgPrev': if (goPage(pageInfo().page - 1)) requery(); return;
    case 'pgNext': if (goPage(pageInfo().page + 1)) requery(); return;

    /* 行与批量 */
    case 'toggleRow': toggleRow(v); redraw(); return;
    case 'toggleAll': toggleAll(); redraw(); return;
    case 'clearSel':  clearSel(); redraw(); return;
    case 'edit': crudOpen('edit', v); return;
    case 'crudSave': crudSubmit(); return;
    case 'crudCancel': crudClose(); return;
    case 'crudMask': crudClose(); return;   // mask-closable
    case 'delAsk': pcOpen(v); return;   // 删除先确认(NPopconfirm)
    case 'pcNo':   state.pc = null; renderPreview(); return;
    case 'batchDelAsk': state.open = null; state.pc = null; state.dlg = { kind: 'batchDel' }; renderPreview(); return;   // 批量删除 → NDialog warning
    case 'dlgNo': state.dlg = null; renderPreview(); return;
    case 'dlgYes': { state.dlg = null; const n = batchDel(); requery(); toast(`已删除 ${n} 项`, 'success'); return; }
    case 'pcYes': {
      const no = state.pc?.no; state.pc = null;
      if (no === '__discard') { xlDiscard(); return; }
      if (no === '__batch') { const n = batchDel(); requery(); toast(`已删除 ${n} 项`); return; }
      if (no && delRow(no)) { requery(); toast(`已删除 ${no}`); } else renderPreview();
      return;
    }
    case 'batchApprove': {

      const n = batchApprove();
      requery(); toast(n ? `已审核 ${n} 项` : `所选 ${total} 项无需审核`); return;
    }
    case 'batchDel': {
      const n = batchDel();
      requery(); toast(`已删除 ${n} 项`); return;
    }
  }
}

/* ---- 列宽拖拽 ----
   第一次按下把手:把所有可见列冻结成「当前渲染宽度」(库的 freezeWidths),最后一个数据列的 col 不写宽度、吸收剩余宽度,重绘一次后列宽视觉不变;
   之后只直接改 <col> 宽度与表格 min-width(不重绘,拖动不掉帧)。用 document 级 pointer 事件,所以中途重绘换掉把手节点也不影响手势。
   下限 colMin;拖动时收起过滤气泡(气泡锚在漏斗上,列宽一变就对不上);刚拖完的一小段时间内吞掉 click,免得松手落在表头上连带触发排序。 */
/* 最近一次输入方式:键盘 / 指针。只有键盘操作时,重绘后才需要主动把焦点还给按钮 */
let kbdModality = false;
document.addEventListener('keydown', () => { kbdModality = true; }, true);
document.addEventListener('pointerdown', () => { kbdModality = false; }, true);

let rz = null, rzBlockUntil = 0;
function rzStart(e, key) {
  const cols = visibleCols();
  if (!isFrozen()) {
    cols.forEach(c => {
      const th = document.querySelector(`#preview thead th[data-ck="${c.key}"]`);
      if (th) state.colW[c.key] = Math.round(th.getBoundingClientRect().width);
    });
  }
  const col = cols.find(c => c.key === key);
  if (!col || state.colW[key] == null) return;
  state.hp = null; state.open = null;
  /* 起点取「此刻实际渲染宽度」而不是钉住的宽度:吸收余量的最后一列实际宽度可能比它钉住的宽度大,
     用钉住的宽度当起点,向右拖半天也超不过它当前宽度,看起来像拖不动 */
  const th0 = document.querySelector(`#preview thead th[data-ck="${key}"]`);
  const w0 = th0 ? Math.round(th0.getBoundingClientRect().width) : state.colW[key];
  state.colW[key] = w0;
  rz = { key, x0: e.clientX, w0, min: colMin(col), moved: false };
  renderPreview();
  document.querySelector(`#preview .th-resize[data-rz="${key}"]`)?.classList.add('active');
  document.body.classList.add('rz-ing');
  const sc = document.querySelector('#preview .tbl-scroll');
  if (sc) { rz.sc = sc; rz.guide = document.createElement('div'); rz.guide.className = 'rz-guide'; sc.appendChild(rz.guide); rzGuide(); }
  document.addEventListener('pointermove', rzMove);
  document.addEventListener('pointerup', rzEnd);
  document.addEventListener('pointercancel', rzEnd);
  window.addEventListener('blur', rzEnd);
}
function rzMove(e) {
  if (!rz) return;
  const w = Math.max(rz.min, Math.round(rz.w0 + e.clientX - rz.x0));
  if (w === state.colW[rz.key]) return;
  rz.moved = true; state.colW[rz.key] = w;
  const cols = visibleCols(), tbl = document.querySelector('#preview table.n-table');
  if (!tbl) return;
  if (rz.key !== fillColKey(cols)) tbl.querySelectorAll('colgroup col')[cols.findIndex(c => c.key === rz.key) + 2].style.width = w + 'px';   // 填充列的 col 不写宽度,它的「钉住宽度」只作为最小宽度进 min-width(拖宽超出容器才有效,拖窄不低于填满容器)
  tbl.style.minWidth = tableMinW(cols) + 'px';
  fixMeasure(rz.sc); fixShadow(rz.sc);
  rzGuide();
}
/* 引导线:贯穿整张表(滚动内容坐标),落在被拖列的右边线上;高度取滚动内容总高,虚拟滚动的 spacer 已撑出整页高度 */
function rzGuide() {
  const th = document.querySelector(`#preview th[data-ck="${rz.key}"]`);
  if (!rz.guide || !th) return;
  const r = th.getBoundingClientRect(), s = rz.sc.getBoundingClientRect();
  rz.guide.style.left = Math.round(r.right - s.left + rz.sc.scrollLeft - 1) + 'px';
  rz.guide.style.height = rz.sc.scrollHeight + 'px';
}
function rzEnd() {
  if (!rz) return;
  rz.guide?.remove();
  if (rz.moved) rzBlockUntil = performance.now() + 150;
  csSave();   // 列宽也记住(storageKey)
  rz = null;
  document.body.classList.remove('rz-ing');
  document.querySelectorAll('.th-resize.active').forEach(x => x.classList.remove('active'));
  document.removeEventListener('pointermove', rzMove);
  document.removeEventListener('pointerup', rzEnd);
  document.removeEventListener('pointercancel', rzEnd);
  window.removeEventListener('blur', rzEnd);
}
document.addEventListener('pointerdown', (e) => {
  const h = e.target.closest?.('.th-resize');
  if (!h || e.button) return;
  e.preventDefault();
  rzStart(e, h.dataset.rz);
});

/* 重绘会销毁旧节点:renderPreview / renderOverlay 内部已在重绘前后记住并还原焦点(captureFocus / restoreFocus),这里只需重绘 */
const repaint = () => renderPreview();

/* 日期面板里的点击(面板在 #overlay,data-stop) */
function dpClick(t) {
  const d = state.dp;
  const nav = t.closest('[data-dpn]');
  if (nav) { const [side, w] = nav.dataset.dpn.split(':'); dpNav(side, w); renderOverlay(); return; }
  const tt = t.closest('[data-dpt]');
  if (tt) { d.jump = d.jump === tt.dataset.dpt ? null : tt.dataset.dpt; renderOverlay(); return; }
  const j = t.closest('[data-dpj]');
  if (j) {
    const [side, kind, val] = j.dataset.dpj.split(':'), key = side === 'l' ? 'vl' : 'vr';
    d[key] = kind === 'y' ? { y: Number(val), m: d[key].m } : { y: d[key].y, m: Number(val) };
    if (d.range) {
      if (side === 'l' && monthIdx(d.vr) <= monthIdx(d.vl)) d.vr = fromIdx(monthIdx(d.vl) + 1);
      if (side === 'r' && monthIdx(d.vr) <= monthIdx(d.vl)) d.vl = fromIdx(monthIdx(d.vr) - 1);
    }
    renderOverlay(); return;
  }
  const dd = t.closest('[data-dpd]');
  if (dd) { d.jump = null; const r = dpPick(dd.dataset.dpd); if (r === 'commit') renderPreview(); else renderOverlay(); return; }
  const a = t.closest('[data-dpa]');
  if (a) {
    const k = a.dataset.dpa;
    if (a.disabled) return;
    if (k === 'clear') dpClear(); else if (k === 'now') dpNow(); else if (k === 'ok') dpConfirm();
    renderPreview(); return;
  }
  // 点面板空白处:只收起快速跳转(它是面板里的子面板,点它之外算「点了别处」)
  if (d.jump && !t.closest('.dp-jump')) { d.jump = null; renderOverlay(); }
}

document.addEventListener('click', (e) => {
  if (performance.now() < rzBlockUntil) return;   // 列宽拖拽刚结束:松手产生的 click 不算点击
  const t = e.target;
  if (t.closest('.dp-pop')) { dpClick(t); return; }
  const inStop = !!t.closest('[data-stop]');
  const actEl = t.closest('[data-act]');
  const act = actEl?.dataset.act;
  let dirty = false;

  /* 日期面板:点触发器之外一律收起,未确认的范围丢弃 */
  if (state.dp && !t.closest('[data-dp]')) { dpClose(); dirty = true; }
  /* 删除确认气泡:点它自己和删除按钮之外一律收起 */
  if (state.pc && !t.closest('.pconf') && act !== 'delAsk' && act !== 'batchDelAsk' && act !== 'xlDiscard') { state.pc = null; dirty = true; }

  /* 列设置气泡:点它自己和它的按钮之外一律收起(任何 act 执行前都先收) */
  if (state.colsOpen && !t.closest('.colset-pop') && act !== 'cols') { state.colsOpen = false; dirty = true; }
  if (state.moreOpen && !t.closest('.more-pop') && act !== 'more') { state.moreOpen = false; dirty = true; }

  /* 列头过滤气泡 / 窄档抽屉:点它们之外一律收起(漏斗、chip、窄档入口自己处理开关;气泡与抽屉都带 data-stop,里面的点击不算「之外」) */
  if ((state.hp || state.sd) && !inStop && !['hfOpen', 'chipOpen', 'openFilter', 'openSort', 'custOwner'].includes(act)) {
    state.hp = null; state.sd = null; state.open = null; dirty = true;
  }

  /* 多选 tag:移除标签 / 点选项(不收菜单)/ 点控件本身(展开并聚焦输入) */
  const msx = t.closest('[data-msx]');
  if (msx) { msToggle(msx.dataset.msx, msx.dataset.v, false); state.open = `ms:${msx.dataset.msx}`; renderPreview(); return; }
  const msp = t.closest('[data-mspick]');
  if (msp) { msToggle(msp.dataset.mspick, msp.dataset.v); state.msq[msp.dataset.mspick] = ''; state.focusAfter = 'msin:' + msp.dataset.mspick; renderPreview(); return; }
  const ms = t.closest('[data-ms]');
  if (ms) {
    const id = ms.dataset.ms;
    if (state.open !== `ms:${id}`) { state.open = `ms:${id}`; state.hl = null; }
    state.focusAfter = 'msin:' + id; renderPreview(); return;
  }

  /* 文本框清除 ×(NInput clearable)/ 数字框 − +(NInputNumber 默认按钮):直接改输入框并走 input 事件,不重绘,焦点留在输入框 */
  const ci = t.closest('[data-clearin]');
  if (ci) { const inp = ci.closest('.n-input').querySelector('input'); inp.value = ''; inp.dispatchEvent(new Event('input', { bubbles: true })); inp.focus(); return; }
  const ns = t.closest('[data-numstep]');
  if (ns) {
    const [id, d] = ns.dataset.numstep.split('|'), cur = Number.parseFloat(valGet(id)), nv = String(+((Number.isNaN(cur) ? 0 : cur) + Number(d)).toFixed(10));
    valSet(id, nv);
    document.querySelectorAll(`[data-num="${CSS.escape(id)}"]`).forEach(x => { x.value = nv; x.dataset.ok = nv; });
    ns.closest('.n-input').querySelector('input').focus(); return;
  }
  /* 日期选择器:清除 × / 打开面板 */
  const dpc = t.closest('[data-dpclear]');
  if (dpc) { valSet(dpc.dataset.dpclear, null); if (state.dp?.id === dpc.dataset.dpclear) dpClose(); renderPreview(); return; }
  const dpt = t.closest('[data-dp]');
  if (dpt) {
    const id = dpt.dataset.dp;
    if (state.dp?.id !== id) { state.open = null; dpOpen(id, dpt.classList.contains('pair')); renderPreview(); }
    else if (dirty) renderPreview();
    return;
  }

  /* 0. 模式 1 下拉框里的清除 ×(在触发器之内,须先于 1 处理) */
  const clr = t.closest('[data-clear]');
  if (clr) { state.sf[clr.dataset.clear] = ''; state.open = null; renderPreview(); return; }

  /* 1. 下拉触发器 */
  const opener = t.closest('[data-open]');
  if (opener) {
    const id = opener.dataset.open;
    state.open = state.open === id ? null : id; state.hl = null;
    renderPreview();
    return;
  }

  /* 2. 下拉选项 */
  const pick = t.closest('[data-pick]');
  if (pick) {
    const [kind, id, ...rest] = pick.dataset.pick.split(':');
    const val = rest.join(':');
    if (kind === 'sf') { state.sf[id] = val; state.open = null; renderPreview(); return; }   // 模式 1 的下拉:只改草稿
    if (kind === 'f') { valSet('f:' + id, val); if (state.crud) crudValidate(id); state.open = null; state.focusAfter = 'open:f:' + id; renderPreview(); return; }   // 弹窗表单的下拉
    if (kind === 'pgsize') { const ch = setPageSize(Number(id)); state.open = null; if (ch) requery(); else renderPreview(); return; }   // 分页的每页条数
    if (kind === 'hp') {   // 列头过滤面板 / 抽屉里的下拉:只改草稿,点「确认」才提交
      const d = state.hp?.d;
      if (id === 'field') state.hp = { key: rest[0], d: hpDraft(rest[0]) };   // 窄档抽屉换字段:草稿重取该列已提交的值
      else if (d) {
        const i = Number(rest[0]), v2 = rest.slice(1).join(':'), c = d.conds[i];
        if (id === 'op' && c) {
          const multi = (o) => ['in', 'notIn'].includes(o);
          if (VALUELESS.has(v2) || multi(v2) !== multi(c.op)) c.value = multi(v2) ? [] : '';   // 换比较符后值的形态(标量 / 数组 / 无值)不再适用就清空,不猜测转换
          c.op = v2;
        } else if (id === 'logic') d.logic = v2;   // 且 / 或是按列一个值(FilterValue.logic)
        else if (id === 'val' && c) c.value = v2;
      }
      state.open = null; renderPreview(); return;
    }
    const c = condById(id);
    if (kind === 'field') {
      c.field = val;
      const allowed = OPS_BY_TYPE[fieldOf(val).type];
      if (!allowed.includes(c.op)) c.op = allowed[0];   // 换字段后比较符要仍然讲得通
      c.value = ['in', 'notIn'].includes(c.op) ? [] : '';
      // 换字段后加入别的字段组:且/或跟着那一组走(FilterValue.logic 是按字段一个值)
      const grp = [state.main, ...state.more].filter(x => x !== c && x.field === val);
      c.logic = grp.some(x => x.logic === 'or') ? 'or' : 'and';
    } else if (kind === 'op') {
      const multi = (o) => ['in', 'notIn'].includes(o);
      if (VALUELESS.has(val) || multi(val) !== multi(c.op)) c.value = multi(val) ? [] : '';
      c.op = val;
    } else if (kind === 'val') {
      c.value = val;
      // 窄档没有搜索按钮:顶栏那个枚举下拉选完即生效;抽屉里是批量编辑多个条件,仍要点「确认」
      if (id === 'main' && pick.closest('.tb-search')) { doSearch(); state.open = null; requery(); return; }
    } else if (kind === 'logic') {
      // 库的数据模型里「且/或」是按字段一个值(FilterValue.logic),所以同字段联动,不允许一条 且 一条 或
      [state.main, ...state.more].filter(x => x.field === c.field).forEach(x => { x.logic = val; });
    }
    state.open = null;
    renderPreview();
    return;
  }

  /* 3. 动作按钮:气泡之外的动作(含遮罩)等于「点了别处」,先收起下拉与气泡 */
  if (actEl) {
    // 导出/编辑这类只弹 toast 的动作自己不重绘,但这里已收起了浮层,要补一次重绘,免得界面与 state 失步
    const stale = dirty || (!inStop && act !== 'togglePanel' && (state.open !== null || state.panelOpen));
    if (!inStop && act !== 'togglePanel') { state.open = null; state.panelOpen = false; }
    runAct(act, actEl.dataset.v);
    if (stale) repaint();
    return;
  }

  /* 4. 点空白处收起弹层;data-stop 区域(气泡 / 抽屉 / 列设置)里点空白只收下拉 */
  if (!t.closest('.dd')) {
    if (!inStop && (state.open !== null || state.panelOpen)) { state.open = null; state.panelOpen = false; dirty = true; }
    else if (inStop && state.open !== null) { state.open = null; dirty = true; }
  }
  if (dirty) repaint();
});

/* 键盘:
   Esc 分层(列头过滤面板):有下拉 / 日期面板展开 → 只收起它,面板与草稿还在;没有 → 关闭浮层并丢草稿,焦点还给漏斗;再按 → 放大还原。
   面板内 Tab 循环、选择框 / 勾选行可键盘操作、值框回车确认。输入法组词中的回车不算 */
const FOCUSABLE = 'input:not([disabled]), button:not([disabled]), [tabindex]:not([tabindex="-1"])';
const isVisible = (x) => x.offsetParent !== null || x === document.activeElement;
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.dp) { dpClose(); renderPreview(); return; }
    if (state.open !== null) { state.open = null; state.hl = null; renderPreview(); return; }
    if (state.pc) { state.pc = null; renderPreview(); return; }
    if (state.dlg) { state.dlg = null; renderPreview(); return; }
    if (state.crud) { crudClose(); return; }
    if (state.hp) state.hpReturn = state.hp.key;
    if (state.panelOpen || state.colsOpen || state.moreOpen || state.hp || state.sd) { closeFloats(); renderPreview(); return; }
    if (state.max) { state.max = false; renderPreview(); }
    return;
  }
  if (e.isComposing || e.keyCode === 229) return;   // 229:Safari 输入法确认那一下 isComposing 已是 false
  const tg = e.target;

  /* NModal 的焦点陷阱:Tab 在弹窗 / 抽屉 / 确认框内循环 */
  if (e.key === 'Tab' && (state.crud || state.dlg)) {
    const root = document.querySelector('#overlay .modal-root');
    if (root) {
      const items = [...root.querySelectorAll(FOCUSABLE)].filter(isVisible);
      const first = items[0], last = items[items.length - 1], cur = document.activeElement;
      if (!root.contains(cur)) { e.preventDefault(); first?.focus(); return; }
      if (e.shiftKey && cur === first) { e.preventDefault(); last?.focus(); return; }
      if (!e.shiftKey && cur === last) { e.preventDefault(); first?.focus(); return; }
    }
  }

  /* Tab 在列头过滤面板内循环(role=dialog 的常规做法;草稿不丢) */
  if (e.key === 'Tab' && state.hp && !hpIsCustom(state.hp.key)) {
    const pop = tg.closest?.('.hpop');
    if (pop) {
      const items = [...pop.querySelectorAll(FOCUSABLE)].filter(isVisible);
      const first = items[0], last = items[items.length - 1], cur = document.activeElement;
      if (e.shiftKey && (cur === first || cur === pop)) { e.preventDefault(); last?.focus(); return; }
      if (!e.shiftKey && cur === last) { e.preventDefault(); first?.focus(); return; }
    }
  }

  /* 选择框(div[tabindex] 的 NSelect 复刻):Enter / 空格 / ↓ 展开;展开后 ↑ ↓ 移动高亮,Enter 选中,Tab 收起 */
  const sel = tg.matches?.('[data-open]') ? tg : null;
  if (sel) {
    const id = sel.dataset.open, isOpen = state.open === id;
    const items = () => [...sel.parentElement.querySelectorAll('.dd .it')];
    if (!isOpen && (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown')) {
      e.preventDefault(); state.open = id; renderPreview();
      const its = items(); const on = its.findIndex(x => x.classList.contains('on')); state.hl = on >= 0 ? on : 0; applyHl(); return;
    }
    if (isOpen) {
      const its = items();
      if (e.key === 'ArrowDown') { e.preventDefault(); state.hl = Math.min(its.length - 1, (state.hl ?? -1) + 1); applyHl(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); state.hl = Math.max(0, (state.hl ?? its.length) - 1); applyHl(); return; }
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); its[state.hl ?? 0]?.click(); return; }
      if (e.key === 'Tab') { state.open = null; renderPreview(); return; }
    }
    return;
  }
  /* 勾选行 / 过滤面板里的选项行:div[tabindex],Enter / 空格 = 点击 */
  if ((e.key === 'Enter' || e.key === ' ') && tg.matches?.('div[data-act][tabindex]')) { e.preventDefault(); tg.click(); return; }

  /* 多选 tag 的输入框 */
  const msin = tg.closest?.('[data-msin]');
  if (msin) {
    const id = msin.dataset.msin, vals = Array.isArray(valGet(id)) ? valGet(id) : [];
    const fd = (() => { const f = sfDefs().find(x => 'sf:' + x.key === id); return f?.options ?? null; })();
    if (e.key === 'Enter') {
      e.preventDefault();
      const q = (state.msq[id] ?? '').trim();
      if (q) {
        const menu = [...(msin.closest('[data-ms]')?.querySelectorAll('.dd .it') ?? [])];
        const pickV = fd ? menu[0]?.dataset.v : q;   // 有候选项的(select 列 / 自定义多选):回车选第一个匹配项;没有候选项的(tag):把敲的文字变成标签
        if (pickV !== undefined && !vals.includes(pickV)) msToggle(id, pickV, true);
        state.msq[id] = '';
        state.focusAfter = 'msin:' + id; renderPreview();
      }
      return;
    }
    if (e.key === 'Backspace' && !msin.value && vals.length) { msToggle(id, vals[vals.length - 1], false); state.focusAfter = 'msin:' + id; renderPreview(); return; }
    return;
  }

  /* NInputNumber:↑ ↓ 步进 1 */
  const num = tg.closest?.('[data-num]');
  if (num && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault();
    const cur = Number.parseFloat(num.value), base = Number.isNaN(cur) ? 0 : cur, nv = String(+(base + (e.key === 'ArrowUp' ? 1 : -1)).toFixed(10));
    num.value = nv; num.dataset.ok = nv; valSet(num.dataset.num, nv);
    return;
  }

  if (e.key !== 'Enter') return;
  if (num) { ctlEnter(num.dataset.num); return; }
  if (tg.closest?.('[data-dpi]')) { if (state.dp) { dpClose(); renderPreview(); } return; }
  const pj = tg.closest?.('[data-pgjump]');
  if (pj) { pgJump(pj); return; }
  if (tg.closest?.('[data-hpi]') && state.hp) { hpCommit(); requery(); return; }   // 列头过滤面板值输入框里回车 = 确认
  const inp = tg.closest?.('[data-input]');
  if (!inp) return;
  if (inp.dataset.input.startsWith('sf:')) doSfSearch(); else doSearch();   // 模式 1 字段里回车 = 点搜索
  requery();
});

  let ctl;
  switch (kind) {
    case null: ctl = `<span class="xf-ro">${xlDisplay(c, f.vals, true)}</span>`; break;
    case 'input': ctl = `<div class="n-input${ec}"><input type="text" data-xfin="${c.key}" value="${esc(v ?? '')}" placeholder="${esc('请输入' + c.label)}" autocomplete="off" /></div>`; break;
    case 'textarea': ctl = `<div class="n-input ta${ec}"><textarea rows="4" data-xfin="${c.key}" placeholder="${esc('请输入' + c.label)}">\n${esc(v ?? '')}</textarea></div>`; break;
    case 'number': ctl = numCtl(id, v === null || v === undefined ? '' : String(v), '请输入数字', false, { clear: false }).replace('class="n-input num"', `class="n-input num${ec}"`); break;
    case 'select-table': ctl = `<div class="n-select${ec}" tabindex="0" data-xst="fopen" role="combobox" aria-haspopup="dialog"><span class="val${v ? '' : ' ph'}">${esc(v || '请选择')}</span><span class="caret">${I_CHEVD}</span></div>`; break;
    case 'select': ctl = `<div class="n-select${f.open === c.key ? ' open' : ''}${ec}" tabindex="0" data-xfsel="${c.key}" role="combobox" aria-expanded="${f.open === c.key}"><span class="val${v ? '' : ' ph'}">${esc(v || '请选择')}</span><span class="caret">${I_CHEVD}</span></div>`; break;
    case 'date': ctl = dateCtl(id, v, {}).replace('class="n-input dp', `class="n-input dp${ec}`); break;
    case 'datetime': ctl = `<div class="n-input dp${ec}${state.dp?.id === id ? ' open' : ''}" data-dp="${id}"><input type="text" data-xfin="${c.key}" value="${esc(v ?? '')}" placeholder="选择日期时间" autocomplete="off" /><span class="ico-r${v ? ' has-v' : ''}"><span class="ico-date">${I_DATE}</span><span class="ico-clear" data-dpclear="${id}">${I_CLEAR}</span></span></div>`; break;
    case 'checkbox': ctl = `<span class="xf-ck">${checkHtml(!!v, false, 'xfToggle', c.key)}</span>`; break;
  }
  return `<div class="fm-item${inf.kind === 'textarea' ? ' ta' : ''}"><div class="fm-lab"><span class="fm-t">${c.label}</span>${c.rules?.required ? '<span class="fm-ast">*</span>' : ''}</div><div class="fm-ctl">${ctl}</div><div class="fm-fb">${err ? `<span class="fm-err">${esc(err)}</span>` : ''}</div></div>`;
}
function xlSheetHtml() {
  const f = state.xl.form, title = f.isNew ? '新增工序' : '编辑工序', enter = !f.shown;
  f.shown = true;
  const foot = `<button class="n-btn sec" data-act="xfCancel"${f.saving ? ' disabled' : ''}>取消</button><button class="n-btn primary${f.saving ? ' loading' : ''}" data-act="xfSave" aria-busy="${f.saving}">${f.saving ? I_LOAD : ''}保存</button>`;
  return `<div class="xl-root" data-stop><div class="mask" data-act="xfCancel"></div><div class="sheet crud-sheet xl-form${enter ? ' enter' : ''}" role="dialog" aria-modal="true" aria-label="${title}" tabindex="-1">
    <div class="sheet-head"><b>${title}</b><button class="n-btn icon" data-act="xfCancel" aria-label="关闭">${I_X}</button></div>
    <div class="sheet-body"><div class="fm-wrap"><form class="fm" novalidate onsubmit="return false">${XL_UNITS.map(xfFieldHtml).join('')}</form></div></div>
    <div class="sheet-foot crud-foot">${foot}</div></div></div>`;
}
function xfSave() {
  const x = state.xl, f = x.form;
  if (!f || f.saving) return;
  f.errs = {};
  const out = {};
  for (const c of XL_UNITS) {
    const inf = xlInf(c);
    if (!inf.kind || (f.lock && c.key !== 'status')) continue;
    const r = xlParse(c, inf.kind, f.vals[c.key], f.no);
    if (r.ok) out[c.key] = r.val; else f.errs[c.key] = r.msg;
  }
  if (Object.keys(f.errs).length) { renderPreview(); return; }
  f.saving = true; renderPreview();
  setTimeout(() => {   // 行级即时保存:模拟 500ms 请求
    if (x.form !== f) return;
    let n = 0;
    if (f.isNew) { XL_DATA.push({ no: f.no, ...out }); n = 1; firstPage('excel'); }
    else {
      const row = xlRow(f.no), base = { ...row, ...(x.orig[f.no] ?? {}) };   // 与「改之前的值」比,草稿里已改的格也算这次保存的
      for (const k of Object.keys(out)) if (!xlEq(base[k], out[k])) n++;
      Object.assign(row, out); delete x.orig[f.no];
    }
    x.form = null; state.dp = null;
    load('excel');
    if (n) toast(`已保存 ${n} 处修改`, 'success'); else renderPreview();
  }, 500);
}

/* ---- 事件接入 ---- */
const _runAct2 = runAct;
runAct = function (act, v) { if (b4Act(act, v)) return; _runAct2(act, v); };
function b4Act(act, v) {
  switch (act) {
    case 'add': if (state.mod === 'excel') { xlAdd(); return true; } return false;
    case 'xlSave': xlSave(); return true;
    case 'xlDiscard': xlDiscardAsk(); return true;   // 放弃修改先确认(NPopconfirm),点「放弃」才真还原
    case 'xlDel': xlDeleteChecked(); return true;
    case 'xfCancel': xfClose(); return true;
    case 'xfSave': xfSave(); return true;
    case 'xfToggle': { const f = state.xl.form; if (f) { f.vals[v] = !f.vals[v]; renderPreview(); } return true; }
  }
  return false;
}
const xlOn = () => state.mod === 'excel' && !state.view;
const xlStop = (e) => { e.preventDefault(); e.stopImmediatePropagation(); };

/* 点击(捕获阶段,先于原型原有的全局点击处理):下拉选项 / 点到编辑格之外 = 提交 / 点单元格 = 选中 → 再点 = 编辑 / 复选框直接切换 / 窄档点卡片开抽屉 */
document.addEventListener('click', (e) => {
  if (!xlOn()) return;
  const x = state.xl, t = e.target;
  const stEl = t.closest?.('[data-xst]');   // select-table 面板里的点击(选行 / 搜索 / 翻页 / 每页条数 / 关闭)
  if (stEl && (stEl.dataset.xst === 'fopen' || xlSt())) { xlStop(e); xlStAct(stEl.dataset.xst, stEl); return; }
  if (x.form) {
    const sel = t.closest?.('[data-xfsel]'), pk = t.closest?.('[data-xfpick]');
    if (pk) { const f = x.form; f.vals[f.open] = pk.dataset.xfpick; delete f.errs[f.open]; f.open = null; xlStop(e); renderPreview(); return; }
    if (sel) { x.form.open = x.form.open === sel.dataset.xfsel ? null : sel.dataset.xfsel; state.dp = null; xlStop(e); renderPreview(); return; }
    if (x.form.open && !t.closest('.xl-pop')) { x.form.open = null; renderPreview(); }
    return;
  }
  if (state.tier === 'narrow') {
    const rc = t.closest?.('#preview .rc[data-no]');
    if (rc && !t.closest('.n-check, [data-act], button, a, .drag-handle')) { xlStop(e); xfOpen(rc.dataset.no); }
    return;
  }
  const pk = t.closest?.('[data-xpick]');
  if (pk && x.edit) { x.edit.val = pk.dataset.xpick; xlStop(e); xlFinish(null); return; }
  if (t.closest?.('.dp-pop')) return;   // 日期面板:交给 dpClick
  const td = t.closest?.('#preview td[data-xc]');
  const inEditor = x.edit && (t.closest?.('.xl-pop') || (td && x.edit.no === td.dataset.xc.split('|')[0] && x.edit.key === td.dataset.xc.split('|')[1]));
  if (inEditor) return;
  let dirty = false;
  if (x.edit) {   // 点到编辑格之外:合法 = 提交并继续处理这次点击;不合法 = 留在编辑态(红框 + 提示),吞掉这次点击
    if (!xlCommit()) { xlStop(e); x.errShow = true; renderPreview(); return; }
    dirty = true;
  }
  if (!td) { if (dirty) renderPreview(); return; }
  const [no, key] = td.dataset.xc.split('|');
  xlStop(e);
  if (t.closest('[data-xck]')) { xlToggle(no, key); x.sel = { no, key }; x.err = null; x.focusSel = true; renderPreview(); return; }
  if (x.sel && x.sel.no === no && x.sel.key === key && !dirty) { xlEnter(no, key, 'mouse'); return; }
  x.sel = { no, key };
  if (dirty) { x.err = null; x.focusSel = true; renderPreview(); } else xlSelChanged();
}, true);

/* 键盘(捕获阶段):选中态 ↑↓←→ / Tab / Enter · F2 / 打字 / Space / Delete;编辑态 Enter / Tab / Esc;窄档抽屉 Esc */
document.addEventListener('keydown', (e) => {
  if (!xlOn()) return;
  const x = state.xl, k = e.key;
  if (x.form) {
    const fst = x.form.st;
    if (fst && (k === 'ArrowDown' || k === 'ArrowUp')) { xlStop(e); xlStMove(k === 'ArrowDown' ? 1 : -1); return; }
    if (fst && k === 'Enter') { xlStop(e); if (e.target.matches?.('[data-xstj]')) xlStJump(e.target); else xlStEnter(); return; }
    if (k !== 'Escape') return;
    xlStop(e);
    if (fst) { if (fst.q) xlStClear(); else { x.form.st = null; renderPreview(); } return; }
    if (state.dp) { state.dp = null; renderPreview(); } else if (x.form.open) { x.form.open = null; renderPreview(); } else if (!x.form.saving) xfClose();
    return;
  }
  if (state.tier === 'narrow' || e.isComposing || e.keyCode === 229) return;
  const ed = x.edit;
  if (ed) {
    if (ed.kind === 'select-table' && x.st) {   // 工序库选择器:Esc 先清搜索、再关;↓ ↑ 在表里移动高亮;Enter = 选高亮行 / 只剩 1 个匹配时选它(页码框里 = 跳页)
      if (k === 'Escape') { xlStop(e); if (x.st.q) xlStClear(); else xlCancel(); return; }
      if (k === 'ArrowDown' || k === 'ArrowUp') { xlStop(e); xlStMove(k === 'ArrowDown' ? 1 : -1); return; }
      if (k === 'Enter') { xlStop(e); if (e.target.matches?.('[data-xstj]')) xlStJump(e.target); else xlStEnter(); return; }
    }
    if (k === 'Escape') { xlStop(e); xlCancel(); return; }
    if (k === 'Tab') { xlStop(e); xlFinish(e.shiftKey ? 'left' : 'right'); return; }
    if (ed.kind === 'select') {
      const n = xlOptions(xlCol(ed.key)).length;
      if (k === 'ArrowDown' || k === 'ArrowUp') { xlStop(e); ed.hl = Math.max(0, Math.min(n - 1, (ed.hl ?? 0) + (k === 'ArrowDown' ? 1 : -1))); renderOverlay(); return; }
      if (k === 'Enter' || k === ' ') { xlStop(e); if (ed.hl !== null) ed.val = xlOptions(xlCol(ed.key))[ed.hl] ?? ed.val; xlFinish(k === 'Enter' ? 'down' : null); return; }
      return;
    }
    if (k === 'Enter') { if (ed.kind === 'textarea' && e.shiftKey) return; xlStop(e); xlFinish('down'); }
    return;
  }
  const s = x.sel;
  if (!s || x.saving || !(e.target === document.body || e.target.matches?.('td.xsel'))) return;
  const c = xlCol(s.key), inf = xlInf(c);
  const nav = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[k];
  if (nav) { xlStop(e); if (xlMove(nav, false)) xlSelChanged(); return; }
  if (k === 'Tab') { xlStop(e); if (xlMove(e.shiftKey ? 'left' : 'right', true)) xlSelChanged(); return; }
  if (k === 'Enter' || k === 'F2') { xlStop(e); xlEnter(s.no, s.key, 'key'); return; }
  if (k === ' ') { xlStop(e); if (inf.kind === 'checkbox') { xlToggle(s.no, s.key); x.err = null; x.focusSel = true; renderPreview(); } return; }
  if (k === 'Delete' || k === 'Backspace') { xlStop(e); xlClear(); return; }
  if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && ['input', 'textarea', 'number', 'select-table'].includes(inf.kind)) {
    if (inf.kind === 'number' && !/[0-9.\-]/.test(k)) return;
    xlStop(e); xlEnter(s.no, s.key, { ch: k });
  }
}, true);

/* 输入:编辑框里的字只改 state(不重绘,免得丢焦点);抽屉表单同理 */
document.addEventListener('input', (e) => {
  if (!xlOn()) return;
  const x = state.xl, el = e.target, xe = el.closest?.('[data-xe]');
  if (el.matches?.('[data-stq]')) { const st = xlSt(); if (st) { st.q = el.value; st.page = 1; st.hl = -1; xlStLive(); const b = document.querySelector('#overlay .st-body'); if (b) b.scrollTop = 0; } return; }   // select-table 搜索框:敲字实时过滤(回到第 1 页)
  if (xe && x.edit) {
    x.edit.val = xe.value;
    if (x.err) { x.err = null; el.closest('.n-input')?.classList.remove('err'); document.querySelector('td.xerr')?.classList.remove('xerr'); tipHide(); }
    return;
  }
  const xdt = el.closest?.('[data-xdt]');
  if (xdt) { xlDtTyped(xdt); return; }
  const xf = el.closest?.('[data-xfin]');
  if (xf && x.form) {
    const key = xf.dataset.xfin, had = !!x.form.errs[key];
    x.form.vals[key] = xf.value;
    if (had) { delete x.form.errs[key]; renderPreview(); }
  }
});

/* 焦点保持:编辑框 / 抽屉输入框 / 日期时间面板里的输入框,重绘后还回去 */
const _fidOf2 = fidOf;
fidOf = function (el) {
  const n = el?.closest?.('[data-xed]'); if (n) return 'xed:';
  const d = el?.closest?.('[data-xdt]'); if (d) return 'xdt:' + d.dataset.xdt;
  const f = el?.closest?.('[data-xfin]'); if (f) return 'xfin:' + f.dataset.xfin;
  return _fidOf2(el);
};
const _findFid2 = findFid;
findFid = function (fid) {
  if (fid.startsWith('xed:')) return document.querySelector('[data-xed]');
  if (fid.startsWith('xdt:')) return document.querySelector(`[data-xdt="${fid.slice(4)}"]`);
  if (fid.startsWith('xfin:')) return document.querySelector(`[data-xfin="${CSS.escape(fid.slice(5))}"]`);
  return _findFid2(fid);
};

/* 渲染钩子:覆盖层(浮层 / 抽屉)· 重绘后的焦点与滚动 · 进入模块时清掉选中 / 编辑态(草稿保留) */
const _ro2 = renderOverlay;
renderOverlay = function () {
  const ov = $('overlay'), live = !!$('preview') && xlOn();
  if (ov) {
    ovSync(ov, 'xl-pop', live ? xlPopHtml() : '', xlPopKeep);
    ovSync(ov, 'xl-root', live && state.xl.form ? xlSheetHtml() : '');
  }
  _ro2();
  if (ov && live) { placeXlPop(); if (state.xl.form) document.body.style.overflow = 'hidden'; }
};
const _rp2 = renderPreview;
renderPreview = function () { _rp2(); if (xlOn()) xlAfterRender(); };
function xlAfterRender() {
  const x = state.xl;
  if (!x.err) tipHide();   // 校验提示是程序弹出的(不靠悬停):错误清掉后(Esc / 改对了提交 / 放弃)要跟着收,否则气泡会留在原地
  if (state.tier === 'narrow') {   // 窄档没有逐格编辑:从宽档带过来的选中 / 编辑态清掉
    if (x.edit || x.sel) { x.edit = null; x.sel = null; x.err = null; if (state.dp?.id?.startsWith('x:')) state.dp = null; renderPreview(); }
    return;
  }
  if (x.form) { x.form = null; if (state.dp?.id?.startsWith('xf:')) state.dp = null; renderPreview(); return; }   // 窄 → 宽:抽屉收掉
  if (x.pendingEdit) {
    const p = x.pendingEdit;
    if (pageInfo().slice.some((r) => r.no === p.no)) { x.pendingEdit = null; xlEnter(p.no, p.key, 'key'); return; }
    if (!state.remote.excel.loading && state.remote.excel.loaded) x.pendingEdit = null;   // 请求回来了还不在这一页(被条件筛掉):放弃
  }
  const e = x.edit;
  if (e) {
    const el = document.querySelector('[data-xed]');
    if (el && !e.focused) {
      e.focused = true;
      el.focus({ preventScroll: true });
      if (e.kind === 'select-table') xlStScroll();
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') { const L = el.value.length; try { if (e.sel === 'all') el.setSelectionRange(0, L); else el.setSelectionRange(L, L); } catch (err) { /* 不支持选区的 input */ } }
      document.querySelector('#preview td.xed')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }
  } else if (x.focusSel) {
    x.focusSel = false;
    const td = document.querySelector('#preview td.xsel');
    if (td) { td.focus({ preventScroll: true }); td.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
  }
  if (x.errShow) {   // 重绘后横向滚动位置恢复会异步触发 scroll,而 scroll 会收掉气泡(tipHide):等一小会儿再弹
    x.errShow = false;
    setTimeout(() => { const td = document.querySelector('#preview td.xerr'); if (td && xlOn() && state.xl.err) { tipShow(td); trFlush(); } }, 80);
  }
}
const _enter2 = enterModule;
enterModule = function (m) { const x = state.xl; x.sel = null; x.edit = null; x.err = null; x.form = null; x.pendingEdit = null; _enter2(m); };
window.addEventListener('resize', () => { if (xlOn()) placeXlPop(); });
document.addEventListener('scroll', () => { if (xlOn() && state.xl.edit) placeXlPop(); }, true);
/*B4-END*/
function render() {
  renderMods();
  renderSidePanel();
  renderStage();
  renderOverlay();
}

state.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';   // 跟随系统,和真实应用一致
document.documentElement.dataset.theme = state.theme;
render();
if (MC[state.mod].immediate !== false) load(state.mod);   // 首次进入:挂载即请求(宿主 immediate 默认 true),表体 loading
/* 容器档位变了才重绘(气泡 ↔ 抽屉切换);宽度只在档内变化时全靠 CSS 容器查询 */
window.addEventListener('resize', () => {
  const pv = $('preview');
  if (!pv) return;
  if ((previewW(pv) > 0 && tierOf(previewW(pv)) !== state.tier)
    || (MCx().sf && sfColsNow() !== state.sfCols)) renderPreview();   // 模式 1:视口跨过 s/m/l 断点,列数与折叠可见数都要重算
  else { foldChips($('preview')); if (state.hp) placeHpop(); if (state.dp) placeDp(); if (state.pc) placePc(); }
});
</script>
</body>
